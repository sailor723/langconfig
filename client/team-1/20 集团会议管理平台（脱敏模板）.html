<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>集团会议管理平台</title>
<style>
:root{
  --bg:#eef5fd; --surface:#ffffff; --surface2:#f3f8fe;
  --ink:#0d2244; --ink2:#2f4a72; --muted:#6d85a7;
  --line:#d8e6f6; --line2:#edf4fc;
  --nav:#0e2c55; --nav2:#1f66d8;
  --accent:#2476e0; --accent-deep:#1a5bc0; --accent-soft:#e4f0ff;
  --green:#0f9d62; --green-bg:#dff7ec;
  --yellow:#cf8a10; --yellow-bg:#fdf3dd;
  --red:#e2433a; --red-bg:#fdeceb;
  --shadow:0 1px 2px rgba(23,64,120,.05),0 6px 18px rgba(23,64,120,.07);
  --shadow-lg:0 12px 36px rgba(23,64,120,.15);
  --r:14px; --r-sm:9px;
  --font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SW Mono","Cascadia Code","Consolas","JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#e6f0fd 0%,#f3f8ff 300px,#edf4fd 100%);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#ffffff 0%,#eef7ff 55%,#e3f0ff 100%);color:var(--ink);border-bottom:1px solid #d4e3f5;box-shadow:0 1px 12px rgba(30,80,160,.07)}
.topbar-inner{width:100%;max-width:none;margin:0;padding:0 20px;display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{width:33px;height:33px;border-radius:10px;background:linear-gradient(135deg,#3cc2ff,#2f7cf2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 4px 10px rgba(47,124,242,.28)}
.brand .t1{font-size:16px;font-weight:700;letter-spacing:.4px;color:#123a74}
.nav{display:flex;gap:2px;margin-left:2px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#b9c9e2 transparent;flex:1 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;color:#45618e;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(36,118,224,.09);color:#1f66d8}
.nav button.active{background:linear-gradient(135deg,#2f8bf0,#2264d8);color:#fff;box-shadow:0 3px 9px rgba(36,118,224,.32)}
.nav button .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
.nav button.active .dot{opacity:1;background:#fff}
.nav .divider{width:1px;background:rgba(31,80,150,.22);margin:6px 4px}
.nav button.util{color:#6d85a7;font-weight:500}
.nav button.active.util{color:#fff}
.nav button.lead{background:linear-gradient(135deg,#2f8bf0,#1f5fc4);color:#fff;box-shadow:0 3px 9px rgba(31,95,196,.3)}
.nav button.lead:hover{filter:brightness(1.08);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.syncchip{font-size:11px;color:#5f7ba3;display:flex;align-items:center;gap:6px;white-space:nowrap}
.syncchip .d{width:7px;height:7px;border-radius:50%;background:#17c98f;box-shadow:0 0 0 3px rgba(23,201,143,.2)}
.rolectl{display:flex;align-items:center;gap:5px;background:rgba(36,118,224,.07);padding:3px 6px 3px 8px;border-radius:10px;border:1px solid #cfe0f7}
.rolectl label{font-size:10.5px;color:#4a6b96}
.rolectl select{background:#ffffff;color:#123a74;border:1px solid #c4d9f6;border-radius:7px;padding:4px 6px;font-size:12px;font-family:inherit;max-width:130px;box-shadow:0 1px 3px rgba(23,64,120,.06)}
.rolectl .ident{font-size:12px;color:#1d5fb8;background:#dcecff;padding:5px 9px;border-radius:7px;white-space:nowrap}
.avatar{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;box-shadow:0 3px 8px rgba(37,99,235,.28)}
/* ===== 红色预警滚动条 ===== */
.marquee{background:linear-gradient(90deg,#fdf1f2 0%,#fff7f5 100%);border-bottom:1px solid #f2cfd2;color:#a1163a;overflow:hidden;position:relative;height:35px;display:flex;align-items:center}
.marquee .tag{flex:0 0 auto;background:linear-gradient(135deg,#fb6b5c,#e8364b);color:#fff;height:100%;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;font-weight:700;z-index:2;box-shadow:6px 0 10px rgba(232,54,75,.2)}
.marquee .track{display:flex;gap:38px;white-space:nowrap;animation:scroll 420s linear infinite;padding-left:20px}
.marquee:hover .track{animation-play-state:paused}
.marquee .mi{font-size:12.5px;color:#b12248;display:flex;align-items:center;gap:8px;cursor:pointer}
.marquee .mi:hover{color:#7f0d2c}
.marquee .mi b{color:#e02a3f}
.marquee .mi .pid{font-family:var(--mono);background:#ffe3e6;color:#c71f43;padding:1px 6px;border-radius:4px;font-size:11px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ===== 布局 ===== */
.wrap{width:100%;max-width:none;margin:0;padding:10px 22px 28px}
#main{width:100%}
.crumb{display:none}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{opacity:.5}
.crumb button{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:2px 4px;border-radius:5px}
.crumb button:hover{background:var(--accent-soft)}
.scope-banner{display:none;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid #c9dcf7;color:#163c80;padding:7px 14px;border-radius:10px;font-size:12.5px;margin-bottom:8px;font-weight:500}
.scope-banner.show{display:flex}
.grid{display:grid;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-12{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-9{grid-column:span 9}.span-12{grid-column:span 12}
.section-title{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
.section-title::before{content:"";width:5px;height:17px;background:linear-gradient(180deg,#3ec1ff,#2476e0);border-radius:3px}
.section-title h2{font-size:15.5px;letter-spacing:.2px}
.section-title .sub{font-size:12px;color:var(--muted);font-weight:400}
.section-title .rule{flex:1;height:1px;background:var(--line)}
.section-title .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 10px;border-radius:20px;background:#fff;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:13.5px}
.card-h .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.card-h .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:11px 16px}
.card-b.flush{padding:0}
.card-b[style*="max-height"]{overflow-y:auto}
.backchip{display:inline-flex;align-items:center;gap:5px;border:1px solid #c4d9f6;background:#fff;color:#1f66d8;font-size:12px;font-weight:600;padding:4px 12px;border-radius:16px;cursor:pointer;margin-right:10px;white-space:nowrap;box-shadow:0 1px 3px rgba(23,64,120,.08)}
.backchip:hover{background:#2f8bf0;color:#fff;border-color:#2f8bf0}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;box-shadow:var(--shadow);overflow:hidden}
.kpi .lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.3}
.kpi .val{font-size:22px;font-weight:800;margin-top:2px;line-height:1;letter-spacing:-.4px}
.kpi .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .foot{font-size:11px;margin-top:3px;color:var(--muted);line-height:1.35}
.kpi .sub{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:1px}
.kpi .sub .r{display:grid;grid-template-columns:26px minmax(0,1fr) 78px;align-items:baseline;column-gap:4px;font-size:11px;color:#5b6b85;line-height:1.45}
.kpi .sub .r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .sub .r .c{font-family:var(--mono);font-weight:700;color:#45618e;white-space:nowrap}
.kpi .sub .r .v{font-weight:700;color:#123a74;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:10.5px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.st-green .bar{background:var(--green)} .kpi.st-green .val{color:var(--green)}
.kpi.st-yellow .bar{background:var(--yellow)} .kpi.st-yellow .val{color:var(--yellow)}
.kpi.st-red .bar{background:var(--red)} .kpi.st-red .val{color:var(--red)}
.kpi.st-plain .bar{background:#94a3b8}
/* 厂对比卡 */
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#b9c9e2}
.fcard .strip{position:absolute;top:0;left:0;right:0;height:4px}
.fcard .top{display:flex;align-items:center;gap:10px;padding:14px 15px 10px}
.fcard .flogo{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:0 0 auto}
.fcard .fname{font-size:15px;font-weight:700}
.fcard .fmeta{font-size:11.5px;color:var(--muted)}
.fcard .body{padding:4px 15px 12px;display:flex;flex-direction:column;gap:10px}
.fcard .go{padding:9px 15px;border-top:1px solid var(--line2);font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:5px;background:var(--surface2)}
.fstat .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.fstat .row b{font-size:17px;color:var(--ink);font-weight:800}
.fstat .track{height:7px;background:var(--line2);border-radius:5px;overflow:hidden;margin-top:4px}
.fstat .fill{height:100%;border-radius:5px}
/* 表 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:4px 11px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
thead th.r,tbody td.r{text-align:right}
thead th.c,tbody td.c{text-align:center}
tbody td{padding:3px 11px;border-bottom:1px solid var(--line2);vertical-align:middle;line-height:1.3}
tbody tr{transition:.1s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.row-id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rate-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.rate-cell .mini{width:50px;height:6px;background:var(--line2);border-radius:4px;overflow:hidden;flex:0 0 auto}
.rate-cell .mini i{display:block;height:100%;border-radius:4px}
.td-target{font-size:10.5px;color:var(--muted);font-weight:400;display:block}
/* 徽标 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.p-green{background:var(--green-bg);color:var(--green)} .p-green .d{background:var(--green)}
.p-yellow{background:var(--yellow-bg);color:var(--yellow)} .p-yellow .d{background:var(--yellow)}
.p-red{background:var(--red-bg);color:var(--red)} .p-red .d{background:var(--red)}
.p-grey{background:#eef2f7;color:var(--muted)} .p-grey .d{background:var(--muted)}
.p-blue{background:var(--accent-soft);color:var(--accent)} .p-blue .d{background:var(--accent)}
.p-dark{background:var(--nav2);color:#dce8fa}
.tag-dim{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.tag-4m{font-size:11px;padding:2px 8px;border-radius:5px;background:#e7f6ee;color:#0f7a46;font-weight:600;white-space:nowrap}
.tag-sim{font-size:11px;padding:2px 8px;border-radius:5px;background:#f3e8fd;color:#7c3aed;font-weight:600;white-space:nowrap}
.repeat-flag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--yellow-bg);color:#a06a08;font-weight:700;white-space:nowrap}
.chk-flag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:700;white-space:nowrap}
.chk-ok{background:var(--green-bg);color:var(--green)}
.chk-warn{background:var(--yellow-bg);color:#a06a08}
.chk-bad{background:var(--red-bg);color:var(--red)}
/* 列表行 */
.alert-item{display:flex;align-items:center;gap:10px;padding:4px 12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.1s}
.alert-item:hover{background:var(--surface2)}
.alert-item:last-child{border-bottom:0}
.alert-sev{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10.5px}
.alert-sev.red{background:var(--red-bg);color:var(--red)}
.alert-sev.yellow{background:var(--yellow-bg);color:var(--yellow)}
.alert-sev.grey{background:#eef2f7;color:var(--muted)}
.alert-sev.green{background:var(--green-bg);color:var(--green)}
.alert-main{min-width:0;flex:1}
.alert-main .a1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-main .a2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* AI 内审卡（卡头评分 + 问题清单） */
.ai{background:#fbfcff;border:1px solid #c6d4ea;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ai-h{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#eef4fd,#f4f6fd);border-bottom:1px solid #dbe5f3}
.ai-h .spark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#3ec1ff,#2f7cf2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;box-shadow:0 3px 8px rgba(47,124,242,.25)}
.ai-h h3{font-size:14px;color:var(--nav)}
.ai-h .tag{font-size:10.5px;color:#8b6a00;background:#fff4d6;border:1px solid #ecd9a0;padding:2px 9px;border-radius:20px;font-weight:600}
.ai-h .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.ai-score{display:flex;align-items:baseline;gap:4px;background:#fff;border:1px solid #d7e2f2;border-radius:9px;padding:4px 13px;box-shadow:0 1px 3px rgba(16,32,58,.06)}
.ai-score .n{font-size:23px;font-weight:800;color:var(--accent);line-height:1}
.ai-score .n small{font-size:11px;color:var(--muted);font-weight:600}
.ai-score .cap{font-size:10px;color:var(--muted)}
.ai-b{padding:11px 14px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.ai-block .bh{font-size:11px;color:var(--accent);letter-spacing:.4px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ai-block .bh::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent)}
.ai-block .bv{font-size:13px;line-height:1.55;color:#2a3a55}
.ai-block .bv .hl{color:var(--accent);font-weight:700}
.ai-block .bv .warn{color:#b3492c;font-weight:700}
.find-list{display:flex;flex-direction:column;gap:5px}
.find{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink2);cursor:pointer;transition:.12s;line-height:1.4}
.find:hover{border-color:#b9c9e2;background:var(--surface2)}
.find .fd{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.find .fd.r{background:var(--red)}.find .fd.y{background:var(--yellow)}.find .fd.g{background:var(--green)}
.find b{color:var(--ink)}
.ai-note{font-size:11px;color:#8a93a6;padding:0 14px 8px}
.ai-note b{color:#6b7280}
.breakdown{display:flex;flex-direction:column;gap:8px}
.bd-row .top{display:flex;justify-content:space-between;font-size:12px;color:#41506b;margin-bottom:3px}
.bd-row .top b{color:var(--ink);font-weight:700}
.bd-row .trk{height:7px;background:#e9eef5;border-radius:5px;overflow:hidden}
.bd-row .fl{height:100%;border-radius:5px}
.bd-grp{font-size:10px;color:var(--muted);margin:2px 0}
/* 图表 */
.chart{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* 工具栏/筛选 */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
.select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);max-width:200px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.14s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b9c9e2;background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.sm{padding:5px 10px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--nav2);color:#fff;border-color:var(--nav2)}
.dimcells{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:12px}
.dimcell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;transition:.15s;position:relative}
.dimcell:hover{border-color:#b9c9e2;box-shadow:var(--shadow)}
.dimcell.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dimcell .dn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.dimcell .dn .sq{width:26px;height:26px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.dimcell .dv{margin-top:8px;display:flex;align-items:baseline;justify-content:space-between}
.dimcell .dv b{font-size:20px;font-weight:800}
.dimcell .dm{font-size:11px;color:var(--muted);margin-top:4px}
/* 工厂列（部门达标榜） */
.fac-col{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.fac-col .fh{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;transition:.12s}
.fac-col .fh:hover{background:var(--accent-soft)}
.fac-col .fh .fl{width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.fac-col .fh b{font-size:14px}
.fac-col .fh .fm{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
.fac-col .band{padding:8px 13px 10px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line2)}
.fac-col .band .bh2{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.fac-col .bk{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;padding:1px 2px;border-radius:5px;transition:.1s}
.fac-col .bk:hover{background:var(--accent-soft)}
.fac-col .bk .b1{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fac-col .bk .b2{font-weight:800}
.fac-col .bk .b2.g{color:var(--green)}.fac-col .bk .b2.y{color:var(--yellow)}.fac-col .bk .b2.r{color:var(--red)}
/* 会议明细 */
.meet-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.mh-item .k{font-size:11px;color:var(--muted);margin-bottom:2px}
.mh-item .v{font-weight:600;font-size:13px}
.timeline{display:flex;align-items:flex-start;gap:0;padding:10px 6px 4px;overflow-x:auto}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:86px;position:relative;text-align:center}
.tl-step:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 16px);width:calc(100% - 32px);height:2px;background:#d9e1ec}
.tl-step.done:not(:last-child)::after{background:var(--green)}
.tl-dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #d9e1ec;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:2;flex:0 0 auto}
.tl-step.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff}
.tl-step.current .tl-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.tl-step.over .tl-dot{background:var(--red);border-color:var(--red);color:#fff}
.tl-lbl{font-size:11px;color:var(--muted);line-height:1.5}
.tl-step.done .tl-lbl,.tl-step.current .tl-lbl,.tl-step.over .tl-lbl{color:var(--ink);font-weight:600}
/* 知识库 */
.kb-card{border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;transition:.13s;background:#fff}
.kb-card:hover{border-color:#b9c9e2;box-shadow:var(--shadow)}
.kb-card .k1{display:flex;align-items:center;gap:9px}
.kb-card .k2{font-size:13px;font-weight:600;margin:7px 0 4px;line-height:1.5}
.kb-card .k3{font-size:12px;color:var(--ink2);line-height:1.6;background:var(--surface2);border-radius:7px;padding:6px 9px}
.kb-card .k4{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 配置 */
.cfg-row{display:flex;align-items:center;gap:14px;padding:5px 0;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.cfg-row:last-child{border-bottom:0}
.cfg-row .cl{min-width:230px}
.cfg-row .cl .n{font-size:13px;font-weight:600}
.cfg-row .cl .d{font-size:11.5px;color:var(--muted);margin-top:2px}
input[type=range]{width:230px;accent-color:var(--accent)}
.cfg-val{font-weight:800;color:var(--accent);font-size:15px;min-width:52px}
.rule-list{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.rule-list div{display:flex;gap:8px}
.rule-list .rd{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.rule-list .rd.r{background:var(--red)}.rule-list .rd.y{background:var(--yellow)}
/* 全屏下钻 */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(24,44,86,.55);backdrop-filter:blur(3px);display:none;flex-direction:column}
.overlay.show{display:flex}
.ov-top{display:flex;align-items:center;gap:12px;padding:9px 16px;background:linear-gradient(135deg,#ffffff,#e8f3ff);color:var(--ink);border-bottom:1px solid #d4e3f5;flex:0 0 auto}
.ov-top h3{font-size:15px;color:#123a74;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-top button{flex:0 0 auto}
.ov-top #ovBk,.ov-top #ovFs{width:auto;padding:0 12px;font-size:12.5px;white-space:nowrap;height:30px}
.ov-top #ovFs.on{background:#1f66d8;color:#fff;border-color:#1f66d8}
.ov-top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.ov-top .sp button{width:auto;min-width:33px;padding:0 11px;white-space:nowrap}
.ov-fs{width:auto;padding:0 12px;font-size:12.5px;white-space:nowrap;gap:5px;flex:0 0 auto}
.ov-fs.on{background:#1f66d8;color:#fff;border-color:#1f66d8}
.ov-x{padding:0 11px;min-width:33px}
.ov-x{width:33px;height:33px;border-radius:8px;border:1px solid #e2c9cc;background:#ffffff;color:#a1163a;font-size:16px;display:flex;align-items:center;justify-content:center}
.ov-x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.ov-body{flex:1;overflow:auto;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.ov-content{transform-origin:top center;width:100%;max-width:none;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.overlay:fullscreen .ov-content{border-radius:0}
.overlay:fullscreen .ov-top{padding:8px 16px}
.ov-content table{font-size:13px}
.ov-content thead th{padding:12px 14px}
.ov-content tbody td{padding:12px 14px}
.empty{text-align:center;color:var(--muted);padding:18px 10px;font-size:13px}
.scroll-x{overflow-x:auto}
/* 密排表格（部门结果指标）：行高更密、铺满宽度 */
.tbl-dense{width:100%}
.tbl-dense thead th{padding:3px 9px;font-size:11px}
.tbl-dense tbody td{padding:1px 9px;line-height:1.22;font-size:12px}
.tbl-dense .rate-cell .mini{width:44px;height:5px}
.tbl-dense .pill{padding:1px 8px;font-size:11px}
.scroll-y{overflow-y:auto}
.foot-note{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center}
.foot-note b{color:var(--ink2);font-weight:600}
@media (max-width:1180px){
  .grid-12{grid-template-columns:1fr}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-9{grid-column:span 1}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .ai-b{grid-template-columns:1fr}
  .nav{max-width:none}
  .syncchip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function csvParse(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

function dParse(v){const s=String(v==null?'':v).trim();if(!s)return null;
  if(/^\d{4,6}(\.\d+)?$/.test(s)){            /* Excel 日期序列号（如 46025 = 2026-01-03） */
    const n=parseFloat(s);
    if(n>20000&&n<80000){const t=Date.UTC(1899,11,30)+Math.round(n)*86400000,d=new Date(t);
      return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),9,0,0);}
  }
  if(/^\d{10,13}$/.test(s)){const n=+s;return new Date(s.length>10?n:n*1000);}   /* 时间戳 */
  const m=s.match(/(\d{4})\s*[-\/年.]\s*(\d{1,2})\s*[-\/月.]\s*(\d{1,2})/);if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3],9,0,0);return isNaN(d.getTime())?null:d;}

  const bg=s=>{const o={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);o[k]=(o[k]||0)+1;}return o;};
  const A=bg(a),B=bg(b);let inter=0,na=0,nb=0;

function normH(s){return String(s==null?'':s).replace(/[\s\r\n]/g,'').replace(/（/g,'(').replace(/）/g,')').replace(/[:：]/g,'').toLowerCase();}
function impMapHeader(row){
  const out={},cells=row.map(normH);
  const keys=Object.keys(IMP_ALIAS);
  keys.forEach(k=>{IMP_ALIAS[k].forEach(a=>{const an=normH(a);
    if(out[k]!=null)return;const i=cells.indexOf(an);if(i>=0){out[k]=i;}});});
  keys.forEach(k=>{IMP_ALIAS[k].forEach(a=>{const an=normH(a);if(an.length<2)return;
    if(out[k]!=null)return;const i=cells.findIndex(c=>c&&c.indexOf(an)>=0);if(i>=0){out[k]=i;}});});
  return out;
}
function impFindHeader(rows){
  let best=-1,score=-1,map=null;
  for(let i=0;i<Math.min(8,rows.length);i++){
    const m=impMapHeader(rows[i]||[]);
    const s=(m.code!=null?1:0)+(m.date!=null?1:0)+(m.topic!=null?2:0)+(m.minutes!=null?2:0)+(m.owner!=null?1:0)+(m.convener!=null?1:0);
    if(s>score){score=s;best=i;map=m;}
  }
  return {row:best,map:map||{},score:score};
}

function zipCentral(buf){

  for(let i=0;i<n;i++){

async function zipText(z,name){

  const start=e.lho+30+z.dv.getUint16(e.lho+26,true)+z.dv.getUint16(e.lho+28,true);
  const data=z.u8.subarray(start,start+e.csize);

  if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器版本较低，无法直接读 .xlsx，请在 Excel 中另存为 CSV 后导入');
  const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder('utf-8').decode(await new Response(st).arrayBuffer());

const HRX_KEY='mt_hrx_v1', HRX_DATA='mt_hrx_data_v1';
const HRX_DEF={url:'',token:'',min:60,on:true,log:[]};
function hrxCfg(){try{const o=JSON.parse(localStorage.getItem(HRX_KEY)||'{}');return Object.assign({},HRX_DEF,o);}catch(e){return Object.assign({},HRX_DEF);}}
function hrxSave(o){try{localStorage.setItem(HRX_KEY,JSON.stringify(Object.assign(hrxCfg(),o)));}catch(e){}}
function hrxData(){try{return JSON.parse(localStorage.getItem(HRX_DATA)||'null');}catch(e){return null;}}
function hrxMap(){const d=hrxData();return (d&&d.map&&Object.keys(d.map).length)?d.map:null;}
function hrxLog(txt,ok){const c=hrxCfg();hrxSave({log:[{t:Date.now(),txt:txt,ok:!!ok}].concat(c.log||[]).slice(0,20),last:Date.now(),ok:!!ok,msg:txt});}
const HRX_ALIAS={厂区:['厂区','工厂','公司','厂别','基地'],姓名:['姓名','名字','人员','员工'],
  一级组织:['一级组织','一级部门','所属部门','部门','课别'],二级组织:['二级组织','二级部门','组别'],标准职位:['标准职位','职位','岗位']};
function hrxCode(v){const s=String(v==null?'':v).trim().toUpperCase();
  if(s.indexOf('海外')>=0||s==='OS')return 'OS'; if(s.indexOf('西南')>=0||s==='SW')return 'SW';
  if(s.indexOf('总部')>=0||s==='NB')return 'NB'; if(s.indexOf('总部')>=0||s==='NL'||s==='HQ')return 'HQ';
  return FCODES.indexOf(s)>=0?s:'HQ';}
function hrxBuild(raw){
  raw=(raw||[]).filter(r=>r&&r.some(x=>String(x==null?'':x).trim()!==''));
  if(!raw.length)return {ok:false,msg:'组织架构表为空'};
  let hdr=-1,idx=null;
  for(let i=0;i<Math.min(8,raw.length);i++){
    const cells=raw[i].map(x=>String(x==null?'':x).trim()),m={};
    for(const k in HRX_ALIAS){const j=cells.findIndex(c=>c&&HRX_ALIAS[k].some(a=>c===a||c.indexOf(a)>=0));if(j>=0)m[k]=j;}
    if(m['姓名']!=null&&m['一级组织']!=null){hdr=i;idx=m;break;}}
  if(hdr<0)return {ok:false,msg:'未识别到表头（需含「姓名」和「一级组织」两列，可加「厂区」）'};
  const map={},warn=[];let n=0;
  for(let i=hdr+1;i<raw.length;i++){const r=raw[i]||[];
    const nm=primaryName(r[idx['姓名']]),dep=canonDept(String(r[idx['一级组织']]||'').trim());
    if(!nm||!dep)continue;
    const code=hrxCode(idx['厂区']!=null?r[idx['厂区']]:'');
    if(!map[code])map[code]={};
    if(map[code][nm]&&map[code][nm]!==dep)warn.push(nm+' 同厂区两个部门（'+map[code][nm]+' / '+dep+'）');
    map[code][nm]=dep;n++;}
  return {ok:n>0,msg:n?'':'未读到有效记录',n:n,map:map,warn:warn,hdr:hdr};
}
function hrxDeptOf(code,name){const m=hrxMap();const nm=primaryName(name);if(!m||!nm)return '';
  const c=code?hrxCode(code):null;
  if(c&&(m[c]||{})[nm])return m[c][nm];
  for(const k in m){if((m[k]||{})[nm])return m[k][nm];}
  return '';}
function deptByOrgAll(code,name){return hrxDeptOf(code,name)||orgDeptOf(name,code);}
function reDeptAll(){
  if(!CUR_PACK)return 0;
  let ch=0;
  const snap=CUR_PACK.map(x=>{
    const info=ownerInfo(x.c,x.o,x.cv);
    const convD=personDept(x.c,x.cv);
    const raw=info.dept||deptGuess(x.lc||'')||deptGuess(x.tp||'')||deptGuess(x.ct||'')||convD||'—';
    const d=raw==='—'?'—':canonDept(raw);
    const byOrg=(info.kind==='org'||info.kind==='alias');
    const byConv=(info.kind==='convener')||(!info.dept&&d!=='—'&&!!convD&&canonDept(convD)===d);
    if(d!==x.dp||byOrg!==!!x.dy)ch++;
    return Object.assign({},x,{dp:d,dy:byOrg?1:0,dq:(!byOrg&&!byConv&&d!=='—')?1:0,dc:byConv?1:0});});
  CUR_PACK=snap;DB=buildDBFromImport(snap);
  return ch;
}
function hrxApplyRows(raw,src){
  const b=hrxBuild(raw);
  if(!b.ok){hrxLog('组织架构导入失败：'+b.msg,false);return b;}
  try{localStorage.setItem(HRX_DATA,JSON.stringify({at:Date.now(),src:src||'import',n:b.n,map:b.map,warn:b.warn}));}catch(e){}
  const ch=reDeptAll();
  hrxLog('组织架构已生效：'+b.n+' 条记录（'+(src==='api'?'接口同步':'文件导入')+'）· 重算部门 '+ch+' 项',true);
  render();return b;
}
function hrxSync(manual){
  const c=hrxCfg();
  if(!c.url){if(manual)alert('请先填写 HR 系统（人事资料 / 组织架构）接口地址');return false;}
  hrxLog('开始同步组织架构 '+c.url,true);if(manual)render();
  return fetch(c.url,{headers:c.token?{'Authorization':'Bearer '+c.token}:{},cache:'no-store'})
   .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
   .then(j=>{const rows=Array.isArray(j)?j:(j.rows||j.data||j.list||j.records||[]);
     if(!rows.length)throw new Error('接口返回空数据');
     const keys=Object.keys(rows[0]||{});
     const norm=(rows[0]&&!Array.isArray(rows[0])&&keys.length)?[keys].concat(rows.map(o=>keys.map(k=>o[k]))):rows;
     const b=hrxApplyRows(norm,'api');return !!b.ok;})
   .catch(e=>{hrxLog('组织架构同步失败：'+e.message+'（沿用上一份名单）',false);render();return false;});
}

    <div class="card-b">

      <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:10px">
        <label style="display:block"><span style="font-size:11.5px;color:var(--muted)">HR 接口地址（可留空，改用文件导入）</span>
          <input id="hrxUrl" class="select" style="width:100%;margin-top:4px" placeholder="如 http://公司服务器/api/hr/org" value="${esc(c.url)}"></label>

const INT_KEY='mt_int_v1';
const INT_DEF={url:'',token:'',min:10,on:true,last:0,ok:null,msg:'',log:[]};
function intCfg(){try{const o=JSON.parse(localStorage.getItem(INT_KEY)||'{}');return Object.assign({},INT_DEF,o);}catch(e){return Object.assign({},INT_DEF);}}
function intSave(o){try{localStorage.setItem(INT_KEY,JSON.stringify(Object.assign(intCfg(),o)));}catch(e){}}
function intSnap(){try{const o=JSON.parse(localStorage.getItem(INT_KEY+'_snap')||'null');return (o&&o.pack&&o.pack.length)?o:null;}catch(e){return null;}}
function intLogPush(txt,ok){const c=intCfg();const log=[{t:Date.now(),txt:txt,ok:!!ok}].concat(c.log||[]).slice(0,20);intSave({log:log,last:Date.now(),ok:!!ok,msg:txt});}
async function intSync(manual){
  const c=intCfg();
  if(!c.url){if(manual)alert('请先填写公司会议管理系统接口地址（向 IT 索取）');return false;}
  intLogPush('开始同步 '+c.url,true); if(manual)render();
  try{
    const r=await fetch(c.url,{headers:c.token?{'Authorization':'Bearer '+c.token}:{},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const rows=Array.isArray(j)?j:(j.rows||j.data||j.list||j.records||[]);
    if(!rows.length)throw new Error('接口返回空数据');
    const keys=Object.keys(rows[0]||{});
    const norm=(rows[0]&&!Array.isArray(rows[0])&&keys.length)?[keys].concat(rows.map(o=>keys.map(k=>o[k]))):rows;
    const b=impBuild(norm);
    if(!b.rows||!b.rows.length)throw new Error('字段识别失败（请核对接口字段名）');
    const pack=impPackOf(b.rows);
    try{localStorage.setItem(INT_KEY+'_snap',JSON.stringify({at:Date.now(),pack:pack}));}catch(e){}
    CUR_PACK=pack;DB=buildDBFromImport(pack);
    intLogPush('同步成功：'+b.rows.length+' 行 → '+impCount().meets+' 场 / '+impCount().tasks+' 项',true);
    render(); return true;
  }catch(e){
    intLogPush('同步失败：'+e.message+'（沿用上一份数据，界面不停摆）',false);
    render(); return false;
  }
}

        <label style="display:block"><span style="font-size:11.5px;color:var(--muted)">刷新间隔</span>
          <select id="intMin" class="select" style="width:100%;margin-top:4px">${[1,5,10,30,60,120].map(m=>`<option value="${m}"${c.min===m?' selected':''}>每 ${m} 分钟</option>`).join('')}</select></label>

      </div>
      <div style="margin-top:9px;font-size:12px;color:#45618e;line-height:1.75">
        <b>上次成功同步：</b>${last}${sn?`（AI 与统计基于该次结果）`:''}<br>
        <b>接口返回要求：</b>JSON 数组，或 {"rows"|"data"|"list": [...]}；字段名与《OA会议管理数据对接表》一致（厂区/日期/会议名称/时段/主导人/参会人员/场所/会议纪要/责任人/完成时间/实际完成时间），字段名不用为平台改动。<br>

function taskStatus(t){
  if(t.done)return 'done';
  if(t.noddl||!t.deadline)return 'noddl';

   外厂与其他部门一律不可见；部门级范围统一在本闸门生效，所有页面取数都走这两个函数 */
function deptOfPerson(n){
  for(const c of FCODES)for(const m of (DB[c]||[]))for(const t of (m.tasks||[]))if(t.owner===n&&t.dept&&t.dept!=='—')return {code:c,dept:t.dept};
  for(const c of FCODES){const o=ORG[c];if(!o)continue;
  const ks=Object.keys(o.owners||{});for(const d of ks){if((o.owners[d]||[]).indexOf(n)>=0)return {code:c,dept:d};}
  if((o.heads||[]).indexOf(n)>=0)return {code:c,dept:''};}
  return {code:'HQ',dept:''};}
function deptScope(){if(STATE.role==='D'){const p=(STATE.ident||'HQ::制造课').split('::');return {code:p[0],dept:p[1]};}
  if(STATE.role==='P')return deptOfPerson(STATE.ident||'');
  return null;}
function meetInDeptScope(m){const f=deptScope();if(!f)return true;if(m.code!==f.code)return false;
  if(!f.dept)return true;return (m.dept&&m.dept===f.dept)||(m.tasks||[]).some(t=>t.dept===f.dept);}
function taskInDeptScope(t){const f=deptScope();if(!f)return true;if(!t.meet||t.meet.code!==f.code)return false;return f.dept?t.dept===f.dept:true;}
function scopeMeetings(codes){const f=deptScope(),arr=[];
  codes.forEach(c=>(DB[c]||[]).forEach(m=>{if(!meetInDeptScope(m))return;
    arr.push(f&&f.dept?Object.assign({},m,{tasks:(m.tasks||[]).filter(t=>t.dept===f.dept)}):m);}));
  return arr;}
function scopeTasks(codes){const arr=[];codes.forEach(c=>allTasks(c).forEach(t=>{if(taskInDeptScope(t))arr.push(t);}));return arr;}
function metricStatus(rate,hasRed){if(hasRed)return 'red';if(rate>=CFG.target/100)return 'green';if(rate>=0.75)return 'yellow';return 'red';}
function aggMeetings(meets){
  const tasks=meets.flatMap(m=>m.tasks);
  const total=tasks.length,done=tasks.filter(t=>t.done).length;
  const overdue=tasks.filter(t=>taskStatus(t)==='overdue').length;
  const risk=tasks.filter(t=>taskStatus(t)==='risk').length;
  const noddl=tasks.filter(t=>taskStatus(t)==='noddl').length;
  const open=tasks.filter(t=>!t.done&&taskStatus(t)==='open').length;
  const nFile=done?tasks.filter(t=>t.done&&!t.file).length:0;
  const logicBad=tasks.filter(t=>t.logicBad).length;
  const repeatMeets=meets.filter(m=>m.repeat>1).length;
  const caseMeets=meets.filter(m=>m.tasks.length&&m.tasks.every(t=>t.done)).length;
  const compRate=total?done/total:0;
  const overdueRate=total?overdue/total:0;
  const wMeet=meets.filter(m=>(m.tasks||[]).length).length;   // 只统计有决议事项的会议（无纪要会议不参与结案率）
  return {meets,tasks,total,done,overdue,risk,noddl,open,nFile,logicBad,compRate,overdueRate,repeatMeets,caseMeets,wMeet,meetRate:wMeet?caseMeets/wMeet:0};
}
function evMiss(tasks){const c={标准:0,培训记录:0,执行前后对比:0,监督验证:0};let cnt=0;tasks.forEach(t=>{if(t.done){cnt++;['标准','培训记录','执行前后对比','监督验证'].forEach(k=>{if(t.ev&&!t.ev[k])c[k]++;});}});return {cnt,list:c};}
function deptRowsOf(meets){
  const map={};
  meets.forEach(m=>m.tasks.forEach(t=>{
    const key=m.code+'::'+t.dept;
    if(!map[key])map[key]={code:m.code,dept:t.dept,total:0,done:0,overdue:0,risk:0,open:0,tasks:[]};
    const d=map[key];d.total++;d.tasks.push(t);
    const s=taskStatus(t);
    if(t.done)d.done++;if(s==='overdue')d.overdue++;if(s==='risk')d.risk++;if(s==='open')d.open++;
  }));
  const rows=Object.keys(map).map(k=>{const d=map[k];d.compRate=d.total?d.done/d.total:0;d.overdueRate=d.total?d.overdue/d.total:0;
    d.status=metricStatus(d.compRate,d.overdue>0);return d;});
  rows.sort((a,b)=>a.compRate-b.compRate||b.overdue-a.overdue);
  return rows;
}
function personRowsOf(meets){
  const map={};
  meets.forEach(m=>m.tasks.forEach(t=>{
    if(!t.owner)return;
    const key=m.code+'::'+t.owner;
    if(!map[key])map[key]={owner:t.owner,dept:t.dept,code:m.code,total:0,done:0,overdue:0,risk:0,open:0,tasks:[]};
    const d=map[key];d.total++;d.tasks.push(t);
    const s=taskStatus(t);
    if(t.done)d.done++;if(s==='overdue')d.overdue++;if(s==='risk')d.risk++;if(s==='open')d.open++;
  }));
  const rows=Object.keys(map).map(k=>{const d=map[k];d.compRate=d.total?d.done/d.total:0;d.overdueRate=d.total?d.overdue/d.total:0;return d;});
  rows.sort((a,b)=>(b.overdue+b.risk)-(a.overdue+a.risk)||a.compRate-b.compRate);
  return rows;
}

function meetCost(m){return (m.attendees||[m.convener]).length*(m.dur||60)/60*CFG.cost;}
function meetHours(m){return (m.attendees||[m.convener]).length*(m.dur||60)/60;}
function costStats(codes,days){
  const win=days||366;
  const inC=m=>m.time>=addDays(NOW,-win);
  const ms=scopeMeetings(codes).filter(inC);
  const total=ms.reduce((s,m)=>s+meetCost(m),0), hours=ms.reduce((s,m)=>s+meetHours(m),0);
  const grp={};ms.forEach(m=>{const k=m.code+'-'+m.serial;(grp[k]=grp[k]||[]).push(m);});
  let repExtra=0,repCnt=0,repBase=0;
  Object.values(grp).forEach(g=>{g.sort((a,b)=>a.time-b.time);if(g.length>1){repBase+=meetCost(g[0]);for(let i=1;i<g.length;i++){repExtra+=meetCost(g[i]);repCnt++;}}});
  const byFac=FCODES.filter(c=>codes.indexOf(c)>=0).map(c=>{const l=scopeMeetings([c]).filter(inC);return {c,meets:l.length,cost:l.reduce((s,m)=>s+meetCost(m),0),hours:l.reduce((s,m)=>s+meetHours(m),0)};});
  const top=ms.slice().sort((a,b)=>meetCost(b)-meetCost(a)).slice(0,8);
  return {ms,total,hours,repExtra,repCnt,repBase,byFac,top,avg:ms.length?total/ms.length:0,grp};
}

/* 结案口径辅助：场次结案 + 过程数据（已启动 / 平均闭环进度 / 只差 1 项） */
function closeStats(meets){
  const tot=meets.length;
  const pctOf=m=>m.tasks&&m.tasks.length?m.tasks.filter(t=>t.done).length/m.tasks.length:0;
  const full=meets.filter(m=>m.tasks.length&&m.tasks.every(t=>t.done)).length;
  const started=meets.filter(m=>pctOf(m)>0).length;
  const avg=tot?meets.reduce((s,m)=>s+pctOf(m),0)/tot:0;
  const lack1=meets.filter(m=>{const n=m.tasks.filter(t=>!t.done).length;return n===1&&m.tasks.length>1;}).length;
  return {tot,full,started,avg,lack1};
}

   1) 只统计“异常处理类”事项（例行/固定跟进类——周报月报、盘点巡查、点检保养、培训SOP、报表台账等——不参与重复性统计）
   2) 同一个异常事项在窗口内出现 ≥2 次 → 记为“异常重复事项”，重复次数 = 出现次数 − 1
   3) 结果异常（超期 / 佐证不齐 / 未闭环）作为该行的附加标注，不作为入选条件 */
const ABN_TYPE=[['客诉','客诉/服务'],['投诉','客诉/服务'],['退货','客诉/服务'],['回访','客诉/服务'],
  ['不良','质量'],['良率','质量'],['漏检','质量'],['返工','质量'],['报废','质量'],['失效','质量'],['改善','质量'],['效果','质量'],
  ['故障','设备/机'],['保养','设备/机'],['点检','设备/机'],['瓶颈','设备/机'],
  ['缺料','交期/料'],['停线','交期/料'],['延迟','交期/料'],['超期','交期/料'],
  ['铜价','成本'],['涨价','成本'],['降价','成本'],['损失','成本'],['费用','成本'],

  ['离职','人力'],['缺口','人力']];
function abnTypeOf(title){for(const [k,v] of ABN_TYPE){if(String(title).indexOf(k)>=0)return v;}return '其他';}
/* ===== 问题指纹（Problem ID）——统计单元是"问题（异常对象）"，不是会议主题、也不是事项文本 =====
   ① 归并：同一问题在周会 / 专题会 / 多厂出现 → 归并为 1 个问题（周会事项与专题会主题同指一件事只算 1 个问题）
   ② 计次：按"独立会议场次"计 —— 同一场会议内多条子事项指向同一问题只算 1 次；重复次数 = 提及场次 − 1
   ③ 无源系统"关联问题编号"字段时，按「异常类型 + 对象关键词」自动归并，并支持人工合并 / 拆分（留痕） */
const ABN_OBJ=[['外观|良率','外观良率'],['缺料|停线|齐套','缺料停线'],['稽核|定置|5S','现场稽核'],['隐患|违规|事故|作业安全','作业安全'],
  ['客诉|投诉|退货|满意度|回访','客诉服务'],['招聘|到岗|人力|缺口','人力到岗'],['离职|留任','人员留任'],
  ['节拍|瓶颈|效率|换模|换线|SMED','节拍效率'],['故障|保养|点检|设备','设备保养'],['参数|标准化|作业标准|SOP|工艺','工艺标准化'],
  ['铜价|成本|费用|损耗|库存','成本费用'],['系统|ERP|MES|WMS|接口|权限|备份','信息系统'],
  ['温湿度|高温|环境','温湿度'],['焊接','焊接工艺'],['培训|考核','培训考核']];
function abnObjOf(s){for(const [re,name] of ABN_OBJ){if(new RegExp(re).test(String(s)))return name;}return '';}
function abnFpOf(s){const t=abnTypeOf(s),o=abnObjOf(s);return o?(t+'|'+o):(t+'|'+String(s||'').trim());}
function abnMergeLoad(){try{return JSON.parse(localStorage.getItem('mt_abnmerge')||'{}');}catch(e){return {};}}

/* 第三道闸门 · 周期闸门：出现间隔稳定（离散度低）→ 判为"例行周期问题"，不计入重复次数，单列"周期回顾" */
function abnCycle(o){
  const ds=o.list.map(x=>x.m.time.getTime()).sort((a,b)=>a-b);
  const uq=[];ds.forEach(d=>{if(!uq.length||d-uq[uq.length-1]>3*86400000)uq.push(d);});
  if(uq.length<3)return false;
  const iv=[];for(let i=1;i<uq.length;i++)iv.push((uq[i]-uq[i-1])/86400000);
  const mean=iv.reduce((a,b)=>a+b,0)/iv.length;if(mean<5)return false;
  const sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)*(b-mean),0)/iv.length);
  return sd/mean<0.35;
}
function abnMeta(o){
  const thisQ=o.list.filter(x=>x.m.time>=addDays(NOW,-91)).length;
  let run=0;
  for(let k=0;k<12;k++){const end=addDays(NOW,-k*30.5),start=addDays(NOW,-(k+1)*30.5);
    const seg=o.list.filter(x=>x.m.time>start&&x.m.time<=end);
    if(!seg.length)break;if(seg.some(x=>!x.t.done))run++;else break;}
  return {thisQ,run};
}
/* 第四道闸门 · 显示分级：不显示裸次数，高频改"高频（≥N）"+ 本季次数 + 连续未闭环周期数 */
function freqLabel(o){return o.extra>=CFG.hiFreq?('高频（≥'+CFG.hiFreq+'）'):('重复 '+o.extra+' 次');}
function abnStats(codes){
  const MG=abnMergeLoad(),map={};
  let abnTotal=0,routineTotal=0,normTotal=0,shareTotal=0;
  meets12(codes).forEach(m=>m.tasks.forEach(t=>{
    const nat=t.nature||taskNature(t.content);
    if(nat==='通报'){shareTotal++;return;}                 // 通报 / 信息共享类：整项排除（不入任何重复统计）
    if(nat==='例行')routineTotal++;else if(nat==='常规')normTotal++;else abnTotal++;
    if(nat!=='异常')return;                                // 只取异常处理类事项
    let key=abnFpOf(t.content);if(MG[key])key=MG[key];      // 问题指纹 + 人工合并
    const o=map[key]=map[key]||{fp:key,cnt:0,meetSet:{},list:[],codes:{},byCode:{},byFac:{},byFacMeet:{},first:null,last:null,overdue:0,miss:0,open:0,own:null};
    o.list.push({t,m});
    if(!o.meetSet[m.id]){o.meetSet[m.id]=1;o.cnt++;}        // 同一场会议内多条子事项 → 只算 1 次
    o.byCode[m.code]=(o.byCode[m.code]||0)+1;o.codes[m.code]=1;if(!o.dS)o.dS=m.dS;
    if(!o.title||String(t.content).length<String(o.title).length)o.title=t.content;
    o.byFac[m.code]=o.byFac[m.code]||{cnt:0,dept:t.dept};o.byFac[m.code].cnt++;
    o.byFacMeet[m.code]=o.byFacMeet[m.code]||{};o.byFacMeet[m.code][m.id]=1;
    if(!o.first||m.time<o.first)o.first=m.time;
    if(!o.last||m.time>=o.last){o.last=m.time;o.own={code:m.code,meet:m.id,task:t.id,owner:t.owner,dept:t.dept};}
    if(taskStatus(t)==='overdue')o.overdue++;
    if(t.done&&evN(t)<4)o.miss++;
    if(!t.done)o.open++;
  }));
  const items=Object.values(map).filter(o=>o.cnt>1);
  items.forEach(o=>{
    o.facCount=Object.keys(o.byFac||{}).length;o.cross=o.facCount>=2;      // ≥2 厂 → 跨厂共性
    Object.keys(o.byFac||{}).forEach(c=>{let best=null;o.list.forEach(x=>{if(x.m.code===c&&(!best||x.m.time>best.time))best={time:x.m.time,dept:x.t.dept};});if(best)o.byFac[c].dept=best.dept;});
  });
  items.forEach(o=>{const a=[];if(o.overdue)a.push('超期 '+o.overdue);if(o.miss)a.push('佐证不齐 '+o.miss);if(o.open)a.push('未闭环 '+o.open);
    o.resAbn=a;o.resCnt=o.overdue+o.miss+o.open;o.extra=o.cnt-1;
    const tp=abnTypeOf(o.title);o.type=(tp==='其他')?(o.dS||'其他'):tp;o.n=Object.keys(o.codes).length;
    o.cycle=abnCycle(o);const mt=abnMeta(o);o.thisQ=mt.thisQ;o.run=mt.run;
    o.meetTypes={};o.list.forEach(x=>{const k=x.m.mt||'专题会';o.meetTypes[k]=(o.meetTypes[k]||0)+1;});
    o.mtTxt=Object.keys(o.meetTypes).map(k=>k+' '+o.meetTypes[k]).join(' · ');
    o.ai=(o.extra>=CFG.abnAI);});
  items.sort((a,b)=>b.extra-a.extra||b.resCnt-a.resCnt);
  /* 四道闸门：① 性质  ② 归并（问题指纹 + 场次计）  ③ 周期（固定周期剔除）  ④ 显示（分级） */
  const repItems=items.filter(o=>o.extra>=CFG.abnMin&&!(CFG.cycleGate&&o.cycle));   // 列入异常重复事项
  const obsItems=items.filter(o=>o.extra<CFG.abnMin);                              // 重复观察
  const cycleItems=items.filter(o=>CFG.cycleGate&&o.cycle);                        // 周期回顾
  const extra=repItems.reduce((s,o)=>s+o.extra,0);
  const byDept={};
  repItems.forEach(o=>{const k=o.own.code+'::'+o.own.dept;const r=byDept[k]=byDept[k]||{cnt:0,extra:0};r.cnt++;r.extra+=o.extra;});  // 归属＝该问题最近一次发生的承接部门（各部门合计＝分厂合计）
  // 集团口径拆分：厂内重复（各厂按场次分别去重）+ 跨厂重复（同一问题出现在多个厂）
  let intraExtra=0,crossExtra=0;
  repItems.forEach(o=>{let inr=0;Object.keys(o.byFacMeet||{}).forEach(c=>{inr+=Math.max(0,Object.keys(o.byFacMeet[c]).length-1);});intraExtra+=inr;crossExtra+=(o.extra-inr);});
  // 跨厂共性（≥2 厂）：不计入各厂重复次数，单列为共性问题清单，用于集团横向展开
  const crossItems=repItems.filter(o=>o.cross);
  const crossByFac={},crossByDept={};
  crossItems.forEach(o=>{Object.keys(o.byFac).forEach(c=>{crossByFac[c]=(crossByFac[c]||0)+1;const k=c+'::'+o.byFac[c].dept;crossByDept[k]=(crossByDept[k]||0)+1;});});
  return {items,repItems,obsItems,cycleItems,extra,abnTotal,routineTotal,normTotal,shareTotal,byDept,intraExtra,crossExtra,
    crossItems,crossCnt:crossItems.length,crossByFac,crossByDept,
    repeatRate:abnTotal?repItems.length/abnTotal:0,abnMin:CFG.abnMin};
}
function deptLeadStats(code){
  const p2d={};
  FCODES.forEach(c=>Object.keys(ORG[c].owners||{}).forEach(d=>(ORG[c].owners[d]||[]).forEach(p=>{if(!p2d[p])p2d[p]=d;})));
  const map={};
  (DB[code]||[]).forEach(m=>{
    let d=p2d[m.convener];
    if(!d&&m.tasks&&m.tasks.length)d=m.tasks[0].dept;     // 召集人无法归属时 → 按该场首个事项的责任部门
    if(!d)return;
    const o=map[d]=map[d]||{meets:0,closed:0};
    o.meets++;if(m.tasks.length&&m.tasks.every(t=>t.done))o.closed++;
  });
  return map;
}
function abnRowsOf(root){
  const MG=abnMergeLoad(),rows=[];
  meets12(FCODES).forEach(mm=>mm.tasks.forEach(x=>{
    if((x.nature||taskNature(x.content))!=='异常')return;
    let k=abnFpOf(x.content);if(MG[k])k=MG[k];
    if(k===root)rows.push({t:x,m:mm});
  }));
  rows.sort((a,b)=>a.m.time-b.m.time);
  return rows;
}
/* AI 复盘与建议（每次下钻均输出）—— 5 段固定结构：脉络 / 对策与失效原因 / 根因 / 建议方案 / 数据依据 */
function abnAIRecap(o){
  const r0=o.list.slice(0,5);
  const M4={'质量':'法（工艺 / 检验标准未固化，或标准已定但执行与监督未落地）','交期/料':'料（物料齐套与供应商交付策略不足，安全库存与排产联动缺失）',
    '设备/机':'机（预防性保养与备件管理未闭环，故障复发缺少根因对策）','客诉/服务':'环（客户信息回流与响应机制不顺，问题未形成闭环回访）',
    '成本':'料（报价 / 损耗口径未联动，成本异常缺少追溯）','安全/环':'环（现场监督与隐患整改闭环不足，责任未落到岗位）','人力':'人（岗位留任与技能培训未覆盖，人员缺口未前置规划）'};
  const fails=[];
  r0.forEach(({t,m},i)=>{if(!t.done)fails.push('第 '+(i+1)+' 次（'+m.id+'）决议「'+t.content+'」未完成 → 对策未落地');
    else if(evN(t)<4)fails.push('第 '+(i+1)+' 次（'+m.id+'）已执行但佐证不齐（'+evN(t)+'/4）→ 效果无法验证');
    else if(m.repeat>1)fails.push('第 '+(i+1)+' 次（'+m.id+'）为第 '+m.repeat+' 次重复上会 → 重复讨论、未更换对策');});
  const sugg=['① 议题归并：将该问题并入固定议程（'+(o.meetTypes&&o.meetTypes['周会']?'周会':'例会 / 周会')+'）单点跟踪，减少重复开会；',
    '② 固化对策：明确 1 名主责 + 1 项标准（作业标准 / 检验标准 / 保养标准）+ 完成期限，按周验证并留佐证四件套；',
    '③ 升级闭环：建议走「管理体系立项闭环」（四件套 + 体系文件修订 + AI 审核 + 上级审核），重复 ≥5 次时平台自动标记「建议立项」，由集团职能横向展开到四厂。'];
  return `<div style="background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;color:var(--ink)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap"><b style="color:#0f2744;font-size:13.5px">AI 复盘与建议</b><span class="tag-dim" style="background:#eaf1ff;color:#1d5fd6">本异常重复事项的过往全部记录 · 重复 ${o.extra} 次（关联会议 ${o.cnt} 场）</span><span style="margin-left:auto;font-size:11px;color:#7d9ac9">建议 · 需人工确认；AI 不自动派发 / 不自动关闭</span></div>
    <div style="font-size:12.5px;line-height:1.7">
      <div style="color:#1b4b8f;font-weight:700;margin:6px 0 3px">① 问题脉络（重复会议明细）</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${[...new Map(o.list.map(x=>[x.m.id,x])).values()].map((x,i)=>`<span data-abnmeet="1" data-code="${x.m.code}" data-meet="${x.m.id}" title="${esc(x.m.topic)}｜点击打开该场会议核对" style="display:inline-flex;align-items:center;gap:5px;background:#f3f8fe;border:1px solid #cfe0ff;color:#123a74;border-radius:6px;padding:3px 8px;font-size:11.5px;font-family:Consolas,monospace;cursor:pointer"><b>${i+1}</b> ${x.m.id}<span style="color:#6b7d99;font-family:inherit">· ${dstr(x.m.time)} · ${esc(x.t.dept)}</span></span>`).join('')}</div>
      <div style="color:#1b4b8f;font-weight:700;margin:9px 0 3px">② 已采取对策与失效原因</div>

      <div style="color:#1b4b8f;font-weight:700;margin:9px 0 3px">③ 根因判断（4M1E 归位）</div>

      <div style="color:#1b4b8f;font-weight:700;margin:9px 0 3px">④ 建议方案（含主责 / 期限 / 验证方式）</div>

}
function abnDrill(code,meetId,taskId){

    <td class="c">${statusPill(taskStatus(x))}</td><td class="c">${evN(x)}/4</td><td class="c">${x.done?'已关闭':'未关闭'}</td></tr>`).join('');
  showOv('异常重复事项 · 全部记录（'+meets.length+' 场 · 重复 '+extra+' 次）',`<div style="padding:4px 2px">
    <div style="font-size:13px;color:#123a74;font-weight:700;margin-bottom:4px">${esc(t.content)} <span class="tag-dim">${o.type}</span> <span class="tag-dim" style="background:#eef2f7;color:#45618e">问题指纹 ${esc(root)}</span></div>

      各厂分布：${facs.map(c=>c+' '+rows.filter(r=>r.m.code===c).length+' 场').join(' · ')||'—'}${facs.length>=2?' · <b style="color:#a06a08">跨厂共性：不计入各厂重复次数，按集团级立项横向展开</b>':''}</div>
    ${abnAIRecap(o)}
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px">
      <span style="color:var(--muted)">口径校正：</span>
      <select class="select" id="abnMergeSel" style="padding:4px 8px;font-size:12px">${others.map(x=>`<option value="${esc(x.fp)}">${esc(x.title)}（重复 ${x.extra} 次）</option>`).join('')||'<option value="">无可合并问题</option>'}</select>

/* 周趋势：近 8 周 到期数 vs 完成数 */
function weeklyTrend(codes,filter){
  const tasks=scopeTasks(codes).filter(t=>!filter||(filter.type==='4m1e'?t.meet.d4===filter.dim:filter.type==='sqcds'?t.meet.dS===filter.dim:filter.type==='dept'?t.dept===filter.dim:true));
  const out=[];
  for(let w=7;w>=0;w--){
    const start=addDays(NOW,-(w+1)*7),end=addDays(NOW,-w*7);
    const due=tasks.filter(t=>t.deadline&&t.deadline>start&&t.deadline<=end).length;

/* ===================== AI 评分（人40：交付时效；事60：正确20+逻辑20+重复20） ===================== */
function meetingAI(m){
  const tasks=m.tasks;const total=tasks.length||1;
  const done=tasks.filter(t=>t.done).length;
  const overdue=tasks.filter(t=>taskStatus(t)==='overdue').length;
  const risk=tasks.filter(t=>taskStatus(t)==='risk').length;
  const noddl=tasks.filter(t=>taskStatus(t)==='noddl').length;
  const nFile=tasks.filter(t=>t.done&&!t.file).length;
  const logicBad=tasks.filter(t=>t.logicBad).length;
  const timeliness=Math.max(0,Math.min(40,Math.round(40*Math.max(0,(done-overdue*1.3)/total))));
  let correctness=13;
  if(total&&tasks.every(t=>t.owner&&t.owner!=='未指定'))correctness+=3;
  if(total&&tasks.every(t=>t.deadline))correctness+=2;
  if(nFile===0)correctness+=2;else correctness+=Math.max(0,2-Math.round(nFile));
  correctness=Math.min(20,correctness);
  let logic=13;
  if(logicBad===0)logic+=3;else logic+=0;
  if(noddl===0)logic+=2;else logic+=Math.max(0,2-Math.round(noddl*0.7));
  if(m.tasks.every(t=>t.deadline>=m.time||t.noddl))logic+=2;else logic+=0;
  logic=Math.min(20,logic);
  const repeat=m.repeat===1?20:(m.repeat===2?11:(m.repeat===3?5:3));
  const score=timeliness+correctness+logic+repeat;
  return {score,timeliness,correctness,logic,repeat,
    summary:`本场会议 ${num(total)} 项决议事项，已完成 ${num(done)} 项、超期 ${num(overdue)} 项、临期 ${num(risk)} 项${m.repeat>1?'，检测为第 '+m.repeat+' 次重复会议':''}。`,
    basis:[['人 · 交付时效',timeliness,40,'#1b5cb8'],['事 · 内容正确性',correctness,20,'#3b82f6'],['事 · 逻辑合规性',logic,20,'#6366f1'],['事 · 重复发生',repeat,20,'#8b5cf6']]};
}
function taskAI(t,m){const s=taskStatus(t);
  const comp=((t.owner&&t.owner!=='未指定')?12:0)+((!t.noddl&&t.deadline)?12:0)+((!t.done||t.verify)?12:0)+((t.file||!t.done)?12:0)+((!t.logicBad)?12:0);
  const tl=t.done?(s==='overdue'?24:40):(s==='overdue'?8:(s==='risk'?22:(s==='noddl'?18:30)));
  return {score:Math.min(100,tl+comp),tl,comp};}

  if(a.risk>0)findings.push({sev:'y',txt:'<b>'+a.risk+' 项任务临期（≤'+CFG.riskDays+' 天）</b>，需 48 小时内推进避免转超期',goto:null});

  if(a.noddl>0)findings.push({sev:'y',txt:'<b>'+a.noddl+' 项任务未排截止时间</b>，未纳入超期预警，须补齐截止时间',goto:null});

  const root=a.overdue>0
    ?`超期事项集中于 <span class="hl">${esc(worst?(worst.code?worst.code+'·':'')+worst.dept:'—')}</span>（超期 ${worst?worst.overdue:0} 项、完成率 ${pct(worst?worst.compRate:0)}），个人层面 ${esc(worstPerson?worstPerson.owner:'—')} 名下 ${worstPerson?worstPerson.overdue+worstPerson.risk:0} 项红黄。主因：决议派发到关闭缺乏中期检查点，责任人临近截止才暴露落后。`
    :`当前整体闭环健康，${num(a.risk)} 项临期集中在 <span class="hl">${esc(worst?(worst.code?worst.code+'·':'')+worst.dept:'—')}</span>，${a.repeatMeets>0?('另有 '+a.repeatMeets+' 场重复会议未并入既有议题'):'暂无重复会议'}。`;
  const cm=`建议：① 责成 <span class="hl">${esc(worst?(worst.code?worst.code+'·':'')+worst.dept:'—')}</span> ${esc(worstPerson?worstPerson.owner:'—')} 于 ${dstr(addDays(NOW,2))} 前完成积压事项并回填进度；② 对 ${num(a.overdue)} 项超期事项即时提醒责任人，补排中期检查点；③ ${a.repeatMeets>0?('重复会议并入首次议题，复用历史结论；'):''}生成待办工单建议 <b class="warn">${num(a.overdue+a.risk)}</b> 张，经人工确认后派发。`;
  return {score,timeliness:avg('timeliness'),correctness:avg('correctness'),logic:avg('logic'),repeat:avg('repeat'),
    summary:sum,rootCause:root,countermeasure:cm,findings,a,worst};
}
/* ===================== 图表 ===================== */
function lineChart2(data,color,color2){
  const W=620,H=190,pad={l:34,r:14,t:16,b:26};
  const max=Math.max(1,...data.map(d=>Math.max(d.due,d.fin)));
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const stepX=data.length>1?iw/(data.length-1):0;
  const X=i=>pad.l+i*stepX, Y=v=>pad.t+ih-v/max*ih;
  let area=`M${pad.l},${pad.t+ih} `;
  data.forEach((d,i)=>{area+=`L${X(i).toFixed(1)},${Y(d.fin).toFixed(1)} `;});
  area+=` L${X(data.length-1)},${pad.t+ih} Z`;
  const grid=[0,.5,1].map(f=>pad.t+ih-f*ih).map(y=>`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#eef2f7" stroke-width="1"/>`).join('');
  const poly=(key,c)=>{const p=data.map((d,i)=>[X(i),Y(d[key])]);return `<polyline points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`+p.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('');};
  const labels=data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" font-size="9" fill="#94a3b8" text-anchor="middle">${d.label}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${grid}<path d="${area}" fill="${color}" opacity="0.07"/>${poly('due','#94a3b8')}${poly('fin',color2||color)}${labels}</svg>`;
}
function donut(items,centerLabel){
  const size=168,r=size/2-15,cx=size/2,cy=size/2,sw=23;
  const total=items.reduce((s,i)=>s+i.value,0)||1;
  let a0=-Math.PI/2,segs='';
  items.forEach(it=>{
    const frac=it.value/total,a1=a0+frac*2*Math.PI,large=frac>0.5?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    segs+=`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${it.color}" stroke-width="${sw}"/>`;
    a0=a1;
  });
  const center=`<text x="${cx}" y="${cy-4}" font-size="20" font-weight="800" fill="#0f1b2d" text-anchor="middle">${total}</text><text x="${cx}" y="${cy+14}" font-size="10" fill="#64748b" text-anchor="middle">${centerLabel||''}</text>`;
  const legend=items.map(it=>`<span class="li"><span class="sw" style="background:${it.color}"></span>${it.label} <b class="num" style="color:#334155">${it.value}</b>（${pct(it.value/total,0)}）</span>`).join('');
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}${center}</svg><div class="legend" style="flex:1;min-width:150px">${legend}</div></div>`;

/* 任务号显示：系统编号形如「会议编号-T2」（T 后 = 第几项决议）→ 一律显示为「会议编号 第 N 项」，
   避免界面上出现 T1 / T2 这类看不懂的尾巴；系统原始编号仅保留在数据层（data-task）供 IT 追溯 */
const taskSeqOf=t=>{const x=/-T(\d+)$/.exec(String((t&&t.id)||''));return x?x[1]:'';};
const taskNoOf=t=>{const n=taskSeqOf(t);const mid=(t&&(t.meetId||String(t.id||'').replace(/-T\d+$/,'')))||'';return n?(mid+' 第 '+n+' 项'):(mid||String((t&&t.id)||''));};
function evN(t){return EV4.filter(k=>t.ev&&t.ev[k]).length;}
function aiReview(t){const n=evN(t);const four=n===4;const pass=four&&!t.logicBad;const reason=!four?('资料未齐（'+n+'/4）'):(t.logicBad?'逻辑异常：截止时间早于会议时间':'通过');return {pass,four,n,reason};}
function fileCell(t){const n=evN(t);const p=n===4?'p-green':(n>0?'p-yellow':'p-grey');return `<span class="pill ${p}"><span class="d"></span>四件套 ${n}/4</span>`;}
function reviewCell(t){if(!t.done)return '<span class="pill p-grey"><span class="d"></span>待关闭</span>';const ai=aiReview(t);if(!ai.pass)return '<span class="pill p-red"><span class="d"></span>AI 未通过</span>';if(!t.supPass)return '<span class="pill p-yellow"><span class="d"></span>待上级审核</span>';return '<span class="pill p-green"><span class="d"></span>审核通过</span>';}
function repChip(m){return m.repeat>1?`<span class="repeat-flag">第 ${m.repeat} 次</span>`:'';}
function simChips(m){

}

function meetingAIView(m){
  const ai=meetingAI(m);
  const a=aggMeetings([m]);
  const dept=deptRowsOf([m])[0];
  const findings=[];
  if(a.overdue>0)findings.push({sev:'r',txt:'<b>'+a.overdue+' 项任务超期</b>'+(dept?('，集中于 '+esc(dept.dept)):'')});
  if(a.logicBad>0)findings.push({sev:'r',txt:'存在<b>截止时间早于会议时间</b>的任务（逻辑不自洽），须重排期'});
  if(a.noddl>0)findings.push({sev:'y',txt:'<b>'+a.noddl+' 项任务未排截止时间</b>，未纳入超期预警'});
  if(a.nFile>0)findings.push({sev:'y',txt:'<b>'+a.nFile+' 项已关闭任务缺上传附件佐证</b>，关闭要件不完整'});
  const miss=evMiss(m.tasks);
  if(miss.cnt>0)findings.push({sev:'y',txt:'<b>'+miss.cnt+' 项已关闭任务佐证四件套不齐</b>（缺：标准×'+miss.list.标准+' / 培训记录×'+miss.list.培训记录+' / 执行前后对比×'+miss.list.执行前后对比+' / 监督验证×'+miss.list.监督验证+'），关闭要件不完整'});
  if(m.repeat>1)findings.push({sev:'y',txt:'检测为第 <b>'+m.repeat+' 次</b>重复会议，建议并入首次记录（'+m.code+THIS_YEAR+String(m.serial).padStart(4,'0')+'-001）并复用历史结论'});
  if(a.risk>0)findings.push({sev:'y',txt:'<b>'+a.risk+' 项任务临期</b>，距截止 ≤'+CFG.riskDays+' 天'});
  const root=a.overdue>0?'超期事项责任节点未固化、缺少中期检查点，责任人临近截止才暴露落后，且缺少关闭前佐证校验。':(a.risk>0?'本场暂无超期，但临期事项需在 '+CFG.riskDays+' 天内推进避免转超期。':'本场会议决议事项闭环健康。');
  const cm='建议：① 对超期/临期事项生成待办工单建议（经人工确认后派发，系统不自动派单）；② 缺截止/缺佐证事项补齐后再纳入闭环关闭；③ '+(m.repeat>1?'后续同类议题并入首次记录并复用历史结论，不再重复开会。':'关闭前须由召集人验收并上传附件佐证。');
  return Object.assign(ai,{summary:ai.summary,rootCause:root,countermeasure:cm,findings});
}

function marqueeBuild(codes){

  items.sort((a,b)=>a.deadline-b.deadline);

  if(!caps.length){el.style.display='none';el.innerHTML='';return;}

}

function openDimList(type,dim){
  const label=type==='4m1e'?('4M1E · '+dim+'（'+DIM4N[dim]+'）'):('SQCDS · '+dim);
  const meets=scopeMeetings(FCODES).filter(m=>type==='4m1e'?m.d4===dim:m.dS===dim).sort((a,b)=>b.time-a.time);
  const rows=meets.map(m=>{const st=meetState(m),ai=meetingAI(m),dn=m.tasks.filter(t=>t.done).length;
    return `<tr class="clickable" data-goto="meet" data-code="${m.code}" data-meet="${m.id}">
    <td><b>${m.code}</b></td><td class="row-id">${m.id}</td><td style="min-width:230px">${esc(m.topic)} ${repChip(m)}</td>
    <td>${esc(m.convener)}</td><td class="c num">${dstr(m.time)}</td>
    <td class="c num">${dn}/${m.tasks.length}</td>
    <td class="c">${st.label}</td><td class="c num">${ai.score}</td></tr>`;}).join('');

}

function vFactory(code){
  const f=FACTORIES[code],a=aggFactory(code);

  const a12F=agg12([code]);
  const abnF=abnStats([code]);
  const abnG=abnStats(FCODES);
  const crossF=abnG.crossByFac[code]||0;      // 涉及本厂的跨厂共性问题项数
  const oneRow=(fmt)=>`<div class="sub"><div class="r"><span class="c">${code}</span><span>${a12F.meets.length} 场 · ${a12F.total} 事项</span><span class="v">${fmt}</span></div></div>`;
  const leadD=deptLeadStats(code);
  const resultRows=a.deptRows.map(d=>{const ld=leadD[d.dept]||{meets:0,closed:0};const lr=ld.meets?ld.closed/ld.meets:0;
    const ad=abnF.byDept[code+'::'+d.dept];
    const cd=abnG.crossByDept[code+'::'+d.dept]||0;
    return `<tr class="clickable" data-goto="dim" data-code="${code}" data-dimtype="dept" data-dim="${d.dept}">
      <td>${d.dept}</td>
      <td class="c num">${num(ld.meets)}</td>
      <td class="r">${ld.meets?rateBar(lr,'#5b8dd6'):'<span style="color:var(--muted)">—</span>'}</td>
      <td class="c num">${num(d.total)}</td><td class="c num">${num(d.done)}</td>
      <td class="r">${rateBar(d.compRate,f.color||CFG_COLORS[code])}</td>
      <td class="c num" style="color:${d.overdue>0?'var(--red)':'var(--muted)'}">${d.overdue}</td>
      <td class="c num" style="color:${d.risk>0?'var(--yellow)':'var(--muted)'}">${d.risk}</td>
      <td class="c num" style="color:${ad?'var(--yellow)':'var(--muted)'}" ${ad?('title="本厂内重复 '+ad.extra+' 次（'+ad.cnt+' 项）· 部门合计＝分厂合计"'):''}>${ad?num(ad.extra):'—'}</td>
      <td class="c num" style="color:${cd?'#a06a08':'var(--muted)'}" ${cd?('title="跨厂共性 '+cd+' 项（涉及本部门，按集团统一对策横向展开，不计入本厂重复）"'):''}>${cd?num(cd):'—'}</td>
      <td class="c">${stPill(d)}</td></tr>`;}).join('');
  const proc=a.deptRows.slice().sort((x,y)=>(y.overdue+y.risk)-(x.overdue+x.risk)||x.compRate-y.compRate).slice(0,5);
  const procItems=proc.map(d=>{const st=d.overdue>0?'red':(d.risk>0?'yellow':'grey');
    return `<div class="alert-item" style="padding:5px 10px" data-goto="dim" data-code="${code}" data-dimtype="dept" data-dim="${d.dept}">
      <span class="pill ${st==='red'?'p-red':st==='yellow'?'p-yellow':'p-green'}" style="margin-right:8px"><span class="d"></span>${d.overdue>0?'红':(d.risk>0?'黄':'绿')}</span>
      <div class="alert-main" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <b style="font-size:12.5px">${d.dept}</b>
        <span style="font-size:11.5px;color:var(--muted)">在办 ${num(d.total-d.done)} · 超期 ${d.overdue} · 临期 ${d.risk} · 未排期 ${d.tasks.filter(t=>taskStatus(t)==='noddl').length} · 完成率 ${pct(d.compRate)}</span>
      </div>
      <span class="num" style="margin-left:auto;font-size:11.5px;color:var(--muted)">${d.overdue+d.risk} 项</span></div>`;}).join('');
  const abnTop=abnF.repItems.slice().sort((a,b)=>b.extra-a.extra||b.cnt-a.cnt).slice(0,5);
  const abnTopItems=abnTop.map(o=>`<div class="alert-item" style="padding:5px 10px" data-abn="1" data-code="${o.own.code}" data-meet="${o.own.meet}" data-task="${o.own.task}">
      <div class="alert-sev yellow" style="width:24px;height:24px;font-size:11px">异</div>
      <div class="alert-main" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <b style="font-size:12.5px">${esc(o.title)}</b>
        <span class="repeat-flag">${freqLabel(o)}</span>
        <span class="tag-dim">${o.type}</span>
        <span style="font-size:11.5px;color:var(--muted)">${o.resAbn.length?('结果异常：'+o.resAbn.join(' · ')):'无结果异常'} · 最近 ${dstr(o.last)} · ${esc(o.own.owner)}</span>
      </div>
      <span class="num" style="margin-left:auto;font-size:11.5px;color:var(--accent)">全部记录 →</span></div>`).join('');
  const alerts=scopeTasks([code]).filter(t=>{const s=taskStatus(t);return s==='overdue'||s==='risk';}).sort((x,y)=>{const w=s=>s==='overdue'?0:1;return w(taskStatus(x))-w(taskStatus(y))||x.deadline-y.deadline;});
  const facAlertRows=alerts.map(t=>{const s=taskStatus(t);
    return `<tr class="clickable" data-drill="1" data-code="${t.meet.code}" data-meet="${t.meet.id}" data-task="${t.id}">
      <td><span class="pill ${s==='overdue'?'p-red':'p-yellow'}"><span class="d"></span>${s==='overdue'?'红':'黄'}</span></td>
      <td class="row-id">${t.meet.id}</td><td><b>${t.meet.code}</b> ${FACTORIES[t.meet.code].name.replace(/[（）()]/g,'')}</td>
      <td style="min-width:200px">${esc(t.content)}</td><td>${t.dept}</td><td>${esc(t.owner)}</td>
      <td class="c num">${dstr(t.deadline)}</td>
      <td class="c num" style="color:${s==='overdue'?'var(--red)':'var(--yellow)'}">${s==='overdue'?'超 '+Math.abs(daysUntil(t.deadline))+' 天':'剩 '+daysUntil(t.deadline)+' 天'}</td></tr>`;}).join('');
  const ai=scopeAI(DB[code],f.name);
  const note=f.note&&(code==='OS'||code==='NB')?` · <span style="color:#a06a08">${f.note}</span>`:'';
  return `
  <div class="section-title"><h2>${f.name} · 结果指标</h2><span class="sub">目标 ≥${target}% · 实际 · 达成率 · 预警</span><div class="rule"></div>
    <span class="badge">参会 ${num(facPeople(code))} 人 · 会议 ${num(a.meets.length)} 场${note}</span></div>
  <div class="kpi-row">
    ${kpi12({lbl:'近 12 个月会议决策事项总数',valHtml:`${num(a12F.total)}<small>项</small>`,foot:`本厂 近 12 个月会议 ${num(a12F.meets.length)} 场 · 决策事项 ${num(a12F.total)} 项`,stat:'plain',body:oneRow(`${a12F.total} 项`)})}
    ${kpi12({lbl:'事项完成率（近 12 个月）',valHtml:`${pct(a12F.compRate)}`,foot:`本厂 已完成 ${num(a12F.done)}/${num(a12F.total)} 项 · 目标 ≥${target}%`,stat:metricStatus(a12F.compRate,a12F.overdue>0),body:oneRow(pct(a12F.compRate))})}
    ${kpi12({lbl:'超期率（近 12 个月）',valHtml:`${pct(a12F.overdueRate)}`,foot:`本厂 超期 ${num(a12F.overdue)} 项 · 临期 ${num(a12F.risk)} 项 · 会议 ${num(a12F.meets.length)} 场`,stat:a12F.overdue>0?'red':(a12F.risk>0?'yellow':'green'),body:oneRow('超期率 '+pct(a12F.overdueRate))})}
    ${kpi12({lbl:'会议结案率（近 12 个月）',valHtml:`${pct(a12F.meetRate)}`,foot:`本厂 已结案 ${num(a12F.caseMeets)}/${num(a12F.wMeet)} 场 · 结案＝该场会议全部决议事项完成并关闭`,stat:metricStatus(a12F.meetRate,false),body:oneRow('结案率 '+pct(a12F.meetRate))})}
    ${kpi12({lbl:'异常重复事项（近 12 个月）',valHtml:`${num(abnF.extra)}<small>次</small>`,foot:`同一问题第 ${CFG.abnMin+1} 次上会起才计入 · 跨厂共性问题算集团`,stat:abnF.extra>0?'yellow':'green',body:oneRow('重复 '+abnF.extra+' 次')})}
  </div>
  <div class="card" style="margin-top:12px"><div class="card-h"><h3>按职能部门 · 结果指标</h3><span class="hint">主导场次数 = 该部门人员担任召集人的会议场次 · 异常重复次数按该异常最近一次发生的承接部门归属（各部门合计＝分厂合计）· 点击行 → 部门明细</span>
    <span class="sp"><button class="btn sm" data-goto="dim" data-code="${code}" data-dimtype="4m1e" data-dim="机">4M1E 维度 →</button><button class="btn sm" data-goto="dim" data-code="${code}" data-dimtype="sqcds" data-dim="质量">SQCDS 维度 →</button></span></div>
    <div class="card-b flush scroll-x"><table class="tbl-dense"><thead><tr><th>职能部门</th><th class="c">主导场次数</th><th class="r">会议结案率</th><th class="c">承接事项数</th><th class="c">已完成</th><th class="r">完成率</th><th class="c">超期</th><th class="c">临期</th><th class="c">异常重复次数</th><th class="c">跨厂共性</th><th class="c">状态</th></tr></thead><tbody>${resultRows}</tbody></table></div></div>
  <div class="grid-12" style="margin-top:12px">
    <div class="span-6" style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div class="card"><div class="card-h" style="padding:8px 12px"><h3 style="font-size:13px">部门超期预警TOP</h3><span class="hint">本厂 · 按红黄影响取前 5</span></div>
        <div class="card-b flush">${procItems||'<div class="empty">数据不足</div>'}</div></div>
      <div class="card" style="flex:1;display:flex;flex-direction:column"><div class="card-h" style="padding:8px 12px"><h3 style="font-size:13px">异常重复事项 TOP5</h3><span class="hint">本厂同一问题第 ${CFG.abnMin+1} 次上会起才计入 · 点行看全部记录</span></div>
        <div class="card-b flush" style="flex:1">${abnTopItems||'<div class="empty">本厂内暂无异常重复事项（跨厂共性问题见集团统计分析）</div>'}</div></div>
    </div>
    <div class="card span-6"><div class="card-h"><h3>超期明细排名</h3><span class="hint">本厂 · 点击行 → 任务明细</span>
      <span class="sp"><span class="pill p-red"><span class="d"></span>${alerts.filter(t=>taskStatus(t)==='overdue').length}</span><span class="pill p-yellow"><span class="d"></span>${alerts.filter(t=>taskStatus(t)==='risk').length}</span></span></div>
      <div class="card-b flush" style="max-height:340px;overflow:auto"><table style="min-width:620px">
        <thead><tr><th>级别</th><th>会议编号</th><th>分厂</th><th>任务</th><th>部门</th><th>责任人</th><th class="c">截止时间</th><th class="c">距截止</th></tr></thead>
        <tbody>${facAlertRows||'<tr><td colspan="8"><div class="empty">本厂无红黄预警</div></td></tr>'}</tbody></table></div></div>
  </div>
  <div style="margin-top:12px">${aiCard(ai,f.name)}</div>`;

/* ===================== 维度过滤工具 ===================== */
function filterMeets(meets,type,dim){return meets.filter(m=>type==='4m1e'?m.d4===dim:type==='sqcds'?m.dS===dim:type==='dept'?m.tasks.some(t=>t.dept===dim):true);}
function dimMeta(type,dim){
  if(type==='4m1e')return {label:DIM4[dim],desc:DIM4N[dim]};
  if(type==='sqcds')return {label:SQCDS[dim],desc:''};
  return {label:dim,desc:''};
}
function defDept(code){const ds=deptRowsOf(DB[code]).map(r=>r.dept);return ds.indexOf('制造课')>=0?'制造课':(ds[0]||'制造课');}
/* ===================== 视图：维度下钻（部门 / 4M1E / SQCDS） ===================== */
function vDimDeptPage(code,dept){
  const f=FACTORIES[code];
  const selMeets=scopeMeetings([code]).filter(m=>m.tasks.some(t=>t.dept===dept))
    .map(m=>Object.assign({},m,{tasks:m.tasks.filter(t=>t.dept===dept)}));
  const agg=aggMeetings(selMeets);
  const persons=personRowsOf(selMeets);
  const pRows=persons.map(p=>`<tr class="clickable" data-person="${p.owner}">
    <td><b>${esc(p.owner)}</b></td><td class="c num">${p.total}</td><td class="c num">${p.done}</td>
    <td class="c num">${p.total-p.done}</td>
    <td class="c num" style="color:${p.overdue>0?'var(--red)':'var(--muted)'}">${p.overdue}</td>
    <td class="c num" style="color:${p.risk>0?'var(--yellow)':'var(--muted)'}">${p.risk}</td>
    <td class="r">${rateBar(p.compRate,CFG_COLORS[code])}</td><td class="r num">${pct(p.overdueRate)}</td>
    <td class="c">${stPill(p)}</td></tr>`).join('');
  const tRows=selMeets.flatMap(m=>m.tasks).map(t=>{const s=taskStatus(t);
    return `<tr class="clickable" data-drill="1" data-code="${code}" data-meet="${t.meetId}" data-task="${t.id}">
    <td class="row-id">${taskNoOf(t)}</td><td style="min-width:220px">${esc(t.content)}</td>
    <td>${esc(t.owner)}</td><td class="c num">${t.deadline?dstr(t.deadline):'—'}</td>
    <td class="r">${rateBar(t.progress/100,t.done?'#178a50':s==='overdue'?'var(--red)':'#1b5cb8')}</td>
    <td class="c">${fileCell(t)}</td><td class="c">${taskPill(t)}</td></tr>`;}).join('');
  const ai=scopeAI(selMeets,f.name+' · '+dept);
  return `
  <div class="section-title"><h2>部门详情 · ${dept}</h2><span class="sub">${f.name} · 本部门决议事项与责任人</span><div class="rule"></div>
    <span class="badge">会议 ${num(selMeets.length)} 场 · 事项 ${num(agg.total)} 项</span></div>
  <div class="kpi-row" style="margin-bottom:16px">
    ${metricCard({lbl:'事项完成率',valHtml:`${pct(agg.compRate)}`,foot:`${num(agg.done)}/${num(agg.total)} 项 · 目标 ≥${CFG.target}%`,stat:metricStatus(agg.compRate,agg.overdue>0)})}
    ${metricCard({lbl:'超期（红）',val:agg.overdue,foot:'红色预警',stat:agg.overdue>0?'red':'green'})}
    ${metricCard({lbl:'临期（黄）',val:agg.risk,foot:'≤'+CFG.riskDays+' 天',stat:agg.risk>0?'yellow':'green'})}
    ${metricCard({lbl:'在办事项',val:agg.open,foot:'进行中',stat:'plain'})}
    ${metricCard({lbl:'重复会议',val:selMeets.filter(m=>m.repeat>1).length,foot:'主题相近≥70%且召集人相同自动累计',stat:agg.repeatMeets>0?'yellow':'green'})}
  </div>
  
  <div class="grid-12">
    <div class="card span-7"><div class="card-h"><h3>责任人统计</h3><span class="hint">点击行 → 个人全部任务</span></div>
      <div class="card-b flush scroll-x"><table><thead><tr><th>责任人</th><th class="c">事项</th><th class="c">已完成</th><th class="c">在办</th><th class="c">超期</th><th class="c">临期</th><th class="r">完成率</th><th class="r">超期率</th><th class="c">状态</th></tr></thead>
      <tbody>${pRows||'<tr><td colspan="9"><div class="empty">暂无数据</div></td></tr>'}</tbody></table></div></div>
    <div class="card span-5"><div class="card-h"><h3>任务明细</h3><span class="hint">共 ${agg.total} 项 · 点击行 → 闭环</span></div>
      <div class="card-b flush scroll-y" style="max-height:440px"><table><thead><tr><th>任务号</th><th>任务内容</th><th>责任人</th><th class="c">截止</th><th class="r">进度</th><th class="c">佐证</th><th class="c">状态</th></tr></thead>
      <tbody>${tRows||'<tr><td colspan="7"><div class="empty">暂无任务</div></td></tr>'}</tbody></table></div></div>
  </div>
  <div style="margin-top:12px">${aiCard(ai,f.name+' · '+dept)}</div>`;
}
function vDim(code,type,dim){
  if(STATE.role==='D')return vDimDeptPage(code,dim);
  const f=FACTORIES[code];

/* ===================== 我的任务（当事人视角） ===================== */
function myTasksOf(person){
  const tasks=[];const hp=deptOfPerson(person);
  (DB[hp.code]||[]).forEach(m=>m.tasks.forEach(t=>{if(t.owner===person&&(!hp.dept||t.dept===hp.dept))tasks.push(Object.assign({meet:m},t));}));
  const myMeets=(DB[hp.code]||[]).filter(m=>m.convener===person);
  return {tasks,myMeets,visMeets:personVisibleMeets(person)};
}
/* ===== 当事人可见范围（2026-09 领导口径收紧）：仅本厂本部门 + 与本人相关 =====
   外厂一律不可见；本厂其他部门不可见。相关＝我召集 / 我参会 / 我负责事项 / 我审核（验收或上级审核） */
function facOfPerson(n){
  for(const c of FCODES){const o=ORG[c];if(!o)continue;
    if((o.heads||[]).indexOf(n)>=0)return c;
    const ds=Object.keys(o.owners||{});
    for(const d of ds){if((o.owners[d]||[]).indexOf(n)>=0)return c;}}
  return 'HQ';
}
function personRel(m,n){
  if(m.convener===n)return '我召集';
  if((m.attendees||[]).indexOf(n)>=0)return '我参会';
  if((m.tasks||[]).some(t=>t.owner===n))return '我负责事项';
  if((m.tasks||[]).some(t=>t.verifyBy===n||t.supBy===n))return '我审核';
  return '';
}
function meetInvolves(m,n){return !!personRel(m,n);}
function personVisibleMeets(n){
  const hp=deptOfPerson(n),out=[];
  (DB[hp.code]||[]).forEach(m=>{                       // 只取本厂
    const inDept=(!hp.dept)||m.dept===hp.dept||(m.tasks||[]).some(t=>t.dept===hp.dept);   // 只取本部门
    const rel=personRel(m,n);                          // 且与本人相关
    if(inDept&&rel)out.push(Object.assign({},m,{scopeTag:'本部门 · 我相关',home:hp.code,dept:hp.dept,rel:rel}));
  });
  out.sort((a,b)=>b.time-a.time);
  return out;
}

  const overdue=byS('overdue').sort((a,b)=>a.deadline-b.deadline);
  const done=byS('done').sort((a,b)=>b.verify-a.verify);
  const noddl=byS('noddl');
  const row=(t,pre)=>{const s=taskStatus(t);
    return `<div class="alert-item" data-drill="1" data-code="${t.meet.code}" data-meet="${t.meet.id}" data-task="${t.id}">
      <div class="alert-sev ${s==='overdue'?'red':s==='risk'?'yellow':s==='noddl'?'grey':'green'}">${s==='overdue'?'红':s==='risk'?'黄':s==='noddl'?'排':(t.done?'✓':'办')}</div>

      ${statusPill(s)}<span class="num" style="margin-left:auto;font-size:12px;color:var(--muted)">${t.progress}%</span></div>`;};
  const meetRow=m=>{const st=meetState(m);const out=(m.home&&m.code!==m.home);
    return `<div class="alert-item" data-goto="meet" data-code="${m.code}" data-meet="${m.id}">
