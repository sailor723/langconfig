/* ===================== 统计分析 V2（效果链改版 · 依据「09 统计分析重构建议」口径 V4） ===================== */
const STD_KW=['SOP','标准','规程','参数','固化','作业指导','检验标准','保养标准','点检'];
/* 四厂共用职能（设在 HQ，服务四个厂区）：业务 / 财务 / 资材 / 技术 / IT —— 合并四厂数据、只显示课别 */
const SHARED_DEPT=['业务课','财务课','资材课','技术课','IT课'];
const deptNorm=s=>String(s||'').replace(/^HQ·/,'');

const isAbn2=t=>((t.nature||taskNature(t.content))==='异常');
const done4=t=>!!t.done&&evN(t)>=4&&!!t.supPass;                      // 闭环＝执行 + 四件套齐 + 上级&AI 审核通过
const stdHit=t=>!!t.done&&STD_KW.some(k=>String(t.content).indexOf(k)>=0);
const effColor=v=>v>=80?'var(--green)':v>=60?'var(--yellow)':'var(--red)';
const noUnit=o=>{const s=o.y;return s?'<span class="pill p-grey"><span class="d"></span>未立项</span>':'<span class="pill p-grey"><span class="d"></span>未立项</span>';};
function winRows(codes,s,e){const out=[];scopeMeetings(codes).filter(m=>m.time>s&&m.time<=e).forEach(m=>m.tasks.forEach(t=>out.push({t,m})));return out;}
function abnRows2(rows){return rows.filter(x=>isAbn2(x.t));}
function repCnt2(codes,s,e){const g={};abnRows2(winRows(codes,s,e)).forEach(x=>{const fp=abnFpOf(x.t.content);if(!fp||fp==='—')return;(g[fp]=g[fp]||new Set()).add(x.m.id);});return Object.values(g).filter(v=>v.size-1>=CFG.abnMin).length;}
function effMetrics(codes,s,e){
  const rows=winRows(codes,s,e),abn=abnRows2(rows);
  const found=abn.length,measure=abn.filter(x=>x.t.owner&&x.t.deadline).length,closed=abn.filter(x=>done4(x.t)).length;
  const std=rows.filter(x=>stdHit(x.t)).length;
  return {found,measure,closed,std,rep:repCnt2(codes,s,e),rate:found?closed/found:0};
}
function effData(codes,days){
  const s1=addDays(NOW,-days),s0=addDays(NOW,-2*days);
  const cur=effMetrics(codes,s1,NOW),prev=effMetrics(codes,s0,s1);
  const dl=(a,b)=>b?((b-a)/b):0;
  return {cur,prev,abnDl:dl(cur.found,prev.found),repDl:dl(cur.rep,prev.rep),days};
}
function subjData(codes,days){
  const s1=addDays(NOW,-days),s0=addDays(NOW,-2*days);
  const curAll=winRows(codes,s1,NOW),prevAbn=abnRows2(winRows(codes,s0,s1));
  const totAbn=abnRows2(curAll).length||1;
  const mk=()=>({meets:{},tasks:0,closed:0,abn:0,abnP:0,std:0,hours:0,doneN:0,onTime:0,evOk:0});
  const dm={};
  curAll.forEach(({t,m})=>{const dn=deptNorm(t.dept),shd=SHARED_DEPT.indexOf(dn)>=0,key=shd?('共用 '+dn):(m.code+' · '+dn);
    const o=dm[key]=dm[key]||Object.assign(mk(),{code:shd?'四厂共用':m.code,dept:dn,shared:shd});
    o.meets[m.id]=1;o.tasks++;
    if(done4(t))o.closed++;
    if(isAbn2(t))o.abn++;
    if(stdHit(t))o.std++;
    if(t.done){o.doneN++;if(t.deadline&&t.verify&&t.verify<=t.deadline)o.onTime++;}
    if(evN(t)>=4)o.evOk++;
    o.hours+=meetHours(m)/Math.max(1,m.tasks.length);
  });
  prevAbn.forEach(x=>{const dn=deptNorm(x.t.dept),shd=SHARED_DEPT.indexOf(dn)>=0,key=shd?('共用 '+dn):(x.m.code+' · '+dn);
    const o=dm[key]=dm[key]||Object.assign(mk(),{code:shd?'四厂共用':x.m.code,dept:dn,shared:shd});o.abnP++;});
  const maxStd=Math.max(1,...Object.values(dm).map(o=>o.std));
  const dRows=Object.keys(dm).map(k=>{const o=dm[k];const closedR=o.tasks?o.closed/o.tasks:0;
    const resp=Math.round(100*(0.6*(o.doneN?o.onTime/o.doneN:0)+0.4*(o.tasks?o.evOk/o.tasks:0)));
    const dS=o.abnP?Math.max(0,Math.min(1,0.5+(o.abnP-o.abn)/(o.abnP*2))):(o.abn===0?1:0.6);
    const sS=o.std/maxStd;
    const eff=Math.round(100*(0.4*closedR+0.35*dS+0.25*sS));
    return {key:k,dept:o.dept,code:o.code,shared:o.shared,meets:Object.keys(o.meets).length,tasks:o.tasks,closed:o.closed,closedR,resp,eff,
      abn:o.abn,abnP:o.abnP,share:o.abn/totAbn,std:o.std,per:o.hours?o.closed/o.hours:0};
  }).filter(r=>r.tasks>0||r.abn>0).sort((a,b)=>a.eff-b.eff);
  const ps={};
  curAll.forEach(({t,m})=>{if(!t.owner)return;const o=ps[t.owner]=ps[t.owner]||{name:t.owner,dept:t.dept,meets:0,tasks:0,closed:0,abn:0,std:0,doneN:0,onTime:0,evOk:0,ms:{}};
    o.tasks++;o.ms[m.id]=1;if(done4(t))o.closed++;if(isAbn2(t))o.abn++;if(stdHit(t))o.std++;
    if(t.done){o.doneN++;if(t.deadline&&t.verify&&t.verify<=t.deadline)o.onTime++;}
    if(evN(t)>=4)o.evOk++;
  });
  const maxStdP=Math.max(1,...Object.values(ps).map(o=>o.std));
  const pRows=Object.values(ps).map(o=>{const closedR=o.tasks?o.closed/o.tasks:0;
    const resp=Math.round(100*(0.6*(o.doneN?o.onTime/o.doneN:0)+0.4*(o.tasks?o.evOk/o.tasks:0)));
    const eff=Math.round(100*(0.45*closedR+0.3*resp/100+0.25*(o.std/maxStdP)));
    return {name:o.name,dept:o.dept,meets:Object.keys(o.ms).length,tasks:o.tasks,closed:o.closed,closedR,resp,eff,abn:o.abn,std:o.std};
  }).sort((a,b)=>a.eff-b.eff);
  return {dRows,pRows,totAbn};
}
function improveRows(codes,days){
  const s1=addDays(NOW,-days);
  const S=abnStats(FCODES),list=[],seen={};
  S.crossItems.concat(S.repItems.filter(o=>o.extra>=CFG.abnAI)).forEach(o=>{if(seen[o.fp])return;seen[o.fp]=1;if(o.extra<CFG.abnMin)return;list.push(o);});
  list.sort((a,b)=>b.extra-a.extra);
  const rows=list.map(o=>{const y=YK[o.title];
    const at=y&&y.at?new Date(y.at):null;
    const before=at?o.list.filter(x=>x.m.time<at).length:o.list.length;
    const after=at?o.list.filter(x=>x.m.time>=at).length:0;
    return {o,y,id:y?y.id:'—',before,after,rec:at&&before?after/before:null,
      fac:Object.keys(o.byFac).length,owner:y?y.owner:ykOwnerOf(o.type),due:dstr(ykDue(y)),
      status:y?y.status:'未立项',ev:y?ykEvN(y):0,sys:!!(y&&y.sysFile),cross:Object.keys(o.byFac).length>=2};
  });
  const doc=winRows(codes,s1,NOW).filter(x=>stdHit(x.t)).sort((a,b)=>(b.t.verify||0)-(a.t.verify||0)).slice(0,12);
  return {rows,doc,ykCnt:Object.keys(YK).length,closedCnt:Object.values(YK).filter(y=>y.status==='已关闭').length};
}
function effAI(r,totAbn){
  const lvl=r.eff>=80?'良好':r.eff>=60?'待提升':'需重点改进';
  const dl=r.abnP>r.abn?`环比下降 <b>${pct((r.abnP-r.abn)/Math.max(1,r.abnP))}</b>`:r.abnP<r.abn?`环比上升 <b style="color:var(--red)">${pct((r.abn-r.abnP)/Math.max(1,r.abnP))}</b>`:'环比持平';
  const sum=`${r.dept} 本期承接事项 <b>${r.tasks}</b> 项、闭环率 <b>${pct(r.closedR)}</b>、责任闭环指数 <b>${r.resp}/100</b>、会议效能指数 <b>${r.eff}/100</b>（${lvl}）；异常承接 <b>${r.abn}</b> 项（占集团 ${pct(r.share)}），${dl}。`;
  const cause=r.resp<75?'根因（法 / 环）：对策未落到「1 名主责 + 1 项标准 + 完成期限」，且佐证四件套不齐，效果无法验证。'
    :(r.std<2?'根因（法）：改善未沉淀为标准，同类问题仍靠人盯，复发难以避免。'
    :'根因（料 / 机）：闭环机制正常，问题集中在异常承接量与对策更换频率。');
  const sugg=`① 对超期与未闭环事项设中期检查点，由 ${r.dept} 负责人按周回顾，差 2 天预警；② 选 1 项高发异常做标准化（输出 SOP / 检验或保养标准）并留齐佐证四件套；③ 连续 ≥3 次上会未更换对策的议题并入固定议程，减少重复开会。`;
  const sup='跨厂共性问题由集团职能横向展开；标准修订需技术 / 品保会签。';
  return {sum,cause,sugg,sup};
}
function funnelHtml(c){
  const steps=[['发现异常',c.found,'会议 / 客诉 / 停线 / 巡检 / 退货','#1b5cb8'],
    ['形成对策',c.measure,'含 1 名主责 + 1 项标准 + 完成期限','#2f7bff'],
    ['验证闭环',c.closed,'佐证四件套齐 + 上级与 AI 审核通过','#178a50'],

/* ===================== 成绩统计（责任人 / 审核人 · 人·事评价） ===================== */
function pScoreRows(codes){
  const tasks=scopeMeetings(codes).flatMap(m=>m.tasks.map(t=>({t,m})));
  const byP={};
  tasks.forEach(({t,m})=>{if(!t.owner)return;(byP[t.owner]=byP[t.owner]||{name:t.owner,dept:t.dept,code:m.code,tasks:[]}).tasks.push(t);});
  const rows=Object.values(byP).map(p=>{
    const tot=p.tasks.length||1;
    const sc=p.tasks.map(t=>taskAI(t,null));
    const ren=Math.round(sc.reduce((s,x)=>s+x.tl,0)/tot);
    const shi=Math.round(sc.reduce((s,x)=>s+x.comp,0)/tot);
    const all=Math.round(sc.reduce((s,x)=>s+x.score,0)/tot);
    const sorted=p.tasks.slice().sort((a,b)=>a.deadline-b.deadline);
    let run=0,max=0;sorted.forEach(t=>{if(taskStatus(t)==='overdue'){run++;max=Math.max(max,run);}else run=0;});
    const done=p.tasks.filter(t=>t.done).length;
    return {name:p.name,dept:p.dept,code:p.code,tot:p.tasks.length,done,ren,shi,all,maxRun:max,compRate:p.tasks.length?done/p.tasks.length:0};
  });
  rows.sort((a,b)=>a.all-b.all);
  return rows;
}
function aScoreRows(codes){
  const byA={};
  scopeMeetings(codes).forEach(m=>m.tasks.forEach(t=>{if(t.done){const a=t.supBy||t.verifyBy||m.convener;(byA[a]=byA[a]||{name:a,tasks:[]}).tasks.push(t);}}));
  const rows=Object.values(byA).map(a=>{const n=a.tasks.length;const bad=a.tasks.filter(t=>!aiReview(t).pass).length;const noSup=a.tasks.filter(t=>!t.supPass).length;const score=Math.round(100*(n-bad-noSup)/Math.max(1,n));return {name:a.name,n,bad,noSup,score};});
  rows.sort((x,y)=>x.score-y.score);
  return rows;
}

/* ===================== 页面级 AI 内审（领导要求：8 个导航主项都要有，且都放在最后一个版块） ===================== */
const AI_STD=['SOP','标准','规程','参数','固化','作业指导','检验标准','保养标准','点检'];
function aiRowsIn(codes,a,b){const o=[];scopeMeetings(codes).filter(m=>m.time>a&&m.time<=b).forEach(m=>m.tasks.forEach(t=>o.push({t,m})));return o;}
const aiIsAbn=t=>((t.nature||taskNature(t.content))==='异常');
const aiClosed=t=>!!t.done&&evN(t)>=4&&!!t.supPass;
const aiStd=t=>!!t.done&&AI_STD.some(k=>String(t.content).indexOf(k)>=0);
/* 统计分析 · AI 内审 */
function statsAI(codes,days){
  const d=days||30,s1=addDays(NOW,-d),s0=addDays(NOW,-2*d);
  const cur=aiRowsIn(codes,s1,NOW),prev=aiRowsIn(codes,s0,s1);
  const a1=cur.filter(x=>aiIsAbn(x.t)),a0=prev.filter(x=>aiIsAbn(x.t));
  const found=a1.length,measure=a1.filter(x=>x.t.owner&&x.t.deadline).length,closed=a1.filter(x=>aiClosed(x.t)).length;
  const std=cur.filter(x=>aiStd(x.t)).length;
  const conv=found?closed/found:0,dn=a0.length?(a0.length-found)/a0.length:0;
  const dm={};cur.forEach(x=>{const d2=x.t.dept;const o=dm[d2]=dm[d2]||{n:0,c:0};o.n++;if(aiClosed(x.t))o.c++;});
  const weak=Object.keys(dm).map(k=>({dept:k,rate:dm[k].n?dm[k].c/dm[k].n:0,n:dm[k].n})).filter(o=>o.n>0).sort((a,b)=>a.rate-b.rate)[0];
  const tl=Math.round(40*conv);
  const co=Math.min(20,12+(cur.filter(x=>x.t.owner&&x.t.deadline).length?8:0));
  const lg=(dn>=0?16:8)+(conv>=0.9?4:2);
  const rp=(std>0?18:10)+(found<=a0.length?2:0);
  const score=Math.min(100,tl+co+lg+rp);
  const finds=[];
  if(dn<0)finds.push({sev:'r',txt:'异常事项数环比上升（本期 '+found+' 项 / 上期 '+a0.length+' 项），对策未止住源头'});
  if(found&&conv<0.9)finds.push({sev:'y',txt:'发现 → 闭环 转化率 '+pct(conv)+'，未闭环 '+num(found-closed)+' 项（佐证四件套或审核未过）'});
  if(closed>0&&std===0)finds.push({sev:'y',txt:'已闭环 '+num(closed)+' 项但标准固化 0 件 —— 完成不等于沉淀'});
  if(weak&&weak.rate<0.8)finds.push({sev:'y',txt:'闭环率末位部门：'+weak.dept+'（'+pct(weak.rate)+'，'+weak.n+' 项）'});
  if(!finds.length)finds.push({sev:'g',txt:'异常下降、闭环与标准固化链条完整，未发现过程异常'});
  return {score,timeliness:tl,correctness:co,logic:lg,repeat:rp,
    summary:'本期链路：<b>发现异常 '+num(found)+' 项 → 形成对策 '+num(measure)+' → 验证闭环 '+num(closed)+' → 固化为标准 '+num(std)+' 件</b>；综合转化率 '+pct(conv)+'，异常环比'+(dn>=0?('下降 '+pct(dn)):('上升 '+pct(Math.abs(dn))))+'。',
    rootCause:conv<0.9?'根因（法）：对策已定但闭环验证缺佐证或审核，形成"做完未闭环"；缺中期检查点。':(std===0?'根因（法）：闭环后未要求标准沉淀，同类问题仍靠人盯。':'根因（料 / 机）：异常承接量与对策更换频率偏高，机制运转正常。'),
    countermeasure:'① 未闭环事项设中期检查点（截止前 2 天预警），主责部门按周回顾；② 每季至少 1 项高发异常转标准（SOP / 检验 / 保养）并留齐四件套；③ 连续 ≥3 次上会未更换对策的议题并入固定议程。',
    findings:finds.slice(0,4)};
}

/* ===================== 全屏下钻（任务 / 预警全部 / 个人） ===================== */
let zoom=1,ovStack=[],OVYK=null;
function ovShow(){const t=ovStack[ovStack.length-1],ov=document.getElementById('overlay');if(!t){ov.classList.remove('show');return;}const oc=document.getElementById('ovContent');oc.style.maxWidth='';document.getElementById('ovTitle').textContent=t.title;oc.innerHTML=t.html;document.getElementById('ovBk').style.display='inline-flex';zoom=1;applyZoom();ov.classList.add('show');}
function showOv(title,html){ovStack.push({title:title,html:html});ovShow();}
function ovBack(){if(ovStack.length>1){ovStack.pop();ovShow();}else ovClose();}
function ovClose(){ovStack=[];OVYK=null;document.getElementById('overlay').classList.remove('show');}
function applyZoom(){const c=document.getElementById('ovContent');c.style.transform='';c.style.zoom=zoom;}
function findMeet(code,id){return (DB[code]||[]).find(m=>m.id===id);}
function taskDrill(code,meetId,taskId){
  const m=findMeet(code,meetId);if(!m)return;
  const t=m.tasks.find(x=>x.id===taskId);if(!t)return;
  if(!taskInScope(Object.assign({},t,{meet:m}))){toast('该事项不在你的查看范围内（部门负责人仅本部门 / 当事人仅本部门且本人相关）');return;}
  const s=taskStatus(t),ta=taskAI(t,m);
  const {pass:aiPass,four:fourOK,n:n4,reason:aiReason}=aiReview(t);
  const chk=(ok,txt)=>`<div class="find"><span class="fd ${ok?'g':(txt.indexOf('未排期')>=0||txt.indexOf('缺')>=0||txt.indexOf('✗')>=0?'y':'r')}"></span><span>${txt}${ok?' ✓':' ✗'}</span></div>`;
  const chkList=
    chk(t.owner&&t.owner!=='未指定','责任人：'+esc(t.owner||'未指定'))+
    chk(!t.noddl&&t.deadline,'截止时间：'+(t.deadline?dstr(t.deadline):'未排期'))+
    chk(!t.done||t.verify,'完成时间：'+(t.verify?dstr(t.verify):(t.done?'缺':'未完成')))+
    chk(fourOK,'佐证四件套：'+n4+'/4'+(fourOK?'':'（缺：'+EV4.filter(k=>!(t.ev&&t.ev[k])).join(' / ')+'）'))+
    chk(!t.logicBad,'逻辑自洽：'+(t.logicBad?'截止早于会议时间':'通过'));
  const actHtml=t.done
    ?`<div class="find-list" style="margin-top:2px">
        <div class="find"><span class="fd ${aiPass?'g':'r'}"></span><span>AI 审核：${aiPass?'通过':'不通过 —— '+aiReason}</span></div>
        <div class="find"><span class="fd ${t.supPass?'g':'y'}"></span><span>上级审核：${t.supPass?('已通过 · '+esc(t.supBy||'—')):'未审核（历史关闭记录待补审）'}</span></div></div>`
    :`<div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${EV4.map(k=>`<button class="btn sm" data-act="ev" data-k="${k}" data-code="${code}" data-meet="${m.id}" data-task="${t.id}">上传「${k}」${t.ev&&t.ev[k]?'✓':''}</button>`).join('')}
          <button class="btn sm" data-act="sup" data-code="${code}" data-meet="${m.id}" data-task="${t.id}">上级审核通过</button>
          <button class="btn sm primary" data-act="close" data-code="${code}" data-meet="${m.id}" data-task="${t.id}">人工验收并关闭</button>
          <span style="font-size:11px;color:var(--muted)">四件套齐全 → AI 审核通过 → 上级审核通过，方可关闭；任一不通过不允许关闭</span>
        </div>
        <div class="find-list" style="margin-top:8px">
          <div class="find"><span class="fd ${aiPass?'g':'r'}"></span><span>AI 审核：${aiPass?'通过':'不通过 —— '+aiReason}</span></div>
          <div class="find"><span class="fd ${t.supPass?'g':'y'}"></span><span>上级审核：${t.supPass?('已通过 · '+esc(t.supBy||'—')):'待审核'}</span></div>
        </div></div>`;
  const tn=m.tasks.indexOf(t)+1;
  showOv('任务闭环明细 · 第 '+tn+' 项决议',`<div style="padding:20px 24px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${statusPill(s)}<span class="row-id">${m.id} · 第 ${tn} 项决议（共 ${m.tasks.length} 项）</span><span class="tag-dim">${m.code} · ${t.dept}</span><span style="background:#eaf3ff;border:1px solid #bcd7f6;color:#1f66d8;font-weight:700;padding:2px 10px;border-radius:14px;font-size:12px;white-space:nowrap">AI 审核 ${ta.score}/100</span>

function deptOptions(){
  const out=[];
  FCODES.forEach(c=>{deptRowsOf(DB[c]).forEach(r=>{if(r.dept)out.push(c+'::'+r.dept);});});

function scopeCodes(){
  if(STATE.role==='GM')return FCODES.slice();
  if(STATE.role==='F')return [STATE.ident||'HQ'];
  if(STATE.role==='D'){const c=(STATE.ident||'HQ::制造课').split('::')[0];return [c];}
  if(STATE.role==='P')return [deptOfPerson(STATE.ident||'').code];

function scopeLabel(){
  if(STATE.role==='F')return '本厂（'+STATE.ident+'）';
  if(STATE.role==='D'){const p=STATE.ident||'HQ::制造课',c=p.split('::');return c[1]+'（'+c[0]+'）';}
  if(STATE.role==='P')return '当事人（'+STATE.ident+'）';

function defaultHome(){
  if(STATE.role==='F')return '#/factory/'+(STATE.ident||'HQ');
  if(STATE.role==='D'){const p=(STATE.ident||'HQ::制造课').split('::');return '#/dim/'+p[0]+'/dept/'+p[1];}
  if(STATE.role==='P')return '#/mine';
  return '#/group';
}
function allowRoute(){
  const v=STATE.view;
  if(STATE.role==='GM')return true;
  if(STATE.role==='F'){if(v==='factory')return STATE.code===STATE.ident;if(v==='dim')return STATE.code===STATE.ident;if(v==='meet')return STATE.code===STATE.ident;if(v==='stats'||v==='kb'||v==='score')return true;return false;}
  if(STATE.role==='D'){const pD=(STATE.ident||'HQ::制造课').split('::');
    if(v==='dim'&&STATE.code===pD[0]&&STATE.type==='dept'&&STATE.dim===pD[1])return true;
    if(v==='meet'){const m=findMeet(STATE.code,STATE.meet);return !!m&&m.code===pD[0]&&meetInDeptScope(m);}
    if(v==='stats'||v==='score')return true;return false;}
  if(STATE.role==='P'){if(v==='mine')return true;
    if(v==='meet'){const m=findMeet(STATE.code,STATE.meet);return !!m&&personVisibleMeets(STATE.ident||'').some(x=>x.id===m.id&&x.code===m.code);}
    return false;}
  return false;
}
function route(){
  const h=location.hash.replace('#/','')||'';
  const parts=h.split('/');
  const seg=i=>{if(parts[i]==null)return null;try{return decodeURIComponent(parts[i]);}catch(e){return parts[i];}};
  STATE.view=parts[0]||'group';
  if(STATE.view==='factory')STATE.code=parts[1]||STATE.ident||'HQ';
  else if(STATE.view==='dim'){STATE.code=parts[1]||'HQ';STATE.type=parts[2]||'dept';STATE.dim=seg(3)||(STATE.type==='4m1e'?'机':STATE.type==='sqcds'?'质量':'制造课');}
  else if(STATE.view==='meet'){STATE.code=parts[1]||'HQ';STATE.meet=seg(2)||'';}
  if(!FCODES.includes(STATE.code))STATE.code='HQ';
  if(!allowRoute()){
    const d=defaultHome();
    history.replaceState(null,'',d);
    const hp=d.replace('#/','').split('/');
    STATE.view=hp[0];STATE.code=hp[1]||'HQ';
    if(STATE.view==='dim'){STATE.type=hp[2]||'dept';STATE.dim=hp[3]||'制造课';}
    if(STATE.view==='factory')STATE.code=hp[1];
  }
  if(STATE.view==='dim'){
    if(STATE.type==='dept'){const ds=deptRowsOf(DB[STATE.code]).map(r=>r.dept);if(!ds.includes(STATE.dim))STATE.dim=ds[0]||'制造课';}
    else if(STATE.type==='4m1e'&&!['人','机','料','法','环'].includes(STATE.dim))STATE.dim='机';
    else if(STATE.type==='sqcds'&&!['安全','质量','成本','交期','服务'].includes(STATE.dim))STATE.dim='质量';
  }
  const rk=STATE.view+'|'+STATE.code+'|'+(STATE.view==='dim'?STATE.type+'|'+STATE.dim:(STATE.view==='meet'?STATE.meet:''));
  if(rk!==lastRoute){STATE.f={q:'',time:'all'};STATE.kbq='';}
  lastRoute=rk;
}

let dimTimer=null;
function bindAfter(){
  // 维度页时间筛选 / 关键词（4M1E / SQCDS）
  if(STATE.view==='dim'&&STATE.type!=='dept'){
    const ts=document.querySelector('#main [data-df="time"]');
    if(ts)ts.onchange=()=>{STATE.f.time=ts.value;render();};
    const qi=document.querySelector('#main [data-df="q"]');
    if(qi)qi.oninput=()=>{clearTimeout(dimTimer);const q=qi.value;dimTimer=setTimeout(()=>{STATE.f.q=q;render();},350);};
  }
  if(STATE.view==='kb'){
    const q=document.getElementById('kbQ');
    if(q){q.onkeydown=e=>{if(e.key==='Enter'){STATE.kbq=q.value;render();}};document.getElementById('kbGo').onclick=()=>{STATE.kbq=q.value;render();};}
  }
  if(STATE.view==='stats'){
    const sf=document.querySelector('#main [data-sf]');
    if(sf)sf.onchange=()=>{STATE.sf=sf.value;render();};
    const pdx=document.querySelector('#main [data-pd]');
    if(pdx)pdx.onchange=()=>{STATE.pd=pdx.value;render();};
    const dp2=document.querySelector('#main [data-dp2]');
    if(dp2)dp2.onchange=()=>{STATE.dp2=dp2.value;render();};
  }
  const dp2g=document.querySelector('#main [data-dp2]');
  if(dp2g)dp2g.onchange=()=>{STATE.dp2=dp2g.value;render();};
  if(STATE.view==='cfg'){
    document.querySelectorAll('[data-cfg]').forEach(inp=>{
      const id='cv-'+inp.dataset.cfg;
      if(inp.type==='range'){
        inp.oninput=()=>{const el=document.getElementById(id);if(el)el.textContent=inp.value+({riskDays:' 天',cost:' 元'}[inp.dataset.cfg]||'%');};
        inp.onchange=()=>{CFG[inp.dataset.cfg]=parseInt(inp.value,10);saveCfg(CFG);render();};
      }else if(inp.type==='radio'){
        inp.onchange=()=>{if(!inp.checked)return;CFG[inp.dataset.cfg]=inp.value;saveCfg(CFG);render();};
      }else if(inp.type==='number'){
        inp.onchange=()=>{const v=parseInt(inp.value,10)||0;
          if(inp.dataset.cfgn==='abnMin')CFG.abnMin=Math.max(1,Math.min(6,v-1));
          else CFG[inp.dataset.cfgn]=Math.max(1,v);
          saveCfg(CFG);render();};
      }else if(inp.type==='checkbox'){
        inp.onchange=()=>{CFG[inp.dataset.cfg]=inp.checked;saveCfg(CFG);render();};
      }
    });
  }
}

      <tr><td style="color:var(--muted)">完成期限</td><td class="num">${dstr(ykDue(y))}</td></tr>
      <tr><td style="color:var(--muted)">验证方式</td><td>${esc(y.verify)}</td></tr>
      <tr><td style="color:var(--muted)">当前状态</td><td><b>${y.status}</b>${y.status==='已关闭'?'（关闭 '+dstr(y.closedAt)+' · '+esc(y.closedBy||'')+'）':''}</td></tr>
      </tbody></table>
      <div class="section-title" style="margin:16px 0 6px"><h3 style="font-size:14px">闭环资料（四件套 + 体系文件）</h3></div>
      <table><thead><tr><th>类型</th><th>文件名称</th><th>大小</th><th>上传人</th><th>上传时间</th><th class="c">查看</th></tr></thead><tbody>
        ${YKEV4.map(k=>{const e=y.ev&&y.ev[k];return `<tr><td><b>${k}</b></td><td>${e?esc(e.file):'<span style="color:var(--red)">未上传</span>'}</td><td class="num">${e?(Math.round(e.size/1024)+' KB'):'—'}</td><td>${e?esc(e.by||'—'):'—'}</td><td class="num">${e?dstr(e.at):'—'}</td><td class="c">${e?`<button class="btn sm" data-act="evdl" data-name="${esc(e.file)}">下载</button>`:'—'}</td></tr>`;}).join('')}
        <tr><td><b>修订体系文件</b></td><td>${y.sysFile?esc(y.sysFile.file)+'（'+y.sysFile.ver+'）':'<span style="color:var(--red)">未上传</span>'}</td><td class="num">${y.sysFile?(Math.round(y.sysFile.size/1024)+' KB'):'—'}</td><td>${y.sysFile?esc(y.sysFile.by||'—'):'—'}</td><td class="num">${y.sysFile?dstr(y.sysFile.at):'—'}</td><td class="c">${y.sysFile?`<button class="btn sm" data-act="evdl" data-name="${esc(y.sysFile.file)}">下载</button>`:'—'}</td></tr>
      </tbody></table>
      <div class="section-title" style="margin:16px 0 6px"><h3 style="font-size:14px">审核记录</h3></div>
      <table><thead><tr><th>环节</th><th>结论</th><th>说明</th><th class="c">时间</th></tr></thead><tbody>
        <tr><td>AI 审核</td><td>${a?(a.pass?'<span class="pill p-green"><span class="d"></span>通过</span>':'<span class="pill p-red"><span class="d"></span>不通过</span>'):'<span class="pill p-grey"><span class="d"></span>未送审</span>'}</td><td>${a?esc(a.reason):`佐证 ${n}/4 · 体系文件 ${y.sysFile?'已上传':'未上传'}`}</td><td class="num">${y.sentAt?dstr(y.sentAt):'—'}</td></tr>
        <tr><td>上级审核</td><td>${y.status==='已关闭'?'<span class="pill p-green"><span class="d"></span>已通过</span>':'<span class="pill p-grey"><span class="d"></span>待审核</span>'}</td><td>${y.status==='已关闭'?esc(y.closedBy||''):'AI 审核通过后由集团审核决定是否关闭'}</td><td class="num">${y.closedAt?dstr(y.closedAt):'—'}</td></tr>
      </tbody></table>
      <div style="margin-top:12px;font-size:12px;color:var(--muted);background:#f6faff;border:1px solid var(--line);border-radius:8px;padding:10px 12px">⚠ 关闭门禁：佐证四件套齐全 + 体系文件修订上传 + AI 审核通过 + 上级审核通过，四项缺一不可；AI 不自动关闭立项。</div></div>`);}return;}else if(act==='alerts')openAlerts();else if(act==='report')vReport();else if(act==='dimlist')openDimList(aEl.dataset.dimtype,aEl.dataset.dim);else if(act==='close')demoClose(aEl.dataset);else if(act==='sup')demoSup(aEl.dataset);else if(act==='ev')demoUp(aEl.dataset,aEl.dataset.k);
    else if(act==='abnmerge'){const sel=document.getElementById('abnMergeSel');const to=sel&&sel.value;const from=aEl.dataset.fp;
      if(to&&to!==from){const MG=abnMergeLoad();MG[from]=to;abnMergeSave(MG);abnLog('合并问题：'+from+' → '+to);toast('已合并为同一问题（人工校正已留痕）');ovStack.pop();abnDrill(aEl.dataset.code,aEl.dataset.meet,aEl.dataset.task);return;}}
    else if(act==='abnunmerge'){const fp=aEl.dataset.fp;const MG=abnMergeLoad();delete MG[fp];abnMergeSave(MG);abnLog('拆分问题：'+fp+' 还原为按事项统计');toast('已拆分，还原为按事项统计');ovStack.pop();abnDrill(aEl.dataset.code,aEl.dataset.meet,aEl.dataset.task);return;}
    else if(act==='evkb')kbEv(aEl.dataset.code,aEl.dataset.meet);
    else if(act==='evview')evView(aEl.dataset.code,aEl.dataset.meet,aEl.dataset.task,aEl.dataset.k);
    else if(act==='evdl')toast('已发起下载：'+aEl.dataset.name);}
});
document.getElementById('ovX').onclick=ovClose;
document.getElementById('ovBk').onclick=ovBack;
(function(){const ovEl=document.getElementById('overlay'),fsBtn=document.getElementById('ovFs');
  const sync=()=>{const on=!!document.fullscreenElement;fsBtn.innerHTML=on?'⛶ 退出全屏':'⛶ 全屏';fsBtn.classList.toggle('on',on);};
  fsBtn.onclick=()=>{try{if(document.fullscreenElement){document.exitFullscreen();}else if(ovEl.requestFullscreen){ovEl.requestFullscreen();}}catch(e){toast('当前浏览器不支持全屏，可按 F11');}};
  document.addEventListener('fullscreenchange',sync);sync();})();
document.addEventListener('change',e=>{if(e.target&&e.target.id==='impFile'){const f=e.target.files&&e.target.files[0];if(f)impReadFile(f);e.target.value='';}
 else if(e.target&&e.target.id==='hrxFile'){const f=e.target.files&&e.target.files[0];
   if(f){const nm=String(f.name||'').toLowerCase(),rd=new FileReader();
     if(nm.slice(-5)==='.xlsx'||nm.slice(-4)==='.xlsm'){rd.onload=async()=>{let b={ok:false,msg:'解析失败'};
       try{b=hrxApplyRows(await xlsxToRows(rd.result),'import');}catch(err){b={ok:false,msg:(err&&err.message)||'解析失败'};}
       toast(b.ok?('组织架构已生效：'+b.n+' 条记录'+(b.warn&&b.warn.length?'（'+b.warn.length+' 条提醒）':'')):('组织架构导入失败：'+b.msg));render();};
       rd.readAsArrayBuffer(f);}
     else{rd.onload=()=>{let text='';try{text=new TextDecoder('utf-8').decode(rd.result);}catch(err){}
       if(!text||text.indexOf('\uFFFD')>=0){try{text=new TextDecoder('gbk').decode(rd.result);}catch(err){}}
       const b=hrxApplyRows(csvParse(text),'import');
       toast(b.ok?('组织架构已生效：'+b.n+' 条记录'):('组织架构导入失败：'+b.msg));render();};rd.readAsArrayBuffer(f);}}
   e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')ovClose();});
window.addEventListener('hashchange',()=>{ovClose();route();render();});
/* ===================== 启动 ===================== */
(function boot(){
  const ui=loadUI();
  STATE.role=ui.role||'GM';STATE.ident=ui.ident||null;
  if(STATE.role==='D'&&STATE.ident&&STATE.ident.indexOf('::')<0)STATE.ident='HQ::制造课';
  const sc=document.getElementById('syncTxt');
  {const _m=impMeta(),_c=intCfg();sc.textContent='数据时间 '+dstr(NOW)+' '+pad2(NOW.getHours())+':00 · '+((_m&&_m.src==='api')?('接口同步 每 '+_c.min+' 分钟'):(_m?'人工导入/内置数据':'尚无数据'));}
  buildRoleCtl();
  if(!location.hash||location.hash==='#')location.hash=defaultHome();
  route();render();
  intStart();   /* 会议接口已配置 → 按间隔自动同步 */
hrxStart();   /* HR 组织架构接口已配置 → 按间隔自动同步 */
})();
</script>
