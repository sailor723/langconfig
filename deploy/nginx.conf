# One origin for the browser: the app at /, each workbench under /workbench/<key>/.
#
# Why proxy instead of exposing ports: an iframe whose src is `http://127.0.0.1:8098` points at the
# VIEWER's machine, not the server — the page loads blank for everyone but the box itself. Proxying
# keeps every URL same-origin, so the framed workbench (and its relative /api calls) work anywhere.
upstream app { server app:8765; }
upstream wb_logistics { server workbench-logistics:8098; }
upstream wb_clinic { server workbench-clinic:8096; }

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # SSE (chat streams) must not be buffered
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location /workbench/logistics/ {
        proxy_pass http://wb_logistics/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /workbench/logistics;
    }
    location /workbench/clinic/ {
        proxy_pass http://wb_clinic/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /workbench/clinic;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
