<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售业务仪表板 · 2024–2025</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --green:#10b981; --amber:#f59e0b; --red:#ef4444; --violet:#7c3aed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"-apple-system","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  header{padding:22px 28px 6px}
  header h1{margin:0;font-size:22px;letter-spacing:.2px}
  header p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .wrap{padding:0 28px 32px;max-width:1560px;margin:0 auto}
  .controls{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.94);
            backdrop-filter:blur(8px);padding:14px 0 12px;margin-bottom:6px;
            border-bottom:1px solid var(--line)}
  .filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  select{appearance:none;background:#fff;border:1px solid var(--line);border-radius:8px;
         padding:7px 26px 7px 10px;font-size:13px;color:var(--ink);min-width:126px;cursor:pointer;
         background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2364748b'/></svg>");
         background-repeat:no-repeat;background-position:right 9px center}
  select:focus{outline:2px solid rgba(37,99,235,.25);border-color:var(--blue)}
  button.reset{margin-left:auto;border:1px solid var(--blue);background:var(--blue);color:#fff;
               border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
  button.reset:hover{background:#1d4ed8}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin:16px 0 20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
       box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .kpi .k{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.4px}
  .kpi .v{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .s b{color:var(--ink)}
  .up{color:var(--green)} .down{color:var(--red)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 8px;
        box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .card h2{margin:0 0 2px;font-size:14.5px;font-weight:700}
  .card h2 span{font-weight:500;color:var(--muted);font-size:12px}
  .chart{width:100%;height:340px}
  .wide{grid-column:1 / -1}
  .insights{margin-top:18px;padding-bottom:18px}
  #insightList{margin:10px 0 0;padding-left:20px}
  #insightList li{margin:7px 0;font-size:13.5px;line-height:1.62;color:#1e293b}
  #insightList li b{color:#0b3fa8}
  .note{color:var(--muted);font-size:12px;margin-top:10px}
  @media (max-width:980px){.charts{grid-template-columns:1fr}header,.wrap{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
  <h1>销售业务仪表板 · 2024-Q1 – 2025-Q4</h1>
  <p>数据源 sales_2024_2025.db · 5,999 笔订单 · 1,903 位客户 · 收入 $25.1M / 毛利 $9.8M</p>
</header>
<div class="wrap">

  <section class="controls">
    <div class="filters">
      <div class="fld"><label for="f_year">年份</label><select id="f_year" data-key="year"></select></div>
      <div class="fld"><label for="f_reg">区域</label><select id="f_reg" data-key="reg"></select></div>
      <div class="fld"><label for="f_cat">品类</label><select id="f_cat" data-key="cat"></select></div>
      <div class="fld"><label for="f_prod">产品</label><select id="f_prod" data-key="prod"></select></div>
      <div class="fld"><label for="f_seg">客户细分</label><select id="f_seg" data-key="seg"></select></div>
      <div class="fld"><label for="f_ch">渠道</label><select id="f_ch" data-key="ch"></select></div>
      <div class="fld"><label for="f_pm">支付方式</label><select id="f_pm" data-key="pm"></select></div>
      <div class="fld"><label for="f_rep">销售代表</label><select id="f_rep" data-key="rep"></select></div>
      <div class="fld"><label for="f_st">订单状态</label><select id="f_st" data-key="st"></select></div>
      <button class="reset" id="resetBtn">重置筛选</button>
    </div>
  </section>

  <section class="kpis" id="kpiRow"></section>

  <section class="charts">
    <div class="card wide">
      <h2>Q1 · 收入与毛利是否在健康增长？ <span>月度收入 / 毛利润 / 毛利率</span></h2>
      <div id="chartTrend" class="chart"></div>
    </div>
    <div class="card">
      <h2>Q2 · 哪个品类在赚钱，哪个只在堆收入？ <span>品类收入 + 毛利率</span></h2>
      <div id="chartMix" class="chart"></div>
    </div>
    <div class="card">
      <h2>Q3 · 折扣是否在侵蚀利润？ <span>折扣档位 → 收入与毛利率</span></h2>
      <div id="chartDisc" class="chart"></div>
    </div>
  </section>

  <section class="card insights">
    <h2>关键洞察 <span>随筛选条件动态更新</span></h2>
    <ul id="insightList"></ul>
    <div class="note">口径：收入 = 折后金额（含退款订单）；毛利 = 收入 − 成本；毛利率 = 毛利 / 收入。退款订单仍计入收入，退款率单列监控。</div>
  </section>

</div>

<script>
const RAW = __DATA__;
const OPTS = __OPTS__;
const YEARS = __YEARS__;

RAW.forEach(r => { r.year = r.d.slice(0,4); });

const ALL = "全部";
const FIELDS = [
  ["year", YEARS], ["reg", OPTS.reg], ["cat", OPTS.cat], ["prod", OPTS.prod],
  ["seg", OPTS.seg], ["ch", OPTS.ch], ["pm", OPTS.pm], ["rep", OPTS.rep], ["st", OPTS.st]
];

/* ---------- helpers ---------- */
const money = v => {
  const s = v < 0 ? "-" : "";
  v = Math.abs(v);
  if (v >= 1e6) return s + "$" + (v/1e6).toFixed(1) + "M";
  return s + "$" + Math.round(v).toLocaleString("en-US");
};
const num = v => v.toLocaleString("en-US");
const pct = v => (isFinite(v) ? v.toFixed(1) : "0.0") + "%";
const pp  = v => (v >= 0 ? "+" : "") + v.toFixed(1) + "pp";
const rel = (a,b) => b === 0 ? "—" : ((a-b)/Math.abs(b)*100 >= 0 ? "+" : "") + ((a-b)/Math.abs(b)*100).toFixed(1) + "%";
const cls = (a,b) => (a - b) >= 0 ? "up" : "down";

/* ---------- build filter selects ---------- */
FIELDS.forEach(([key, vals]) => {
  const sel = document.querySelector('select[data-key="' + key + '"]');
  sel.innerHTML = ['<option value="' + ALL + '">' + ALL + '</option>']
    .concat(vals.map(v => '<option value="' + v + '">' + v + '</option>')).join("");
  sel.addEventListener("change", render);
});
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".controls select").forEach(s => s.value = ALL);
  render();
});

function currentFilters() {
  const f = {};
  document.querySelectorAll(".controls select").forEach(s => { f[s.dataset.key] = s.value; });
  return f;
}

/* ---------- aggregation ---------- */
function aggregate(rows) {
  const a = {rev:0, pft:0, n:0, gross:0, grossDisc:0, discW:0, refunds:0, refundRev:0,
             cust:new Set(), qty:0, trend:new Map(), cat:new Map(), disc:new Map(),
             reg:new Map(), ch:new Map(), seg:new Map(), year:new Map()};
  const bump = (m, k, r) => {
    let o = m.get(k);
    if (!o) { o = {rev:0, pft:0, n:0, refunds:0, refundRev:0}; m.set(k, o); }
    o.rev += r.rev; o.pft += r.pft; o.n += 1;
    if (r.st === "refunded") { o.refunds += 1; o.refundRev += r.rev; }
  };
  rows.forEach(r => {
    a.rev += r.rev; a.pft += r.pft; a.n += 1; a.qty += r.qty;
    a.gross += r.gross; a.cust.add(r.cid);
    a.discW += r.gross * r.disc; a.grossDisc += r.gross;
    if (r.st === "refunded") { a.refunds += 1; a.refundRev += r.rev; }
    bump(a.trend, r.d.slice(0,7), r);
    bump(a.cat, r.cat, r);
    bump(a.disc, r.disc, r);
    bump(a.reg, r.reg, r);
    bump(a.ch, r.ch, r);
    bump(a.seg, r.seg, r);
    bump(a.year, r.year, r);
  });
  a.margin = a.rev ? 100*a.pft/a.rev : 0;
  a.aov = a.n ? a.rev/a.n : 0;
  a.refundRate = a.n ? 100*a.refunds/a.n : 0;
  a.avgDisc = a.grossDisc ? a.discW/a.grossDisc : 0;
  return a;
}
const sortByRev = m => [...m.entries()].map(([k,v]) => ({k, ...v}))
  .sort((x,y) => y.rev - x.rev);

/* ---------- KPI cards ---------- */
const FULL = aggregate(RAW);

function kpiCards(a) {
  const mDelta = a.margin - FULL.margin;
  const cards = [
    {k:"总收入", v:money(a.rev), s:"占全量 " + pct(100*a.rev/(FULL.rev||1))},
    {k:"毛利润", v:money(a.pft), s:"占全量 " + pct(100*a.pft/(FULL.pft||1))},
    {k:"毛利率", v:pct(a.margin), s:"全量 " + pct(FULL.margin) + " · <b class='" + cls(a.margin,FULL.margin) + "'>" + pp(mDelta) + "</b>"},
    {k:"订单数", v:num(a.n), s:a.cust.size + " 位客户"},
    {k:"客单价 (AOV)", v:money(a.aov), s:"平均 " + (a.n ? (a.qty/a.n).toFixed(1) : "0.0") + " 件/单"},
    {k:"退款率", v:pct(a.refundRate), s:a.refunds + " 单退款 · " + money(a.refundRev)},
    {k:"平均折扣", v:pct(a.avgDisc), s:"折让 " + money(a.gross - a.rev)}
  ];
  document.getElementById("kpiRow").innerHTML = cards.map(c =>
    '<div class="kpi"><div class="k">' + c.k + '</div><div class="v">' + c.v +
    '</div><div class="s">' + c.s + '</div></div>').join("");
}

/* ---------- charts ---------- */
const LAYOUT = {
  template:"plotly_white",
  margin:{l:62, r:62, t:12, b:44},
  font:{family:'-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif', size:11.5, color:"#475569"},
  legend:{orientation:"h", x:0, y:1.12, font:{size:11}},
  paper_bgcolor:"rgba(0,0,0,0)", plot_bgcolor:"rgba(0,0,0,0)",
  xaxis:{gridcolor:"#eef2f7", zeroline:false},
  yaxis:{gridcolor:"#eef2f7", zeroline:false, title:{text:"金额 (USD)", font:{size:11}}},
  yaxis2:{overlaying:"y", side:"right", range:[0,100], showgrid:false, ticksuffix:"%",
          title:{text:"毛利率", font:{size:11}}},
  hoverlabel:{font:{size:12}}
};
const CONFIG = {displayModeBar:false, responsive:true};
function draw(id, traces) {
  Plotly.react(id, traces, LAYOUT, CONFIG);
}

function render() {
  const f = currentFilters();
  const rows = RAW.filter(r => FIELDS.every(([key]) => f[key] === ALL || r[key] === f[key]));
  const a = aggregate(rows);
  kpiCards(a);

  /* 图1：月度趋势 */
  const trend = [...a.trend.entries()].sort((x,y) => x[0].localeCompare(y[0]))
    .map(([k,v]) => ({m:k, ...v, margin: v.rev ? 100*v.pft/v.rev : 0}));
  draw("chartTrend", [
    {type:"bar", name:"收入", x:trend.map(t=>t.m), y:trend.map(t=>t.rev),
     marker:{color:"#2563eb"}, hovertemplate:"%{x}<br>收入 $%{y:,.0f}<extra></extra>"},
    {type:"bar", name:"毛利润", x:trend.map(t=>t.m), y:trend.map(t=>t.pft),
     marker:{color:"#10b981"}, hovertemplate:"%{x}<br>毛利 $%{y:,.0f}<extra></extra>"},
    {type:"scatter", mode:"lines+markers", name:"毛利率", x:trend.map(t=>t.m), y:trend.map(t=>t.margin),
     yaxis:"y2", line:{color:"#f59e0b", width:2.4}, marker:{size:5},
     hovertemplate:"%{x}<br>毛利率 %{y:.1f}%<extra></extra>"}
  ]);

  /* 图2：品类结构 */
  const cat = sortByRev(a.cat);
  draw("chartMix", [
    {type:"bar", name:"收入", x:cat.map(c=>c.k), y:cat.map(c=>c.rev),
     marker:{color:"#7c3aed"}, hovertemplate:"%{x}<br>收入 $%{y:,.0f}<extra></extra>"},
    {type:"bar", name:"毛利润", x:cat.map(c=>c.k), y:cat.map(c=>c.pft),
     marker:{color:"#10b981"}, hovertemplate:"%{x}<br>毛利 $%{y:,.0f}<extra></extra>"},
    {type:"scatter", mode:"lines+markers+text", name:"毛利率", x:cat.map(c=>c.k),
     y:cat.map(c => c.rev ? 100*c.pft/c.rev : 0), yaxis:"y2",
     text:cat.map(c => (c.rev ? 100*c.pft/c.rev : 0).toFixed(0) + "%"),
     textposition:"top center", textfont:{size:10.5, color:"#b45309"},
     line:{color:"#f59e0b", width:2.2}, marker:{size:6},
     hovertemplate:"%{x}<br>毛利率 %{y:.1f}%<extra></extra>"}
  ]);

  /* 图3：折扣影响 */
  const disc = [...a.disc.entries()].sort((x,y) => x[0]-y[0])
    .map(([k,v]) => ({d:k, ...v, margin: v.rev ? 100*v.pft/v.rev : 0}));
  draw("chartDisc", [
    {type:"bar", name:"收入", x:disc.map(d => d.d === 0 ? "无折扣" : d.d.toFixed(0) + "%"),
     y:disc.map(d=>d.rev), marker:{color:"#0ea5e9"},
     hovertemplate:"折扣 %{x}<br>收入 $%{y:,.0f}<extra></extra>"},
    {type:"scatter", mode:"lines+markers", name:"毛利率",
     x:disc.map(d => d.d === 0 ? "无折扣" : d.d.toFixed(0) + "%"),
     y:disc.map(d=>d.margin), yaxis:"y2",
     line:{color:"#ef4444", width:2.4}, marker:{size:7},
     hovertemplate:"折扣 %{x}<br>毛利率 %{y:.1f}%<extra></extra>"}
  ]);

  buildInsights(a);
}

/* ---------- insights ---------- */
function buildInsights(a) {
  const out = [];
  if (!a.n) {
    document.getElementById("insightList").innerHTML = "<li>当前筛选组合没有订单，请调整筛选条件或点击「重置筛选」。</li>";
    return;
  }
  out.push("<b>规模：</b>" + num(a.n) + " 笔订单 / " + num(a.cust.size) + " 位客户，收入 " + money(a.rev) +
           "，毛利 " + money(a.pft) + "，毛利率 <b>" + pct(a.margin) + "</b>，客单价 " + money(a.aov) + "。");

  const yrs = sortByRev(a.year).sort((x,y) => x.k.localeCompare(y.k));
  if (yrs.length === 2) {
    const x = yrs[0], y = yrs[1];
    const mx = x.rev ? 100*x.pft/x.rev : 0, my = y.rev ? 100*y.pft/y.rev : 0;
    out.push("<b>增长：</b>" + x.k + " → " + y.k + " 收入 " + money(x.rev) + " → " + money(y.rev) +
             "（" + rel(y.rev, x.rev) + "），毛利率 " + pct(mx) + " → " + pct(my) + "（" + pp(my-mx) +
             "），订单 " + num(x.n) + " → " + num(y.n) + "（" + rel(y.n, x.n) + "）。");
  } else {
    const trend = [...a.trend.entries()].sort((p,q) => p[0].localeCompare(q[0]))
      .map(([k,v]) => ({m:k, rev:v.rev}));
    if (trend.length > 2) {
      const top = trend.reduce((p,q) => q.rev > p.rev ? q : p);
      const last = trend[trend.length-1], prev = trend[trend.length-2];
      out.push("<b>节奏：</b>峰值月份 " + top.m + "（收入 " + money(top.rev) + "），最近一月 " +
               last.m + " 收入 " + money(last.rev) + "，环比 " + rel(last.rev, prev.rev) + "。");
    }
  }

  const cat = sortByRev(a.cat);
  if (cat.length >= 2) {
    const top = cat[0];
    const share = 100*top.rev/a.rev;
    const best = cat.filter(c => c.rev/a.rev > 0.03)
                    .map(c => ({...c, m:c.rev ? 100*c.pft/c.rev : 0}))
                    .sort((p,q) => q.m - p.m)[0];
    const topM = top.rev ? 100*top.pft/top.rev : 0;
    let s = "<b>品类结构：</b>最大收入品类 " + top.k + " 贡献 " + pct(share) + " 收入，但毛利率仅 " + pct(topM) + "；";
    if (best && best.k !== top.k)
      s += "而 " + best.k + " 毛利率高达 <b>" + pct(best.m) + "</b>（收入占比 " + pct(100*best.rev/a.rev) +
           "），提升其占比是最快的毛利杠杆。";
    else s += "整体毛利率主要由 " + top.k + " 决定。";
    out.push(s);
  }

  const disc = [...a.disc.entries()].sort((p,q) => p[0]-q[0]);
  if (disc.length >= 2) {
    const zero = disc.filter(d => d[0] === 0).reduce((s,d) => ({rev:s.rev+d[1].rev, pft:s.pft+d[1].pft}), {rev:0,pft:0});
    const prom = disc.filter(d => d[0] > 0).reduce((s,d) => ({rev:s.rev+d[1].rev, pft:s.pft+d[1].pft}), {rev:0,pft:0});
    const deep = disc.filter(d => d[0] >= 20).reduce((s,d) => ({rev:s.rev+d[1].rev}), {rev:0});
    const m0 = zero.rev ? 100*zero.pft/zero.rev : 0;
    const mp = prom.rev ? 100*prom.pft/prom.rev : 0;
    out.push("<b>折扣代价：</b>无折扣订单毛利率 " + pct(m0) + "，有折扣订单仅 " + pct(mp) +
             "（" + pp(mp-m0) + "）；折扣 ≥20% 的订单占收入 " + pct(100*deep.rev/(a.rev||1)) +
             "，累计折让 " + money(a.gross - a.rev) + "，占标价 " + pct(a.avgDisc) + "。");
  }

  const reg = sortByRev(a.reg);
  if (reg.length >= 2) {
    const worstRef = [...reg].sort((p,q) => (100*q.refunds/q.n) - (100*p.refunds/p.n))[0];
    const bestM = [...reg].map(r => ({...r, m:r.rev ? 100*r.pft/r.rev : 0})).sort((p,q) => q.m - p.m)[0];
    out.push("<b>区域：</b>" + reg[0].k + " 收入 " + money(reg[0].rev) + "（占 " + pct(100*reg[0].rev/a.rev) +
             "）；毛利率最高为 " + bestM.k + " " + pct(bestM.m) + "；退款率最高为 " + worstRef.k + " " +
             pct(100*worstRef.refunds/worstRef.n) + "（整体 " + pct(a.refundRate) + "）。");
  }

  const ch = sortByRev(a.ch);
  if (ch.length >= 2) {
    out.push("<b>渠道与细分：</b>" + ch[0].k + " 是主渠道（收入 " + money(ch[0].rev) + "，占 " +
             pct(100*ch[0].rev/a.rev) + "），客单价 " + money(ch[0].rev/ch[0].n) + "；退款订单 " +
             num(a.refunds) + " 笔、涉及收入 " + money(a.refundRev) + "，占收入 " +
             pct(100*a.refundRev/(a.rev||1)) + "，需按品类排查质量与预期偏差。");
  }

  document.getElementById("insightList").innerHTML = out.map(t => "<li>" + t + "</li>").join("");
}

/* ---------- boot ---------- */
document.querySelectorAll(".controls select").forEach(s => s.value = ALL);
render();
window.addEventListener("resize", () => {
  ["chartTrend","chartMix","chartDisc"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.data) Plotly.Plots.resize(el);
  });
});
</script>
</body>
</html>
