[project]
name = "langconfig-backend"
version = "0.1.0"
description = "LangConfig - Open-source visual platform for building, testing, and deploying LangChain agents and LangGraph workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.1",
    "python-multipart",
    # Database
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # LangChain v1.0 + LangGraph
    "langchain>=1.2.7",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.0.1",
    "langchain-anthropic>=1.2.0",
    "langchain-google-genai>=4.1.2",
    "langchain-community==0.4.1",
    "langchain-postgres",
    "langgraph>=1.0.7",
    "langgraph-checkpoint-postgres",
    "langgraph-supervisor",
    "langgraph-swarm",
    "langgraph-bigtool",
    "tiktoken>=0.5.0",
    "langchain-text-splitters",
    # LlamaIndex + Vector Stores
    "llama-index",
    "llama-index-vector-stores-postgres",
    "llama-index-embeddings-ollama",
    "llama-index-embeddings-openai",
    "pgvector",
    "numpy",
    # Document Processing
    "unstructured>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    # MCP Protocol Support
    "fastapi-mcp>=0.1.0",
    # DeepAgents
    "deepagents>=0.2.4",
    # Real-time Monitoring
    "sse-starlette>=2.1.3",
    # Browser Automation
    "playwright>=1.48.0",
    # Security & Utilities
    "cryptography",
    "python-dotenv==1.0.1",
    "httpx>=0.28.1",
    "aiofiles==24.1.0",
    "python-json-logger",
    "deepdiff>=7.0.0",
    # Scheduling
    "croniter>=2.0.0",
    "pytz>=2024.1",
    # File System Monitoring
    "watchdog>=4.0.0",
    # Presentation Generation
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.0.0",
    "python-pptx>=0.6.21",
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "asyncpg",
    "tavily-python>=0.7.25",
    "langchain-deepseek>=1.1.0",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = []
