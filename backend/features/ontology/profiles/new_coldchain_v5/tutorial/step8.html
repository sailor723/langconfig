<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 8 步 —— 看板与红线</title>
<style>
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
         background:#f6f7f9; margin:0; color:#1c1e21; font-size:13px; }
  main { max-width:1080px; margin:16px auto 40px; padding:0 20px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .lede { color:#52616f; line-height:1.75; margin:6px 0 14px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cols3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:900px) { .cols, .cols3 { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid #e3e6ea; border-radius:10px; padding:14px 16px; }
  .card.click { cursor:pointer; }
  .card.on { border-color:#0f3d2e; box-shadow:0 0 0 1px #0f3d2e inset; }
  h2 { margin:0 0 10px; font-size:11.5px; letter-spacing:.4px; color:#334e68; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:10.5px; text-transform:uppercase; color:#687b8f; padding:5px 7px;
       border-bottom:1px solid #e3e6ea; font-weight:600; }
  td { padding:5px 7px; border-bottom:1px solid #f0f3f6; vertical-align:top; line-height:1.6; }
  code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  pre { background:#0f172a; color:#dbe7f3; border-radius:8px; padding:10px 12px; font-size:10.5px;
        line-height:1.55; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; margin:8px 0 0; }
  .big { font-size:26px; font-weight:700; color:#0f3d2e; line-height:1.15; }
  .muted { color:#687b8f; font-size:11.5px; line-height:1.65; }
  .pill { display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:999px;
          border:1px solid #cfd8e0; color:#52616f; margin-left:6px; }
  .pill.red { border-color:#e0a9a2; color:#8c2f24; background:#fdf3f2; }
  .ask { display:flex; gap:6px; margin-top:10px; }
  input[type=text] { flex:1; padding:6px 9px; border:1px solid #cfd8e0; border-radius:7px; font:inherit; }
  button { padding:6px 12px; border-radius:7px; border:1px solid #0f3d2e; background:#0f3d2e; color:#fff;
           font:inherit; cursor:pointer; }
  .ans { margin-top:10px; padding:10px 12px; border-radius:8px; background:#f2f7f4; border:1px solid #cfe3d7;
         line-height:1.7; font-size:12.5px; display:none; }
  .ans.bad { background:#fdf3f2; border-color:#f0c7c2; }
  ul { margin:6px 0 0; padding-left:19px; line-height:1.85; }

</style>
</head>
<body>
<main>
  <h1>第 8 步 —— 看板与红线</h1>
  <p class="lede">看板上的每个数都来自已声明指标；红线（阈值）是<strong>业务决定</strong>，没确权的必须标成 assumed。
这一页读的正是看板自己的声明，包括「答不了什么」。</p>
  <div class="card">
    <h2>红线（阈值声明）</h2>
    <table id="policy"><thead><tr><th>指标</th><th>红线</th><th>当前</th><th>判定</th><th>来源</th></tr></thead><tbody></tbody></table>
    <p class="muted">标了 <code>assumed</code> 的阈值不是业务确认过的：它只用于着色，不作 KPI 判定。</p>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>这张板答不了什么</h2>
    <table id="see"><tbody></tbody></table>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>看板本身</h2>
    <p class="muted">六个家族各一张主图 + 一组卡。打开看板：左侧本体列表里点这个本体就会落到看板页。</p>
  </div>
</main>
<script>
const KEY = location.pathname.split('/')[3];
const api = (p) => `${location.origin}/api/ontology/${KEY}${p}`;
const fmt = (v) => (v === null || v === undefined) ? '—'
  : (typeof v === 'number' ? v.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : String(v));
const pct = (v) => (v === null || v === undefined) ? '—' : `${Number(v).toFixed(2)}%`;
async function j(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || body.error || `HTTP ${r.status}`);
  return body;
}
function askSetup() {
  const go = document.getElementById('go');
  if (!go) return;
  go.addEventListener('click', async () => {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    const box = document.getElementById('ans');
    box.style.display = 'block'; box.className = 'ans'; box.textContent = '正在问…';
    try {
      const r = await j(api('/ask'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ question: q, polish: false }) });
      if (r.refused || r.ok === false) {
        box.className = 'ans bad';
        box.innerHTML = `<b>按名拒绝：</b>${r.refused || r.answer || ''}`;
        return;
      }
      box.innerHTML = `<b>${fmt(Number(r.value))}</b>${r.unit ? ' ' + r.unit : ''}
        ${r.metric ? `<span class="pill">${r.metric}</span>` : ''}
        ${r.sql ? `<pre>${r.sql}</pre>` : ''}`;
    } catch (e) {
      box.className = 'ans bad';
      box.textContent = '问不出来：' + String(e.message || e);
    }
  });
}
</script>
<script>
(async () => {
  const pan = await j(api('/dashboard/panels'));
  const pol = (pan.briefing || {}).policy || [];
  document.querySelector('#policy tbody').innerHTML = pol.map(p => {
    const declared = p.value_declared !== undefined && p.value_declared !== p.value
      ? `（声明 ${p.value_declared} → ${Number(p.value).toFixed(0)}）` : '';
    return `<tr><td><code>${p.id}</code></td>
      <td>${p.op} ${fmt(p.value)}${declared}</td>
      <td>${p.current_text ?? fmt(p.current)}</td>
      <td>${p.breached ? '<span class="pill red">红线命中</span>' : '<span class="pill">正常</span>'}</td>
      <td class="muted">${p.assumed ? 'assumed（未确权）' : (p.confirmed ? 'confirmed' : '—')}</td></tr>`;
  }).join('') || '<tr><td colspan="5" class="muted">这个本体没有声明阈值</td></tr>';
  const see = (pan.briefing || {}).cannot_see || [];
  document.querySelector('#see tbody').innerHTML = see
    .map(t => `<tr><td class="muted">${t}</td></tr>`).join('') || '<tr><td class="muted">没有声明</td></tr>';
})().catch(e => { document.getElementById('policy').innerHTML = '<tbody><tr><td class="muted">读取失败：' + e.message + '</td></tr></tbody>'; });
</script>
</body>
</html>
