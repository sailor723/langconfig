<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第 1 步 —— 一趟就是一个对象</title>
<style>
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
         background:#f6f7f9; margin:0; color:#1c1e21; font-size:13px; }
  main { max-width:1080px; margin:16px auto 40px; padding:0 20px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .lede { color:#52616f; line-height:1.75; margin:6px 0 14px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid #e3e6ea; border-radius:10px; padding:14px 16px; }
  h2 { margin:0 0 10px; font-size:11.5px; letter-spacing:.4px; color:#334e68; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:10.5px; text-transform:uppercase; color:#687b8f; padding:5px 7px;
       border-bottom:1px solid #e3e6ea; font-weight:600; }
  td { padding:5px 7px; border-bottom:1px solid #f0f3f6; vertical-align:top; }
  code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .kv { display:flex; gap:8px; align-items:baseline; margin:3px 0; }
  .kv .k { color:#687b8f; font-size:11px; min-width:72px; }
  .num { font-size:22px; font-weight:700; color:#0f3d2e; }
  pre { background:#0f172a; color:#dbe7f3; border-radius:8px; padding:10px 12px; font-size:10.5px;
        line-height:1.55; white-space:pre-wrap; word-break:break-word; max-height:210px; overflow:auto; margin:8px 0 0; }
  .pill { display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:999px;
          border:1px solid #cfd8e0; color:#52616f; margin-left:6px; }
  .ask { display:flex; gap:6px; margin-top:10px; }
  input[type=text] { flex:1; padding:6px 9px; border:1px solid #cfd8e0; border-radius:7px; font:inherit; }
  button { padding:6px 12px; border-radius:7px; border:1px solid #0f3d2e; background:#0f3d2e; color:#fff;
           font:inherit; cursor:pointer; }
  .ans { margin-top:10px; padding:10px 12px; border-radius:8px; background:#f2f7f4; border:1px solid #cfe3d7;
         line-height:1.7; font-size:12.5px; display:none; }
  .ans.bad { background:#fdf3f2; border-color:#f0c7c2; }
  .muted { color:#687b8f; font-size:11.5px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>第 1 步 —— 一趟就是一个对象</h1>
  <p class="lede">
    库里最大的一张事实表是 <code>trips</code>：每一行是一次配送任务。本体把它声明成一个对象
    <code>:Trip</code>——有主键、有属性、可以被别的对象引用。下面这张卡是从声明里读出来的，不是手写的。
  </p>

  <div class="cols">
    <div class="card">
      <h2>这个对象：<span id="objname">…</span></h2>
      <div class="kv"><span class="k">存储于</span><span><code id="objtable">…</code><span class="pill" id="objrows"></span></span></div>
      <div class="kv"><span class="k">主键</span><code id="objpk">…</code></div>
      <div class="kv"><span class="k">属性数</span><span id="objcols">…</span></div>
      <table id="cols"><thead><tr><th>列</th><th>类型</th><th>含义</th></tr></thead><tbody></tbody></table>
      <p class="muted" id="colnote" style="margin-top:10px"></p>
    </div>

    <div>
      <div class="card">
        <h2>这些行是对象，不只是行</h2>
        <div class="kv"><span class="k">趟次</span><span class="num" id="tripCount">…</span></div>
        <div class="kv"><span class="k">站次</span><span class="num" id="stopCount">…</span>
          <span class="muted">（一趟带多个站——第 2 步就卡在这里）</span></div>
        <div class="kv"><span class="k">平均站数</span><span class="num" id="stopsPerTrip">…</span></div>
        <pre id="sql">…</pre>
        <p class="muted">上面三段数字都用 <code>/tutorial/run</code> 现跑，SQL 是编译出来的。</p>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>自己问一句</h2>
        <p class="muted">问的是这个本体声明的指标；答不出来会说出缺哪条声明。</p>
        <div class="ask">
          <input type="text" id="q" value="一共多少趟">
          <button id="go">提问</button>
        </div>
        <div class="ans" id="ans"></div>
      </div>
    </div>
  </div>
</main>
<script>
const KEY = location.pathname.split('/')[3];
const api = (p) => `${location.origin}/api/ontology/${KEY}${p}`;
const fmt = (v) => (v === null || v === undefined) ? '—'
  : (typeof v === 'number' ? v.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : String(v));

async function j(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || body.error || `HTTP ${r.status}`);
  return body;
}

(async () => {
  const doc = await j(api('/document'));
  const trip = (doc.objects || []).find(o => o.name === 'Trip') || (doc.objects || [])[0];
  document.getElementById('objname').textContent = ':' + trip.name;
  document.getElementById('objtable').textContent = trip.table || '—';
  document.getElementById('objpk').textContent = trip.primaryKey || 'id';
  const cols = trip.columns || [];
  document.getElementById('objcols').textContent = cols.length + ' 列';
  document.getElementById('colnote').textContent =
    (trip.comment || trip.businessDescription || '').slice(0, 220);
  const tb = document.querySelector('#cols tbody');
  tb.innerHTML = cols.slice(0, 12).map(c =>
    `<tr><td><code>${c.name ?? c.column ?? ''}</code></td><td>${c.type ?? c.datatype ?? ''}</td>
         <td>${(c.businessDescription || c.comment || c.label || '').slice(0, 60)}</td></tr>`).join('');
  if (cols.length > 12) {
    tb.insertAdjacentHTML('beforeend',
      `<tr><td colspan="3" class="muted">…还有 ${cols.length - 12} 列，浏览器里「对象」页可看全</td></tr>`);
  }

  for (const [id, metric] of [['tripCount', 'tripCount'], ['stopCount', 'stopCount'], ['stopsPerTrip', 'stopsPerTrip']]) {
    try {
      const r = await j(api('/tutorial/run?metric=' + metric));
      document.getElementById(id).textContent = fmt(r.grouped ? (r.row_count + ' 组') : Number(r.value));
      if (metric === 'tripCount') document.getElementById('sql').textContent = r.sql || '';
    } catch (e) {
      document.getElementById(id).textContent = '—';
    }
  }
})().catch(e => {
  document.getElementById('objname').textContent = '读取失败';
  document.getElementById('colnote').textContent = String(e.message || e);
});

document.getElementById('go').addEventListener('click', async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const box = document.getElementById('ans');
  box.style.display = 'block';
  box.className = 'ans';
  box.textContent = '正在问…';
  try {
    const r = await j(api('/ask'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, polish: false }),
    });
    if (r.refused || r.ok === false) {
      box.className = 'ans bad';
      box.innerHTML = `<b>按名拒绝：</b>${r.refused || r.answer || ''}`;
      return;
    }
    const value = r.value === null || r.value === undefined ? '' : `<b>${fmt(Number(r.value))}</b>`;
    box.innerHTML = `${value}${r.unit ? ' ' + r.unit : ''}
      ${r.metric ? `<span class="pill">${r.metric}</span>` : ''}
      ${r.answer ? `<div class="muted" style="margin-top:6px">${r.answer}</div>` : ''}
      ${r.sql ? `<pre>${r.sql}</pre>` : ''}`;
  } catch (e) {
    box.className = 'ans bad';
    box.textContent = '问不出来：' + String(e.message || e);
  }
});
</script>
</body>
</html>
