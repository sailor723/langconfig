<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冷链配送本体 · 八步教程</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
         background:#f6f7f9; color:#1c1e21; font-size:13px; }
  header { background:#0f3d2e; color:#fff; padding:10px 18px; display:flex; align-items:baseline; gap:12px; flex:none; }
  header h1 { margin:0; font-size:15px; font-weight:700; }
  header .sub { color:#a7cbb8; font-size:12px; }
  header .rev { margin-left:auto; color:#8fb9a3; font-size:11px; }
  .row { flex:1; min-height:0; display:flex; }
  .steps { width:252px; flex:none; border-right:1px solid #e3e6ea; background:#fff; overflow-y:auto; padding:6px; }
  .steps h2 { margin:6px 8px 10px; font-size:10.5px; letter-spacing:.08em; color:#687b8f; text-transform:uppercase; }
  .stepbtn { display:block; width:100%; text-align:left; background:#fbfcfd; border:1px solid #e4e8ec;
             border-radius:8px; padding:7px 9px; margin-bottom:6px; cursor:pointer; font:inherit; color:#1c1e21; }
  .stepbtn:hover { background:#f2f5f8; }
  .stepbtn.on { border-color:#0f3d2e; box-shadow:0 0 0 1px #0f3d2e inset; background:#eef5f1; }
  .stepbtn .n { display:inline-block; width:18px; height:18px; border-radius:50%; background:#e7ecef;
                color:#334e68; font-size:11px; line-height:18px; text-align:center; margin-right:6px; }
  .stepbtn.on .n { background:#0f3d2e; color:#fff; }
  .stepbtn .t { font-weight:600; }
  .stepbtn .d { display:block; color:#687b8f; font-size:11px; margin-top:2px; line-height:1.45; }
  .hint { margin:10px 8px; font-size:11px; color:#687b8f; line-height:1.6; }
  .splitter { width:5px; flex:none; cursor:col-resize; background:linear-gradient(#e9edf1,#dfe4e9); }
  .main { flex:1; min-width:0; display:flex; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  .graphpanel { width:330px; flex:none; border-left:1px solid #e3e6ea; background:#fff; display:flex; flex-direction:column; }
  #mini-graph { flex:1; min-height:0; }
  .graph-caption { padding:6px 10px; font-size:11px; color:#334e68; border-top:1px solid #eef1f4; }
  .note { padding:8px 10px; font-size:10.5px; color:#687b8f; line-height:1.6; border-top:1px solid #eef1f4; }
</style>
</head>
<body>
<header>
  <h1>▸ 冷链配送本体 · 八步教程</h1>
  <span class="sub">同一份库，语义逐层增加；右侧那一页始终可以操作。</span>
  <span class="rev">单视图版 · 第 1–8 步</span>
</header>
<div class="row">
  <aside class="steps" id="steps">
    <h2>步骤</h2>
    <button class="stepbtn on" data-n="1"><span class="n">1</span><span class="t">一趟就是一个对象</span>
      <span class="d">trips 每一行是一个 :Trip；主键、列、4,120 趟</span></button>
    <button class="stepbtn" data-n="2"><span class="n">2</span><span class="t">粒度：一趟 vs 一个站次</span>
      <span class="d">同一个「准时」，换分母差 40 个点：94.60% 与 53.91%</span></button>
    <button class="stepbtn" data-n="3"><span class="n">3</span><span class="t">定义不是列</span>
      <span class="d">「整趟全准点」编译成 WHERE / EXISTS，不是新加一列</span></button>
    <button class="stepbtn" data-n="4"><span class="n">4</span><span class="t">指标：定义编译成数字</span>
      <span class="d">声明 → SQL → 数字，自己跑一遍</span></button>
    <button class="stepbtn" data-n="5"><span class="n">5</span><span class="t">三条口径不能相加</span>
      <span class="d">轴荷 39.61% / 重量 29.49% / 站点超标 18.45%</span></button>
    <button class="stepbtn" data-n="6"><span class="n">6</span><span class="t">拒绝也是交付物</span>
      <span class="d">温度趋势、逐轴实载：缺哪张表就说缺哪张</span></button>
    <button class="stepbtn" data-n="7"><span class="n">7</span><span class="t">护栏：不许无声扫全表</span>
      <span class="d">unbounded scan 会被报出来，不是因为报错才停</span></button>
    <button class="stepbtn" data-n="8"><span class="n">8</span><span class="t">看板与红线</span>
      <span class="d">阈值是业务决定，未确权的标 assumed</span></button>
    <div class="hint">每一步都是活页面：点一下就出表、出编译好的 SQL、出数字；第 6 步还能看它按名拒绝。</div>
  </aside>
  <div class="splitter" data-panel="steps"></div>
  <div class="main"><iframe id="frame" src="" title="教程步骤"></iframe></div>
  <div class="splitter" data-panel="graph"></div>
  <aside class="graphpanel" id="graphpanel" style="width:330px">
    <div id="mini-graph" data-step="1"></div>
    <div id="graph-caption" class="graph-caption">点一个节点查看它</div>
    <div class="note">列跟着边走：左边是「东西」，右边是它指向谁。滚轮缩放 · 拖动节点 · 点节点高亮它的边。</div>
  </aside>
</div>
<script>
// The chapter is served at /api/ontology/<key>/tutorial/chapter/<n>; derive the key from it, so this
// page needs no hard-coded ontology name and no "/api/" literal (the serve layer rewrites those).
const KEY = location.pathname.split('/')[3];
const frame = document.getElementById('frame');
const box = document.getElementById('steps');

frame.src = `${location.origin}/api/ontology/${KEY}/tutorial/chapter/1`;

(function () {
  const panels = {
    steps: { el: document.getElementById('steps'), min: 170, max: 420 },
    graph: { el: document.getElementById('graphpanel'), min: 220, max: 720 },
  };
  document.querySelectorAll('.splitter').forEach(sp => {
    const p = panels[sp.dataset.panel];
    sp.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      const startX = ev.clientX;
      const startW = p.el.getBoundingClientRect().width;
      const sign = sp.dataset.panel === 'steps' ? 1 : -1;
      const move = (e) => {
        const w = startW + sign * (e.clientX - startX);
        p.el.style.width = Math.min(p.max, Math.max(p.min, w)) + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        try { localStorage.setItem('lc_tut_' + sp.dataset.panel, p.el.style.width); } catch (e) {}
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });
  Object.entries(panels).forEach(([k, p]) => {
    try { const v = localStorage.getItem('lc_tut_' + k); if (v) p.el.style.width = v; } catch (e) {}
  });
})();

box.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.stepbtn');
  if (!btn) return;
  box.querySelectorAll('.stepbtn').forEach(b => b.classList.toggle('on', b === btn));
  frame.src = `${location.origin}/api/ontology/${KEY}/tutorial/chapter/${btn.dataset.n}`;
  if (window.tutorialGraph) window.tutorialGraph(btn.dataset.n);
});
</script>
<script src="/tutorial_graph.js"></script><!-- page() 会把它重写到本体的 asset 路由 -->
</body>
</html>
