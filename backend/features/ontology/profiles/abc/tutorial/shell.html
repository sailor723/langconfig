<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABC 冷链 · 八步案例</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,"PingFang SC",Roboto,sans-serif;background:#f6f7f9;
       display:flex;flex-direction:column;color:#1c1e21}
  header{background:#102a43;color:#fff;padding:14px 20px;flex:none}
  header h1{margin:0;font-size:16px}
  header .sub{font-size:12px;color:#9fb8cf;margin-top:3px}
  .wrap{flex:1;display:flex;min-height:0}
  .steps{width:260px;flex:none;background:#fff;border-right:1px solid #e3e6ea;
          padding:14px 12px;overflow:auto}
  .steps h2{margin:0 0 8px;font-size:11px;letter-spacing:.6px;color:#687b8f}
  .stepbtn{display:block;width:100%;text-align:left;margin:0 0 6px;padding:9px 10px;
            border:1px solid #e3e6ea;border-radius:8px;background:#fff;cursor:pointer;
            font:inherit}
  .stepbtn.on{border-color:#0b4f9c;box-shadow:0 0 0 1px #0b4f9c inset;background:#f7faff}
  .stepbtn .n{font:10px ui-monospace,Menlo,monospace;color:#0b4f9c}
  .stepbtn .t{display:block;font-size:13px;font-weight:600;margin:1px 0 2px}
  .stepbtn .d{display:block;font-size:11px;color:#687b8f;line-height:1.4}
  .main{flex:1;min-width:0}
  iframe{width:100%;height:100%;border:0;background:#f6f7f9}
  .graphpanel{width:330px;flex:none;background:#fff;border-left:1px solid #e3e6ea;
               padding:14px 12px;overflow:auto}
  .graphpanel h2{margin:0 0 8px;font-size:11px;letter-spacing:.6px;color:#687b8f}
  .graph-caption{font-size:12px;color:#334e68;margin-top:8px;line-height:1.5}
  .note{font-size:11.5px;color:#687b8f;margin-top:10px;line-height:1.6}
</style></head>
<body>
<header><h1>ABC 冷链物联 · 案例八步</h1>
  <div class="sub">同一套数据，语义一层层长出来 —— 每一步都是可运行的页面</div></header>
<div class="wrap">
  <aside class="steps" id="steps">
    <h2>案例八步</h2>
    <button class="stepbtn on" data-n="1"><span class="n">01</span><span class="t">一个对象，最普通的 SQL</span><span class="d">只有车辆表；每一行就是一台车</span></button>
    <button class="stepbtn" data-n="2"><span class="n">02</span><span class="t">两个对象和一个连接</span><span class="d">趟次连到车辆；红色的外键就是连接</span></button>
    <button class="stepbtn" data-n="3"><span class="n">03</span><span class="t">一个本体和一个定义</span><span class="d">对象类型 + 编译成 WHERE 的定义</span></button>
    <button class="stepbtn" data-n="4"><span class="n">04</span><span class="t">一个动作类型</span><span class="d">排线指派：被校验、被审计的写操作</span></button>
    <button class="stepbtn" data-n="5"><span class="n">05</span><span class="t">超载是一个定义</span><span class="d">一列比一列；改阈值，数字跟着变</span></button>
    <button class="stepbtn" data-n="6"><span class="n">06</span><span class="t">指标</span><span class="d">定义编译成数字：比率、分维度、可以提问</span></button>
    <button class="stepbtn" data-n="7"><span class="n">07</span><span class="t">一个新的对象：站点执行</span><span class="d">趟次下面的每一次送货；它自己带数据</span></button>
    <button class="stepbtn" data-n="8"><span class="n">08</span><span class="t">一个维度：线路版本</span><span class="d">并线前后的对比；维度切分度量，从不累加</span></button>
    <div class="note">每一步都是活页面：提个问题、跑个动作、改个阈值 —— 答案都来自同一批车、同一批趟次。</div>
  </aside>
  <div class="main"><iframe id="frame" src="/abctutorial/1?embed=1"></iframe></div>
  <aside class="graphpanel">
    <h2>本体图</h2>
    <div id="mini-graph" data-step="1"></div>
    <div class="graph-caption" id="graph-caption">点一个节点看说明</div>
    <div class="note">列跟着边排：左边是对象，右边是它们指向的东西。滚轮缩放 · 拖动节点 ·
      点节点高亮它的边。</div>
  </aside>
</div>
<script src="/tutorial_graph.js"></script>
<script>
const frame = document.getElementById('frame');
const box = document.getElementById('steps');
box.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.stepbtn');
  if (!btn) return;
  box.querySelectorAll('.stepbtn').forEach(b => b.classList.toggle('on', b === btn));
  frame.src = '/abctutorial/' + btn.dataset.n + '?embed=1';
});
</script>
</body></html>
