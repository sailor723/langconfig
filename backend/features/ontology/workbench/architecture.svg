<rect x="48" y="470" width="560" height="110" rx="10" fill="read_soft" stroke="#0b4f9c" stroke-width="1.5"/><text x="62" y="496" font-size="14" font-weight="600" fill="#1c1e21" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">sqlgen.py — compiles the TTL</text><text x="62" y="517" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">concept_sql       : axiom → WHERE predicate</text><text x="62" y="538" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">compile_metric    : :aggregate/:grain/:universe/:where → SELECT</text><text x="62" y="559" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">class_assignment  : axiom → UPDATE assignment (writes)</text><text x="62" y="580" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">relationship      : declared FK + :references → JOIN</text>
<rect x="700" y="470" width="560" height="110" rx="10" fill="write_soft" stroke="#b3261e" stroke-width="1.5"/><text x="714" y="496" font-size="14" font-weight="600" fill="#1c1e21" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">actions.py — compiles actions.yml</text><text x="714" y="517" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">preconditions : exists | class | state | params → SELECT …</text><text x="714" y="538" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">effect        : class | property | create → UPDATE/INSERT …</text><text x="714" y="559" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">run_action    : FOR UPDATE → checks → effect → audit → COMMIT</text><text x="714" y="580" font-size="12" fill="#687b8f" font-family="ui-monospace, Menlo, monospace">check_action  : same steps, always rolled back (dry-run)</text>
