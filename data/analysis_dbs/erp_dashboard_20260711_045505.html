  if(!isNaN(y)) return salesData.filter(function(r){return r.year===y;});
  return salesData.slice();
}

/* === Cross-filter (cross-chart filter) === */
function attachClickFilter(divId){
  var el=document.getElementById(divId);
  if(!el) return;
  var pendingClick=null;
  el.on("plotly_click", function(ev){
    var pt=ev.points && ev.points[0];
    if(!pt||!pt.x) return;
    pendingClick={period:pt.x, ts:Date.now()};
    setTimeout(function(){
      if(pendingClick && Date.now()-pendingClick.ts>=250){
        var p=pendingClick.period;
        selectedPeriod=(selectedPeriod===p)?null:p;
        renderAll(getFiltered());
        pendingClick=null;
      }
    },260);
  });
  el.on("plotly_doubleclick", function(){
    pendingClick=null;
    if(selectedPeriod!==null){ selectedPeriod=null; renderAll(getFiltered()); }
  });
}
function perPointColors(periods,base,dim){
  if(!selectedPeriod) return periods.map(function(){return base;});
  return periods.map(function(p){return p===selectedPeriod?base:dim;});
}
function perPointOpacities(periods){
  if(!selectedPeriod) return periods.map(function(){return 1.0;});
  return periods.map(function(p){return p===selectedPeriod?1.0:0.25;});
}
function perPointSizes(periods,base){
  if(!selectedPeriod) return periods.map(function(){return base;});
  return periods.map(function(p){return p===selectedPeriod?base+3:base;});
}

}
function resetFilters(){
  selectedPeriod=null;
  document.getElementById("filterPeriod").value="all";
  renderAll(salesData);
}

/* === Bootstrap (Mode B: Static Embed) === */
function bootstrap(){
  try {
    company   = EMBEDDED_DATA.company   || {};
    salesData = EMBEDDED_DATA.salesData || [];
    allData   = salesData;
    products  = EMBEDDED_DATA.products  || [];
    tiers     = EMBEDDED_DATA.tiers     || [];
    regions   = EMBEDDED_DATA.regions   || [];
    annual    = EMBEDDED_DATA.annual    || [];
    bridge    = EMBEDDED_DATA.ebitdaBridge || {};
    overall   = EMBEDDED_DATA.overall   || {};
    if(!salesData.length) throw new Error('salesData 为空');
    renderAll(salesData);
  } catch(err){
    document.body.insertAdjacentHTML('afterbegin',
      '<div class="err">⚠ 数据加载失败：'+err.message+'</div>');
  }
}
bootstrap();
</script>
</body>
