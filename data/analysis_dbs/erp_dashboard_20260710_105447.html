function fmt$(n){if(n==null)return"—";if(Math.abs(n)>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(Math.abs(n)>=1e3)return"$"+(n/1e3).toFixed(1)+"K";return"$"+n.toFixed(0);}
function fmtPct(n){if(n==null)return"—";return n.toFixed(1)+"%";}
function fmtX(n){if(n==null)return"—";return n.toFixed(1)+"x";}

function getFiltered(){
  var f = document.getElementById("filterPeriod").value;
  if(f==="all") return salesData.slice();
  if(f==="last4") return salesData.slice(-4);
  if(f==="last8") return salesData.slice(-8);
  var y = parseInt(f,10);
  if(!isNaN(y)) return salesData.filter(function(r){return r.year===y;});
  return salesData.slice();
}

function perPointColors(periods,base){return selectedPeriod?periods.map(function(p){return p===selectedPeriod?base:DIM;}):periods.map(function(){return base;});}
function perPointOpacities(periods){return selectedPeriod?periods.map(function(p){return p===selectedPeriod?1.0:0.25;}):periods.map(function(){return 1.0;});}
function perPointSizes(periods,base){return selectedPeriod?periods.map(function(p){return p===selectedPeriod?base+4:base;}):periods.map(function(){return base;});}

function renderKPIs(d){
  if(d.length===0){document.getElementById("kpiRow").innerHTML="";return;}
  var L=d[d.length-1], P=d.length>1?d[d.length-2]:L, Y=d.length>4?d[d.length-5]:d[0];
  function delta(cur,prev){if(prev==null||prev===0)return"";var v=(cur-prev)*100.0/prev;var sym=v>=0?"▲":"▼";return '<span class="delta '+(v>=0?"up":"down")+'">'+sym+' '+Math.abs(v).toFixed(1)+'% YoY</span>';}
  var cards=[
    {l:"营收 Revenue",v:fmt$(L.revenue),d:delta(L.revenue,Y.revenue)},
    {l:"EBITDA",v:fmt$(L.ebitda),d:delta(L.ebitda,Y.ebitda)},

}

function generateInsights(d){

  },{responsive:true,displayModeBar:false});

  Plotly.react("c2",[
    {x:periods,y:d.map(function(r){return r.grossMargin;}),type:"scatter",mode:"lines+markers",line:{color:NAVY,width:2.5},marker:{size:s,color:c},name:"毛利率"},
    {x:periods,y:d.map(function(r){return r.ebitdaMargin;}),type:"scatter",mode:"lines+markers",line:{color:GOLD,width:2.5},marker:{size:s},name:"EBITDA Margin"},
    {x:periods,y:d.map(function(r){return r.netMargin;}),type:"scatter",mode:"lines+markers",line:{color:"#6b7280",width:2,dash:"dot"},marker:{size:s},name:"净利率"}
  ],{

  // c6 Cash flow
  Plotly.react("c6",[
    {x:periods,y:d.map(function(r){return r.ocf;}),type:"bar",marker:{color:NAVY,opacity:o},name:"OCF"},

  if(!el)return;
  var pendingClick=null;
  el.on('plotly_click',function(ev){
    var pt=ev.points&&ev.points[0];if(!pt||!pt.x)return;
    pendingClick={period:pt.x,ts:Date.now()};
    setTimeout(function(){
      if(pendingClick&&Date.now()-pendingClick.ts>=250){
        var p=pendingClick.period;
        selectedPeriod=(selectedPeriod===p)?null:p;
        renderAll(getFiltered());pendingClick=null;
      }
    },260);
  });
  el.on('plotly_doubleclick',function(){
    pendingClick=null;
    if(selectedPeriod!==null){selectedPeriod=null;renderAll(getFiltered());}
  });
}

function applyFilters(){selectedPeriod=null;renderAll(getFiltered());}
function resetFilters(){selectedPeriod=null;document.getElementById("filterPeriod").value="all";renderAll(salesData);}

function renderAll(d){
  renderKPIs(d);
  renderOverall(d);
  renderCharts(d);
}

function refreshData(){
  var btn=document.getElementById("refreshBtn");
  if(btn){btn.disabled=true;btn.textContent="⏳ 加载中…";}
  fetch(DATA_API+"?t="+Date.now())
    .then(function(r){return r.json();})
    .then(function(p){
      company=p.company||{};salesData=p.salesData||[];products=p.products||[];
      tiers=p.tiers||[];regions=p.regions||[];overall=p.overall||{};
      selectedPeriod=null;
      renderAll(salesData);
      if(btn){btn.disabled=false;btn.textContent="✅ 已更新";setTimeout(function(){btn.textContent="🔄 刷新数据";},1500);}
    })
    .catch(function(err){
      console.error(err);
      document.body.insertAdjacentHTML("afterbegin",'<div class="err-banner">⚠ 数据加载失败：'+err.message+'（如需离线运行，请使用 python -m http.server 在同目录启动）</div>');
      if(btn){btn.disabled=false;btn.textContent="❌ 失败";setTimeout(function(){btn.textContent="🔄 刷新数据";},2000);}
    });
}

function bootstrap(){refreshData();}
bootstrap();
</script>
</body>
</html>
