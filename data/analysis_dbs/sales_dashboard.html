<!DOCTYPE html>
    <html lang="zh-CN">
    <head>
    <meta charset="utf-8">
    <title>AcmeCloud Sales · 业务仪表盘</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; font-family: 'PingFang SC','Microsoft YaHei',Arial,sans-serif;
             background: #f5f7fa; color: #1f2937; }
      h1 { margin: 0 0 6px 0; font-size: 24px; color: #1e3a8a; }
      .subtitle { color: #6b7280; margin-bottom: 18px; font-size: 13px; }

      .control-bar { background: #ffffff; padding: 14px 18px; border-radius: 10px;
                     display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
                     margin-bottom: 16px; border: 1px solid #eef0f4; }
      .control-bar label { font-size: 12px; color: #6b7280; display:flex; flex-direction:column; gap:4px; }
      .control-bar select { padding: 6px 10px; border: 1px solid #dce4ec;
                            border-radius: 6px; font-size: 13px; min-width: 120px; cursor: pointer; }
      .btn-reset { background: #1e3a8a; color: white; border: none; border-radius: 6px;
                   padding: 9px 16px; font-size: 13px; cursor: pointer; font-weight: 600; }
      .btn-reset:hover { background: #2c4cb0; }
      .filter-info { margin-left: auto; font-size: 12px; color: #6b7280; }

      .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 16px; }
      .kpi { background: #ffffff; padding: 16px; border-radius: 10px;
             border-left: 4px solid #1e3a8a; }
      .kpi.gold { border-left-color: #c8a96a; }
      .kpi.dim  { border-left-color: #9ca3af; }
      .kpi .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
      .kpi .value { font-size: 22px; font-weight: 700; color: #1f2937; margin-top: 6px; }
      .kpi .delta { font-size: 11px; color: #6b7280; margin-top: 4px; }

      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .card { background: #ffffff; padding: 14px 16px; border-radius: 10px;
              border: 1px solid #eef0f4; }
      .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #1e3a8a; }
      .chart { width: 100%; height: 340px; }
      .full { grid-column: 1 / -1; }

      .insight-box { background: #ffffff; padding: 18px 20px; border-radius: 10px;
                     border-left: 4px solid #c8a96a; margin-top: 18px; border: 1px solid #eef0f4; }
      .insight-box h3 { margin: 0 0 12px 0; font-size: 15px; color: #1e3a8a; }
      .insight-box ul { margin: 0; padding-left: 20px; line-height: 1.85; font-size: 13.5px; }
      .insight-box li { margin-bottom: 4px; }
      .insight-box li b { color: #1e3a8a; }

      @media (max-width: 980px) {
        .kpi-row { grid-template-columns: repeat(2, 1fr); }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
    </head>
    <body>

    <h1>📊 AcmeCloud 销售业务仪表盘</h1>
    <div class="subtitle">销售、订单、客户、产品 · 多维交互分析</div>

    <!-- ===== Control Bar ===== -->
    <div class="control-bar">
      <label>客户状态
        <select id="f_customer_status" data-filter="customer_status" onchange="applyFilters()"><option value="all">全部</option><option value="active">active</option><option value="inactive">inactive</option></select>
      </label>
      <label>客户等级
        <select id="f_customer_tier" data-filter="customer_tier" onchange="applyFilters()"><option value="all">全部</option><option value="bronze">bronze</option><option value="gold">gold</option><option value="platinum">platinum</option><option value="silver">silver</option></select>
      </label>
      <label>国家
        <select id="f_country" data-filter="country" onchange="applyFilters()"><option value="all">全部</option><option value="China">China</option><option value="Japan">Japan</option><option value="Korea">Korea</option></select>
      </label>
      <label>订单状态
        <select id="f_order_status" data-filter="order_status" onchange="applyFilters()"><option value="all">全部</option><option value="cancelled">cancelled</option><option value="completed">completed</option><option value="pending">pending</option></select>
      </label>
      <label>销售区域
        <select id="f_sales_region" data-filter="sales_region" onchange="applyFilters()"><option value="all">全部</option><option value="east">east</option><option value="north">north</option><option value="south">south</option><option value="west">west</option></select>
      </label>
      <label>产品类别
        <select id="f_category" data-filter="category" onchange="applyFilters()"><option value="all">全部</option><option value="Hardware">Hardware</option><option value="Infrastructure">Infrastructure</option><option value="Software">Software</option></select>
      </label>
      <button class="btn-reset" onclick="resetFilters()">↺ 重置</button>
      <span class="filter-info" id="filterInfo"></span>
    </div>

    <!-- ===== KPI Cards ===== -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- ===== Charts ===== -->
    <div class="grid">
      <div class="card">
        <h3>① 月度营收趋势（按订单状态堆叠）</h3>
        <div id="chartRevenue" class="chart"></div>
      </div>
      <div class="card">
        <h3>② 各销售区域营收对比</h3>
        <div id="chartRegion" class="chart"></div>
      </div>
      <div class="card">
        <h3>③ 产品类别利润率（毛利率）</h3>
        <div id="chartCategory" class="chart"></div>
      </div>
      <div class="card">
        <h3>④ 客户等级 · 营收贡献</h3>
        <div id="chartTier" class="chart"></div>
      </div>
    </div>

: 499.99, "unit_cost": 200.0, "margin": 299.99}, {"order_id": 21, "customer_id": 10, "product_id": 2, "order_date": "2025-07-05", "status": "completed", "quantity": 1, "total_amount": 199.99, "sales_region": "south", "product_name": "Cloud Data Pipeline", "product_category": "Software", "unit_price": 199.99, "unit_cost": 60.0, "margin": 139.99}, {"order_id": 22, "customer_id": 1, "product_id": 6, "order_date": "2025-07-10", "status": "cancelled", "quantity": 1, "total_amount": 1499.99, "sales_region": "east", "product_name": "Enterprise Security Suite", "product_category": "Software", "unit_price": 1499.99, "unit_cost": 500.0, "margin": 999.99}, {"order_id": 23, "customer_id": 3, "product_id": 8, "order_date": "2025-07-15", "status": "completed", "quantity": 1, "total_amount": 399.99, "sales_region": "north", "product_name": "Automated ML Pipeline", "product_category": "Software", "unit_price": 399.99, "unit_cost": 150.0, "margin": 249.99}, {"order_id": 24, "customer_id": 5, "product_id": 5, "order_date": "2025-07-20", "status": "completed", "quantity": 1, "total_amount": 999.99, "sales_region": "east", "product_name": "Quantum Computing Simulator", "product_category": "Software", "unit_price": 999.99, "unit_cost": 400.0, "margin": 599.99}, {"order_id": 25, "customer_id": 9, "product_id": 7, "order_date": "2025-07-25", "status": "pending", "quantity": 3, "total_amount": 749.97, "sales_region": "west", "product_name": "IoT Sensor Array", "product_category": "Hardware", "unit_price": 249.99, "unit_cost": 100.0, "margin": 149.99}];
    var products  = [{"product_id": 1, "product_name": "AI-Powered Analytics Pro", "category": "Software", "unit_price": 299.99, "unit_cost": 80.0, "discontinued": 0}, {"product_id": 2, "product_name": "Cloud Data Pipeline", "category": "Software", "unit_price": 199.99, "unit_cost": 60.0, "discontinued": 0}, {"product_id": 3, "product_name": "Smart Dashboard Lite", "category": "Software", "unit_price": 99.99, "unit_cost": 30.0, "discontinued": 0}, {"product_id": 4, "product_name": "Neural Network Starter Kit", "category": "Hardware", "unit_price": 499.99, "unit_cost": 200.0, "discontinued": 0}, {"product_id": 5, "product_name": "Quantum Computing Simulator", "category": "Software", "unit_price": 999.99, "unit_cost": 400.0, "discontinued": 1}, {"product_id": 6, "product_name": "Enterprise Security Suite", "category": "Software", "unit_price": 1499.99, "unit_cost": 500.0, "discontinued": 0}, {"product_id": 7, "product_name": "IoT Sensor Array", "category": "Hardware", "unit_price": 249.99, "unit_cost": 100.0, "discontinued": 0}, {"product_id": 8, "product_name": "Automated ML Pipeline", "category": "Software", "unit_price": 399.99, "unit_cost": 150.0, "discontinued": 0}, {"product_id": 9, "product_name": "Data Lake Storage 1TB", "category": "Infrastructure", "unit_price": 59.99, "unit_cost": 20.0, "discontinued": 0}, {"product_id": 10, "product_name": "GPU Computing Cluster", "category": "Hardware", "unit_price": 4999.99, "unit_cost": 3000.0, "discontinued": 0}];

    // Maps for lookup
    var customersById = {};
    customers.forEach(function(c){ customersById[c.customer_id] = c; });

    products.forEach(function(p){ productsById[p.product_id] = p; });

    // Enrich orders with product/customer info
    orders.forEach(function(o){

      o.product_name = p.product_name || '';

    var NAVY = '#1e3a8a';

    var SLATE = '#64748b';
    var GREEN_OK = '#0f766e';
    var WARN = '#dc8a3a';

    // ================== 过滤逻辑 ==================
    function getFilterValues() {
      var keys = ['customer_status','customer_tier','country','order_status','sales_region','category'];
      var f = {};
      keys.forEach(function(k){
        var sel = document.querySelector('select[data-filter="'+k+'"]');
        f[k] = sel ? sel.value : 'all';
      });
      return f;
    }

    function resetFilters() {
      document.querySelectorAll('.control-bar select').forEach(function(sel){
        sel.value = 'all';
      });
      applyFilters();
    }

    function applyFilters() {
      var f = getFilterValues();

      // 1. 先按客户维度筛选（确定参与的 customer_id）
      var eligibleCustomers = customers.filter(function(c){
        if (f.customer_status !== 'all' && c.status !== f.customer_status) return false;
        if (f.customer_tier   !== 'all' && c.customer_tier !== f.customer_tier) return false;
        if (f.country         !== 'all' && c.country !== f.country) return false;
        return true;
      });
      var eligibleCustomerIds = new Set(eligibleCustomers.map(function(c){return c.customer_id;}));

      // 2. 再按产品类别筛选
      var eligibleProductIds = new Set();
      products.forEach(function(p){
        if (f.category === 'all' || p.category === f.category) {
          eligibleProductIds.add(p.product_id);
        }
      });

      // 3. 订单维度
      var filteredOrders = orders.filter(function(o){
        if (!eligibleCustomerIds.has(o.customer_id)) return false;
        if (!eligibleProductIds.has(o.product_id)) return false;
        if (f.order_status !== 'all' && o.status !== f.order_status) return false;
        if (f.sales_region !== 'all' && o.sales_region !== f.sales_region) return false;
        return true;
      });

      var filteredProducts = products.filter(function(p){ return eligibleProductIds.has(p.product_id); });

      renderAll(filteredOrders, filteredProducts, eligibleCustomers);
    }

    // ================== 渲染总入口 ==================
    function renderAll(filteredOrders, filteredProducts, filteredCustomers) {
      var totalRev   = filteredOrders.reduce(function(s,o){ return s + (o.status==='cancelled' ? 0 : o.total_amount); }, 0);
      var totalQty   = filteredOrders.reduce(function(s,o){ return s + o.quantity; }, 0);
      var totalCnt   = filteredOrders.length;
      var activeCnt  = new Set(filteredOrders.map(function(o){return o.customer_id;})).size;
      var aov        = totalCnt ? totalRev / totalCnt : 0;

      // KPI
      var kpis = [
        { label:'总营收 (USD)',    value:'$' + totalRev.toLocaleString(undefined,{maximumFractionDigits:2}), cls:'', delta: totalCnt + ' 笔订单' },
        { label:'总订单数',        value:totalCnt,  cls:'gold', delta:'完成 ' + filteredOrders.filter(function(o){return o.status==='completed';}).length + ' / 取消 ' + filteredOrders.filter(function(o){return o.status==='cancelled';}).length },
        { label:'活跃客户',        value:activeCnt, cls:'', delta: filteredCustomers.length + ' 个总客户' },
        { label:'销量 (件)',       value:totalQty,  cls:'gold', delta:'完成订单量' },
        { label:'客单价 (AOV)',    value:'$' + aov.toLocaleString(undefined,{maximumFractionDigits:2}), cls:'dim', delta:'总营收 / 订单数' },
      ];
      document.getElementById('kpiRow').innerHTML = kpis.map(function(k){
        return '<div class="kpi '+k.cls+'"><div class="label">'+k.label+'</div>'
             + '<div class="value">'+k.value+'</div>'
             + '<div class="delta">'+k.delta+'</div></div>';
      }).join('');

      // ===== 图表 =====
      renderRevenueTrend(filteredOrders);
      renderRegionBar(filteredOrders);
      renderCategoryMargin(filteredOrders, filteredProducts);
      renderTierDonut(filteredOrders);

      // ===== 洞察 =====
      generateInsights(filteredOrders, filteredProducts, filteredCustomers);

      // ===== 顶部 Filter Info =====
      document.getElementById('filterInfo').textContent =
        '📦 ' + filteredOrders.length + ' / ' + orders.length + ' 条订单 · '
        + filteredCustomers.length + ' / ' + customers.length + ' 个客户';
    }

    // ================== 图表 1：月度营收趋势（堆叠柱形） ==================
    function renderRevenueTrend(ordersList) {
      // 按 (month, status) 分组
      var bucket = {};
      ordersList.forEach(function(o){
        if (o.status === 'cancelled') return; // 取消订单不计营收
        var m = o.order_date.slice(0,7);
        bucket[m] = bucket[m] || {};
        bucket[m][o.status] = (bucket[m][o.status] || 0) + o.total_amount;
      });
      var months = Object.keys(bucket).sort();
      var statuses = ['completed','pending'];
      var traces = statuses.map(function(st, idx){
        return {
          x: months,
          y: months.map(function(m){ return (bucket[m][st] || 0); }),
          name: st,
          type: 'bar',
          marker: { color: PALETTE[idx] },
          hovertemplate: '<b>%{x}</b><br>'+st+': $%{y:.2f}<extra></extra>'
        };
      });
      var layout = {
        barmode: 'stack',
        margin: { t: 10, l: 50, r: 10, b: 40 },
        paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
        legend: { orientation:'h', y:-0.18 },
        xaxis: { title: '', tickangle: -30 },
        yaxis: { title: '营收 (USD)', gridcolor:'#eef0f4' }
      };
      Plotly.newPlot('chartRevenue', traces, layout, {displayModeBar:false, responsive:true});
    }

    // ================== 图表 2：销售区域营收对比 ==================
    function renderRegionBar(ordersList) {
      var bucket = {};
      ordersList.forEach(function(o){
        if (o.status === 'cancelled') return;
        bucket[o.sales_region] = (bucket[o.sales_region] || 0) + o.total_amount;
      });
      var regions = Object.keys(bucket).sort();
      var revs    = regions.map(function(r){ return bucket[r]; });
      var counts  = regions.map(function(r){
        return ordersList.filter(function(o){ return o.sales_region===r && o.status!=='cancelled'; }).length;
      });
      var trace = {
        type: 'bar',
        x: regions, y: revs,
        text: revs.map(function(v){ return '$'+v.toLocaleString(undefined,{maximumFractionDigits:0}); }),
        textposition: 'auto',
        marker: {
          color: revs,
          colorscale: [[0, '#cbd5e1'], [1, NAVY]],
          line: { color: '#fff', width: 1 }
        },
        hovertemplate: '<b>%{x}</b><br>营收: $%{y:.2f}<br>订单数: %{customdata}<extra></extra>',
        customdata: counts
      };
      Plotly.newPlot('chartRegion', [trace], {
        margin: { t:10, l:60, r:10, b:40 },
        paper_bgcolor:'#ffffff', plot_bgcolor:'#ffffff',
        xaxis: { title: '区域' },
        yaxis: { title: '营收 (USD)', gridcolor:'#eef0f4' }
      }, {displayModeBar:false, responsive:true});
    }

    // ================== 图表 3：产品类别利润率 ==================
    function renderCategoryMargin(ordersList, productsList) {
      // 每个 product 的累计 (revenue, cost)，按类别聚合
      var byCat = {};
      ordersList.forEach(function(o){
        if (o.status === 'cancelled') return;
        var cat = o.product_category || (productsById[o.product_id] || {}).category || 'Unknown';
        if (!byCat[cat]) byCat[cat] = { revenue:0, cost:0 };
        var p = productsById[o.product_id] || {};
        byCat[cat].revenue += o.total_amount;
        byCat[cat].cost    += (p.unit_cost || 0) * (o.quantity || 1);
      });
      var cats = Object.keys(byCat).sort();
      var revArr = cats.map(function(c){return byCat[c].revenue;});
      var cosArr = cats.map(function(c){return byCat[c].cost;});
      var margin = cats.map(function(c){
        return byCat[c].revenue > 0 ? (byCat[c].revenue - byCat[c].cost) / byCat[c].revenue * 100 : 0;
      });
      Plotly.newPlot('chartCategory', [
        { type:'bar', name:'成本', x:cats, y:cosArr, marker:{color:'#94a3b8'} },
        { type:'bar', name:'毛利', x:cats, y:revArr.map(function(r,i){return r - cosArr[i];}), marker:{color:GOLD} }
      ], {
        barmode:'stack',
        margin:{t:10,l:60,r:10,b:40},
        paper_bgcolor:'#ffffff',plot_bgcolor:'#ffffff',
        legend:{orientation:'h',y:-0.2},
        yaxis:{title:'金额 (USD)', gridcolor:'#eef0f4'},
        annotations: cats.map(function(c,i){
          return { x:c, y: revArr[i], text: '毛利率 '+margin[i].toFixed(1)+'%',
                   showarrow:false, yshift:18, font:{size:11,color:NAVY,family:'Arial'} };
        })
      }, {displayModeBar:false, responsive:true});
    }

    // ================== 图表 4：客户等级·营收贡献（环形） ==================
    function renderTierDonut(ordersList) {
      var bucket = {};
      ordersList.forEach(function(o){
        if (o.status === 'cancelled') return;
        var tier = o.customer_tier || 'unknown';
        bucket[tier] = (bucket[tier] || 0) + o.total_amount;
      });
      var tiers = Object.keys(bucket).sort();
      var revs  = tiers.map(function(t){ return bucket[t]; });
      Plotly.newPlot('chartTier', [{
        type:'pie', hole:0.55,
        labels: tiers, values: revs,
        marker: { colors: tiers.map(function(_,i){ return PALETTE[i % PALETTE.length]; }) },
        textinfo:'label+percent',
        hovertemplate:'<b>%{label}</b><br>营收: $%{value:.2f}<br>占比: %{percent}<extra></extra>'
      }], {
        margin:{t:10,l:10,r:10,b:10},
        paper_bgcolor:'#ffffff',plot_bgcolor:'#ffffff',
        showlegend:true,
        legend:{orientation:'h',y:-0.05}
      }, {displayModeBar:false, responsive:true});
    }

    // ================== 洞察生成 ==================
    function generateInsights(filteredOrders, filteredProducts, filteredCustomers) {
      var totalRev = filteredOrders.reduce(function(s,o){ return s + (o.status==='cancelled'?0:o.total_amount); }, 0);
      var totalCnt = filteredOrders.length;
      var aov = totalCnt ? totalRev / totalCnt : 0;

      // 区域分布
      var region = {};
      filteredOrders.forEach(function(o){ if (o.status!=='cancelled') region[o.sales_region]=(region[o.sales_region]||0)+o.total_amount; });
      var topRegion = Object.keys(region).sort(function(a,b){return region[b]-region[a];})[0] || '—';
      var topRegionShare = totalRev>0 ? (region[topRegion]||0)/totalRev*100 : 0;

      // 类别分布
      var cat = {};
      filteredOrders.forEach(function(o){
        if (o.status==='cancelled') return;
        cat[o.product_category] = (cat[o.product_category]||0) + o.total_amount;
      });
      var topCat = Object.keys(cat).sort(function(a,b){return cat[b]-cat[a];})[0] || '—';

      // 客户等级
      var tier = {};
      filteredOrders.forEach(function(o){
        if (o.status==='cancelled') return;
        tier[o.customer_tier] = (tier[o.customer_tier]||0) + o.total_amount;
      });
      var topTier = Object.keys(tier).sort(function(a,b){return tier[b]-tier[a];})[0] || '—';
      var topTierShare = totalRev>0 ? (tier[topTier]||0)/totalRev*100 : 0;

      // 完成率
      var completed = filteredOrders.filter(function(o){return o.status==='completed';}).length;
      var completionRate = totalCnt ? completed/totalCnt*100 : 0;

      // 活跃率
      var activeCustomers = filteredCustomers.filter(function(c){return c.status==='active';}).length;
      var activeRate = filteredCustomers.length ? activeCustomers/filteredCustomers.length*100 : 0;

      // 毛利率
      var grossProfit = 0;
      filteredOrders.forEach(function(o){
        if (o.status==='cancelled') return;
        var p = productsById[o.product_id] || {};
        grossProfit += o.total_amount - (p.unit_cost || 0) * (o.quantity || 1);
      });
      var grossMargin = totalRev>0 ? grossProfit/totalRev*100 : 0;

      // 高单价产品
      var productRev = {};
      filteredOrders.forEach(function(o){
        if (o.status==='cancelled') return;
        productRev[o.product_name] = (productRev[o.product_name]||0) + o.total_amount;
      });
      var topProduct = Object.keys(productRev).sort(function(a,b){return productRev[b]-productRev[a];})[0] || '—';

      // 国家分布
      var country = {};
      filteredOrders.forEach(function(o){
        if (o.status==='cancelled') return;
        country[o.customer_country] = (country[o.customer_country]||0) + o.total_amount;
      });
      var topCountry = Object.keys(country).sort(function(a,b){return country[b]-country[a];})[0] || '—';

      var insights = [
        { icon:'📈', text:'<b>营收规模</b>：当前筛选范围内总营收 <b>$' + totalRev.toLocaleString(undefined,{maximumFractionDigits:0}) + '</b>，来自 ' + totalCnt + ' 笔订单，客单价 AOV <b>$' + aov.toLocaleString(undefined,{maximumFractionDigits:2}) + '</b>。' },
        { icon:'🏆', text:'<b>销售区域冠军</b>：<b>' + topRegion + '</b> 区贡献 <b>$' + (region[topRegion]||0).toLocaleString(undefined,{maximumFractionDigits:0}) + '</b>，占比 <b>' + topRegionShare.toFixed(1) + '%</b>，是当前业务的区域增长极。' },
        { icon:'🎯', text:'<b>产品类别龙头</b>：<b>' + topCat + '</b> 类别领跑营收贡献，主要靠头部产品 <b>' + topProduct + '</b> 拉动，建议评估该 SKU 的库存与价格策略。' },
        { icon:'👑', text:'<b>客户结构</b>：<b>' + topTier + '</b> 等级客户贡献 <b>' + topTierShare.toFixed(1) + '%</b> 营收，VIP 客户集中度需重点关注（防流失 = 防营收下滑）。' },
        { icon:'✅', text:'<b>订单健康度</b>：完成率 <b>' + completionRate.toFixed(1) + '%</b>（' + completed + '/' + totalCnt + '），客户活跃率 <b>' + activeRate.toFixed(1) + '%</b>（' + activeCustomers + '/' + filteredCustomers.length + '）。' },
        { icon:'💰', text:'<b>盈利能力</b>：综合毛利率 <b>' + grossMargin.toFixed(1) + '%</b>（毛利 $' + grossProfit.toLocaleString(undefined,{maximumFractionDigits:0}) + '），SaaS / 软件行业健康基线 60-75%，当前表现反映产品定价与成本结构。' },
        { icon:'🌏', text:'<b>地域分布</b>：<b>' + topCountry + '</b> 为核心市场，是当前业务的基本盘；同时关注单一市场依赖带来的扩张风险。' }
      ];

      var html = insights.map(function(it){
        return '<li>' + it.icon + ' ' + it.text + '</li>';
      }).join('');
      document.getElementById('insightList').innerHTML = html;
    }

    // ================== 启动 ==================
    applyFilters();
    </script>
    </body>
    </html>
