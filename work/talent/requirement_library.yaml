version: 1
scope: 东莞 · 线束/连接器制造业 · 从 10 份职务说明书里概括出来的要求语义
measured: 2026-11-19
requirements:
- id: REQ-A-AGE-RANGE
  name: 年龄区间
  dimension: A
  attribute: A.2
  kind: threshold
  op: between
  value_shape:
    min: 岁
    max: 岁
  components: []
  assessable: true
  note: '要求是"年龄落在某个区间",区间是 JD 的取值。

    实测:品质经理 25~40、业务助理 25~38、副总助理 25~38 —— 三个取值,一条要求。

    供给侧 age 覆盖 107/277,所以能判,但有一多半的人判不了(未知,不是不合格)。

    '
- id: REQ-B-EDU-LEVEL
  name: 学历不低于
  dimension: B
  attribute: B.1
  kind: threshold
  op: '>='
  value_shape:
    num: 学历等级 2..6
  components: []
  assessable: true
  note: 'B.1 是 ordinal(2中专 3大专 4本科 5硕士 6博士),所以 ≥ 可算。

    150 份 JD 里写"大专及以上"和"中专及以上"的,是同一条要求、不同阈值。

    '
- id: REQ-B-MAJOR
  name: 专业限定
  dimension: B
  attribute: B.2
  kind: enumerate
  op: in
  value_shape:
    list: 专业名
  components: []
  assessable: true
  note: "判定分两条路,任一命中即满足:\n  ① **专业名命中**白名单(客户点名的那几个专业,照字面认)\n  ② **门类命中** match_field(把「等…类专业」落到分类学上)\n\
    \n为什么要 ②:原话是「机电一体化/电子技术/自动化/工业工程/机械工程**等**工程类专业」,「等」字表示不是穷举。只按白名单精确匹配会误杀「材料成型及控制工程」这类真工科。\n\
    \n门类不是这段代码判的,是本体推的:专业 → 专业类 → 门类(subClassOf 传递),见 major_taxonomy.ttl;join 只查 build_major_taxonomy\
    \ 落盘的结论。\n\n两个已知偏差,写明不藏:\n  · 「工业工程」在教育部目录里属管理学门类,但客户**点名**了它 → 走 ① 照样满足\n  ·\
    \ 分类表覆盖不到的写法 → 判「不可判」,不折成「不满足」"
  match_field: 工学
- id: REQ-C-YEARS-DOMAIN
  name: 某领域年限不低于
  dimension: C
  attribute: C.1
  kind: threshold
  op: '>='
  value_shape:
    num: 年
    domain: 职能域
  components: []
  year_basis: stated
  year_basis_note: '**比的是声明值(C.1 / years_stated),不是累计值。**

    理由:① 声明值覆盖 118 人,累计值只有 54 人且还不可验;② 客户 JD 写"3年以上"时,

    看的就是简历上写的年限。若某份 JD 要求按累计口径判,在**引用**上写 year_basis: computed

    —— 它属于哪份 JD 的判断,不属于要求本身(同 tier 的逻辑)。

    '
  assessable: true
  partial: 年限可判(148/277);领域限定需要 C.2 domain,该属性未建
  note: '一条要求同时约束年限与领域:"3年以上品质管理工作经验"。

    现在只能判年限 —— 10 年的人资专员和 10 年的品质经理在这条上得分相同。

    '
