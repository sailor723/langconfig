    assessable: true

  - id: REQ-D-QA-ANALYSIS
    name: 品质问题分析改善能力
    dimension: D
    attribute: null
    kind: component
    op: holds
    components: [skill_品质问题分析]      # 保留:具体组件
    assessable: true

  - id: REQ-D-QA-TOOLS
    name: 品质工具(QC七大手法/5WHY/SPC/CPK/6S)
    dimension: D
    attribute: null
    kind: composite
    op: holds
    components: [skill_QC七大手法, skill_SPC, skill_CPK, skill_6S]
    unlinked_parts:
      - {text: 5WHY, gap: P5}
    assessable: true
    note: |
      原文点名 5 项,组件只有 4 项 —— 5WHY 没有组件(gaps.P5)。显式留空,不凑。
      这 4 个组件的持有率差 26 倍(QC七大手法 1/277、6S 26/277),
      所以"满足这条"和"满足这条"之间差别极大 —— 复合要求必须拆开看。

  - id: REQ-D-CUSTOMER-AUDIT
    name: 客户验厂经验
    dimension: D
