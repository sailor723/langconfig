- id: REQ-HR-NOTICE
  name: 到岗时间不超过
  dimension: A
  attribute: A.3
  kind: threshold
  op: <=
  value_shape:
    num: 周
  components: []
  assessable: true
  source: HR 侧
  rationale: HR 一面必问的第一件事。超过一个月的交接期,业务方通常等不了 —— 岗位空着就是产线停着。
  note: 阈值(几周)是每份 JD 的取值,不是要求的属性。数据源:A.3 notice_weeks,CV 只有 3%,主要靠一面
- id: REQ-HR-SALARY
  name: 期望薪资不超过岗位上限
  dimension: A
  attribute: A.5
  kind: threshold
  op: <=
  value_shape:
    num: K/月
  components: []
  assessable: true
  source: HR 侧
  rationale: 谈薪在第一轮就要摸清楚。等业务领导面完再发现给不起,是浪费双方时间。
  note: 岗位预算上限是 JD 侧的取值;客户 JD 不写薪资,所以这条在很多岗上会缺取值 → 不可判,这个缺口要暴露不要藏
- id: REQ-HR-STABILITY
  name: 近 5 年任职不超过
  dimension: C
  attribute: C.7
  kind: threshold
  op: <=
  value_shape:
    num: 家
  components: []
  assessable: true
  source: HR 侧
  rationale: HR 说「这人不太稳定」时,真正在担心的是换得太频。把这个担心落成一个可数的量,才能判;落不成量的印象就不该进计算。
  note: 数据源 C.7 recent5y_segments,可算 243/270(90%)。段数不等于公司数(OCR 缺公司名时更明显),这是近似
- id: REQ-HR-TENURE
  name: 平均在职不低于
  dimension: C
  attribute: C.4
  kind: threshold
  op: '>='
  value_shape:
    num: 年
  components: []
  assessable: true
  source: HR 侧
  rationale: 与稳定性互补:段数看「换得频不频」,均值看「每段待得住待不住」。有人只换过两家但每家半年。
  note: 数据源 C.4 avg_tenure_years,可算 243/270(90%)
- id: REQ-HR-COMMUTE
  name: 能接受上班地点
  dimension: A
  attribute: A.4
  kind: boolean
  op: '='
  value_shape:
    value: true/false
  components: []
  assessable: true
  source: HR 侧
  rationale: 地点太远的人,入职三个月就跑。这是招聘里最便宜的排除项,放在一面问掉。
  note: '**只做是非题,不做距离计算** —— CV 只有「住石排镇」这种自由文本,算不出通勤时间'
