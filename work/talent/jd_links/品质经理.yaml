  - id: QM-08
    verbatim: 懂QC七大手法、5WHY、SPC、CPK、6S工具
    # 原文:该行完整文字(textutil 抽取,见 source_text 文件)
    source_text: 具备品质问题分析、改善的能力，懂QC七大手法、5WHY、SPC、CPK、6S工具；
    txt_line: 19                # 该句在 source_text 文件里的行号(不是 Word 行号)
    section_index: 6            # 任职资格段内第几句(1~7)
    kind: composite
    components: [skill_QC七大手法, skill_SPC, skill_CPK, skill_6S]
    assessable: true
    unlinked_parts:
      - {text: 5WHY, gap: P5}
    note: |
      原文点名 5 项,目录里只有 4 项 —— **5WHY 没有对应组件**(gaps.P5)。
      不凑一个组件出来顶替;显式留空,让覆盖率的分母说真话。
      另外:skill_QC七大手法 只有 1/277 具备,而 skill_6S 有 26 ——
      这一条要求里 4 个组件的实际难度差 26 倍。

  # ── 第 7 行 · 拆成 2 条 ───────────────────────────────────────────────────
  - id: QM-09
    verbatim: 具备接待客户验厂经验
    # 原文:该行完整文字(textutil 抽取,见 source_text 文件)
    source_text: 具备接待客户验厂经验，有良好的沟通、协调能力。
    txt_line: 20                # 该句在 source_text 文件里的行号(不是 Word 行号)
    section_index: 7            # 任职资格段内第几句(1~7)
    components: [skill_客户验厂]
    assessable: true
    note: |
      我原先以为这类"活动经验"在 schema 里无处安放(为此加了 C.5 activity_experience)。
      查库发现 skill_客户验厂 已经存在且 13/277 具备,所以先用 D 维兜住。
      C.5 仍然保留,留给"做过 vs 会做"需要分开的那天。

  - id: QM-10
    verbatim: 有良好的沟通、协调能力
    # 原文:该行完整文字(textutil 抽取,见 source_text 文件)
    source_text: 具备接待客户验厂经验，有良好的沟通、协调能力。
    txt_line: 20                # 该句在 source_text 文件里的行号(不是 Word 行号)
    section_index: 7            # 任职资格段内第几句(1~7)
    dimension: E
    attribute_ref: E.1          # 仅作分类记录,不是链接 —— E.1 的 prop 是 null
    components: []
    assessable: false
    no_component: true
    note: |
      这条要求**直连 Dimension E 素质能力**,不连 E.1 行为素质。
      依据:要求应该连到携带信息的最具体节点。E.1 的 `prop` 是 **null** ——
      它不是一个候选人侧属性,只是一个分类标签。指向它等于说"我知道它属于行为素质"
      却说不出任何可判定的事,那是把分类冒充信息。
      对比 QM-03 → B.2 专业:那里的 prop 是 `major`(存在但未建),所以保留属性链接 ——
      它告诉我们要建哪个属性。`prop: null` 与 `prop_exists: false` 是两件事。
      E 维 24 条素质要求在本目录里**没有任何组件**,这一支天然没有叶子。
      在图上它是一条走到 Dimension 就到头的枝,不是缺陷,是事实。要判它只能靠面试评分表。

