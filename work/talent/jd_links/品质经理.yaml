# 为什么阈值在这里而不在库里(决定 A):
#   REQ-B-EDU-LEVEL 的意思是"学历不低于某个值",而"3"是品质经理这份 JD 的取值。
#   工程文员写 >=2、业务助理写 >=2 —— 同一个要求,不同阈值。
#   所以阈值属于**引用**,改了它不影响别的 JD。
#
# 三个数字在这里对齐,因为它们在别处是三个不同的值:
#   JD 原文标题写     「任职资格（5-8条）」        ← 原文自己的说法
#   原文正文实际       7 条行（以「；」分隔）
#   拆成原子要求       10 条                       ← 本文件用这个
#   jd_requirements_all10.md 表尾写 11             ← 重复计数,见 count.count_note
#
# 每一跳都可回查:
#   citation ──requirement──→ requirement_library.yaml 的一个 id
#            ──value──────→ 这份 JD 的阈值
#            ──verbatim───→ 原文的精确片段
#            ──source_text→ 原文整句
#            ──txt_line───→ source_text 文件里的行号(不是 Word 行号)

