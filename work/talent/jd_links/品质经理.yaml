excluded:

  - id: X-01
    candidate_text: IATF16949
    found_at: source_text 第 31 行,「岗位职责」段
    why: |
      ABox 的 `:role_品质经理 :requiresSkill :skill_ISO_TS16949` 会让 111 人被蕴含。
      但 IATF16949 只出现在**岗位职责**段:「依IATF16949制定和完善品质管理制度」。
      那是**公司要做的事**,不是**候选人必须具备的条件**。
    verdict: 不应作为任职资格要求
    action_pending: 建议从 :role_品质经理 的 :requiresSkill 里撤掉;撤掉后 matches_品质经理 会从 111 变少
    note: |
      这和 `skill_薪酬绩效` 从副总助理职责里的「督办各部门 KPI」被抽出,是同一类错误:
      **职责段被当成任职资格段**。本文件把它排除在 requirements 之外;
      ABox 里那条还在,因为改 ABox 要重跑推理与材料化,那是另一个动作。

