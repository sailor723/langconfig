validation:
  - id: J-G1
    rule: 每条 verbatim 必须是 source_text 的逐字子串
    why: C-G3 的实形。它抓的是"要求被改写/被编造",而不是"词表不对"。
  - id: J-G2
    rule: 原子要求条数必须等于逐行拆分后的实际条数
    why: 9 / 10 / 11 三个数并存过,这类计数必须由文件自己声明并核。
  - id: J-G3
    rule: 被排除的条目必须写明 found_at(行号 + 段落)
    why: 排除也要可回查,否则下一次又会被抽回来。
