count:
  source_section: 资格要求（第 4–7 行,4 行要求句）
  atomic_requirements: 9
  client_requirements: 9
  hr_requirements: 0
  count_note: 4 行切成 9 条:第 4 行用「;」带了两个主语(年限+领域 / 新产品流程),拆 2 条并再拆出行业认知(见 C-02);第 5 行用「,」带三个素质词(抗压 / 积极向上
    / 工作细心谨慎),拆 3 条;第 6 行「电线加工设备:裁线机、端子机、自动机、注塑机、点胶机」是一句复合要求,库内 REQ-D-WIRE-EQUIPMENT 已按 5 个组件建模,按 1 条登记;第
    7 行「CAD二维制图、办公软件操作熟练」两个不同能力,拆 2 条。合计 8 条客户要求 + 1 条行业认知拆分 = 9。**HR 侧 0 条**:品质经理那 5 条 HR 侧要求是 2026-11-20
    经 admin 签字的一批,不能照抄到这份 JD 上 —— 没有发生的签署不许写进来(同 业务跟单 的先例)。
