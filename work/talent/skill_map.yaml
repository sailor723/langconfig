# skill_map.yaml — 东莞线束/连接器制造业 · 样本技能词表（草稿 v0.1）
#
# 生成方式：先抽取、后概括。
#   来源是 client/team-4/unzipped/职务说明书10份 的【资格要求】段，共 10 份 JD。
#   每一行都必须有 evidence：哪份 JD、原话是什么。没有出处的行不许进表。
#
# kind 的取值（决定评分怎么算，见 work/talent/grill.md D8/D9）：
#   capability  —— 能力，可部分满足（会一点算一点）
#   product     —— 具体产品/软件名，值类型是"会不会"
#   equipment   —— 设备操作，和 product 分开，不能同权
#   composite   —— 一句话里的复合要求，评分时算【一个】要求项，内部可部分满足
#   soft        —— 素质，扫描简历读不出来 → 声明为【不可评】，不给 0 分
#   compliance  —— 资质/合规，读不出来 → 不可评，需人工或证明文件
#
# 尚未覆盖的部分见文件末尾 `gaps:` —— 明确写出"这 10 份 JD 没告诉我什么"。

version: 0.1
scope: 东莞 · 线束/连接器制造业
derived_from: client/team-4/unzipped/职务说明书10份
external_backbone:            # 只用来补齐与背书，不用来定义
  - ESCO          # SKOS 本体形态，无中文
  - ONET          # Tools & Technology 才是产品名的家
  - MOHRSS        # 人社部体系，对客解释用

categories:

  # ── 质量体系：制造业第一道硬门槛，且 ESCO/O*NET 都没有对应词汇 ──
  QualityMethod:
    label: 质量方法与体系
    evidence_sources: [品质经理]
    skills:
      - {name: QC七大手法, kind: capability,
         evidence: {jd: 品质经理, quote: "懂QC七大手法、5WHY、SPC、CPK、6S工具"}}
      - {name: 5WHY, kind: capability,
         evidence: {jd: 品质经理, quote: "懂QC七大手法、5WHY、SPC、CPK、6S工具"}}
      - {name: SPC, kind: capability,
         evidence: {jd: 品质经理, quote: "懂QC七大手法、5WHY、SPC、CPK、6S工具"}}
      - {name: CPK, kind: capability,
         evidence: {jd: 品质经理, quote: "懂QC七大手法、5WHY、SPC、CPK、6S工具"}}
      - {name: 6S, kind: capability, aliases: [5S, 七S],
         evidence: {jd: 品质经理, quote: "…6S工具"},
         note: "现有词表写的是 5s\\b，漏掉 6S —— 制造业从 5S 升到 6S 是常识，词表停在旧版"}
      - {name: 8D报告, kind: capability,
         evidence: {jd: 品质经理, quote: "具备独立书写英文8D报告的能力"}}
      - {name: 客户验厂, kind: capability,
         evidence: {jd: 品质经理, quote: "具备接待客户验厂经验"}}
      - {name: 品质问题分析, kind: capability,
         evidence: {jd: 品质经理, quote: "具备品质问题分析、改善的能力"}}

  # ── 行业工艺：客户口中的"懂行" ──
  HarnessCraft:
    label: 线束/连接器工艺
    evidence_sources: [品质经理, 专案工程师, 工程文员]
    skills:
      - {name: 线束行业知识, kind: capability,
         evidence: {jd: 品质经理, quote: "3年以上品质管理工作经验，熟识线束行业相关产品"}}
      - {name: 电线连接器产品开发, kind: capability,
         evidence: {jd: 专案工程师, quote: "电线连接器加工行业产品开发3年以上经验"}}
      - {name: 端子, kind: capability,
         evidence: {jd: 工程文员, quote: "能识别图纸基本信息：线材规格、端子型号、胶壳料号、回路标识等"}}
      - {name: 铆压, kind: capability,
         evidence: {jd: 专案工程师, quote: "负责将未制作铆压标准的端子进行样品及切片安排"}}
      - {name: 切片, kind: capability,
         evidence: {jd: 专案工程师, quote: "…端子进行样品及切片安排"}}
      - {name: 色环, kind: capability,
         evidence: {jd: 专案工程师, quote: "AI提取线材/端子/色环参数"}}
      - {name: 识图, kind: composite,
         evidence: {jd: 工程文员, quote: "能识别图纸基本信息：线材规格、端子型号、胶壳料号、回路标识等"},
         parts: [线材规格, 端子型号, 胶壳料号, 回路标识],
         note: "一句复合要求，评分时算一个要求项"}

  # ── 设备操作：O*NET 管它叫 Tools & Technology，不是 Skills ──
  WireEquipment:
    label: 电线加工设备
    evidence_sources: [专案工程师]
    skills:
      - {name: 电线加工设备操作, kind: composite,
         evidence: {jd: 专案工程师,
                    quote: "对电线加工设备：裁线机、端子机、自动机、注塑机、点胶机等功能熟知并有一定的操作能力"},
         parts: [裁线机, 端子机, 自动机, 注塑机, 点胶机],
         note: "一句复合要求。另：设备类与"会不会用某软件"不同权，见 kind 说明"}

  # ── 工程软件（product）──
  EngineeringCAD:
    label: 工程制图软件
    external: {onet_tt: "Computer aided design CAD software", esco_hint: "use CAD"}
    evidence_sources: [专案工程师]
    skills:
      - {name: CAD二维制图, kind: capability,
         evidence: {jd: 专案工程师, quote: "CAD二维制图、办公软件操作熟练"},
         note: "现有词表靠正则 [^a-z]cad[^a-z] 碰巧抽中；换成"二维绘图""制图软件"就漏。这是巧合覆盖"}
      - {name: AutoCAD, kind: product, alias_of: [CAD二维制图],
         evidence: {jd: 专案工程师, derived: "CAD二维制图 的具体产品化"}, external: {onet_tt: "Autodesk AutoCAD"}}
      - {name: SolidWorks, kind: product, external: {onet_tt: "Dassault Systemes SolidWorks"}}
      - {name: ProE/Creo, kind: product}
      - {name: CATIA, kind: product}
      - {name: UG/NX, kind: product}
      - {name: Rhino, kind: product}

  # ── 信息系统（product）──
  BusinessSystem:
    label: 业务/生产信息系统
    evidence_sources: [业务跟单, 人资专员]
    skills:
      - {name: ERP, kind: product,
         evidence: {jd: 业务跟单, quote: "熟悉ERP系统操作"}}
      - {name: ERP订单管理模块, kind: capability, alias_of: [ERP],
         evidence: {jd: 业务跟单, quote: "熟练使用ERP订单管理模块及Excel数据分析"}}
      - {name: 考勤系统, kind: product,
         evidence: {jd: 人资专员, quote: "熟练使用办公软件以及考勤系统"}}
      - {name: SAP, kind: product, note: "本批 10 份 JD 未点名，沿用旧词表，保留待证实"}
      - {name: MES, kind: product, note: "**无出处，未验证** —— 线束厂通常有，但这份语料没写。先禁用"}

  # ── 办公工具（product）──
  OfficeTool:
    label: 办公软件
    evidence_sources: [副总助理, 业务助理, 关务报关员, 招聘专员, 管理课长, 工程文员, 业务跟单]
    skills:
      - {name: Office办公软件, kind: composite,
         evidence: {jd: 副总助理, quote: "熟练掌握Office办公软件（Word/ Excel/ PPT/ AI）"},
         parts: [Word, Excel, PowerPoint, AI工具],
         note: "**这就是"副总助理 0 人"的根源**：一句复合要求被旧管线拍平成 4 个合取项"}
      - {name: Excel, kind: product,
         evidence: {jd: 业务跟单, quote: "熟练使用ERP订单管理模块及Excel数据分析"}}
      - {name: Word, kind: product,
         evidence: {jd: 工程文员, quote: "熟练：Excel、Word、ppt等办公软件"}}
      - {name: PowerPoint, kind: product, aliases: [PPT],
         evidence: {jd: 工程文员, quote: "熟练：Excel、Word、ppt等办公软件"}}
      - {name: AI工具, kind: product,
         evidence: {jd: 副总助理, quote: "熟练掌握Office办公软件（Word/ Excel/ PPT/ AI）"},
         also_in: [工程文员],
         note: "2020 年的制造业词表不会有这个词 —— 词表必须可增补"}
      - {name: 办公室网络, kind: capability,
         evidence: {jd: 管理课长, quote: "熟悉OFFICE软件、办公室网络"}}

  # ── 贸易关务 ──
  TradeCustoms:
    label: 贸易与关务
    evidence_sources: [关务报关员, 业务助理]
    skills:
      - {name: 进出口报关流程, kind: capability,
         evidence: {jd: 关务报关员, quote: "熟悉进出口报关流程，5年以上关务操作经验"}}
      - {name: 报关, kind: capability, alias_of: [进出口报关流程]}
      - {name: 单证, kind: capability, note: "本批 JD 未点名，旧词表保留"}
      - {name: 外贸业务, kind: capability,
         evidence: {jd: 业务助理, quote: "市场营销、外语外贸、销售等专业者优先考虑"}}

  # ── 人力行政 ──
  HRAdmin:
    label: 人力与行政
    evidence_sources: [人资专员, 招聘专员, 管理课长]
    skills:
      - {name: 招聘, kind: capability,
         evidence: {jd: 招聘专员, quote: "熟练使用相关办公软件，具备基本的招聘技巧及熟悉通常的招聘渠道"}}
      - {name: 招聘渠道, kind: capability, alias_of: [招聘],
         evidence: {jd: 招聘专员, quote: "熟悉通常的招聘渠道"}}
      - {name: 社保操作, kind: capability,
         evidence: {jd: 人资专员, quote: "熟悉社会保险（增/减/补缴）等操作流程"}}
      - {name: 劳动法, kind: capability, aliases: [国家相关法律政策],
         evidence: {jd: 人资专员, quote: "熟悉国家相关法律政策，熟悉社会保险（增/减/补缴）等操作流程"},
         note: "CV 里多半写"法律政策"，旧词表只认"劳动法"，会漏"}
      - {name: 薪酬绩效, kind: capability, note: "**本批 JD 未在资格段点名** —— 旧表把它记成副总助理的要求，实为从岗位职责"监督…KPI"误抓。应删"}

  # ── 通用能力 ──
  GeneralCapability:
    label: 通用能力
    evidence_sources: [业务跟单, 人资专员, 关务报关员, 管理课长, 副总助理]
    skills:
      - {name: 数据分析, kind: capability, aliases: [数据统计分析, 数据分据],
         evidence: {jd: 人资专员, quote: "具备很好的数据统计分析能力"},
         also_in: [管理课长, 副总助理, 关务报关员],
         note: "管理课长 JD 原文写的是"数据分**据**能力" —— 错别字。别名层要能吃脏"}
      - {name: 订单交期风险评估, kind: capability,
         evidence: {jd: 业务跟单, quote: "具备订单交期风险评估能力"}}
      - {name: 报表能力, kind: capability,
         evidence: {jd: 关务报关员, quote: "具备良好的执行力、沟通能力、日报/周报/月报整理能力"}}
      - {name: 英语, kind: capability,
         evidence: {jd: 品质经理, quote: "英语口语熟练及具备独立书写英文8D报告的能力"}}
      - {name: 培训课程开发, kind: capability,
         evidence: {jd: 管理课长, quote: "数据分据能力、培训课程开发能力、体系管理能力、系统规划能力、企业文化建设能力"}}
      - {name: 体系管理, kind: capability,
         evidence: {jd: 管理课长, quote: "…体系管理能力…"}}
      - {name: 系统规划, kind: capability,
         evidence: {jd: 管理课长, quote: "…系统规划能力…"}}
      - {name: 企业文化建设, kind: capability,
         evidence: {jd: 管理课长, quote: "…企业文化建设能力"}}

  # ── 素质：声明为不可评，不给 0 分 ──
  SoftSkill:
    label: 素质（扫描简历读不出 → 不可评）
    assessable: false
    evidence_sources: [业务跟单, 业务助理, 副总助理, 专案工程师, 工程文员, 人资专员, 招聘专员]
    skills:
      - {name: 抗压能力, kind: soft, evidence: {jd: 业务跟单, quote: "抗压能力强，可同时处理多线程任务"}}
      - {name: 沟通协调, kind: soft, evidence: {jd: 业务助理, quote: "具备良好的沟通协调能力和团队合作精神"}}
      - {name: 责任心, kind: soft, evidence: {jd: 招聘专员, quote: "责任心强、细心、稳重"}}
      - {name: 商务礼仪, kind: soft, evidence: {jd: 业务助理, quote: "具备基本商务礼仪知识"}}
      - {name: 数据敏感, kind: soft, evidence: {jd: 副总助理, quote: "沟通能力好、执行能力强、逻辑清晰、数据敏感"}}
      - {name: 保密意识, kind: soft, evidence: {jd: 业务跟单, quote: "合规：严守数据保密制度，无客户信息泄露记录"}}

  # ── 合规资质：读不出来，需证明文件 ──
  Compliance:
    label: 合规与资质（不可评，需证明文件）
    assessable: false
    evidence_sources: [关务报关员, 业务跟单]
    skills:
      - {name: 贸易安全合规考核, kind: compliance,
         evidence: {jd: 关务报关员, quote: "通过基础贸易安全合规培训考核，无海关行政处罚、犯罪记录"}}
      - {name: 数据保密制度, kind: compliance,
         evidence: {jd: 业务跟单, quote: "严守数据保密制度，无客户信息泄露记录"}}

# ══════════════════════════════════════════════════════════════════════
# gaps：这 10 份 JD **没告诉我**的东西。不许用想象填。
# ══════════════════════════════════════════════════════════════════════
gaps:
  # 1) 部门覆盖偏斜 —— 这是最严重的
  - issue: 10 份 JD 只覆盖 副总室 / 技术课 / 业务课 / 管理科 / 品保(品质经理) / 人事 / 关务
    missing_departments: [生产/制造课, 品保课(一线QC), 仓储物流, 模具课, 设备维护, 采购, 财务]
    why_it_matters: >
      线束厂人最多的恰恰是生产、品保一线、仓储、模具。若词表只从这 10 份长出来，
      长成的是"人事视角的制造业"，不是"制造业"。
  # 2) 学历/专业门槛未纳入词表
  - issue: 专业要求（机电一体化/电子技术/自动化/工业工程/机械工程）出现在品质经理 JD，但当前系统只有 education_rank，没有 major
  # 3) 行业标准未出现
  - issue: 旧词表有 ISO9001 / ISO-TS16949，但 10 份 JD 一份都没点名
    action: 保留但标注"无本批出处"；若要主张，需找到客户的质量体系文件
  # 4) 语言只覆盖中英
  - issue: 品质经理 JD 要"独立书写英文8D报告" —— 这是【英语写作】而非"英语"，粒度比词表细
  # 5) 无一名 JD 给出技能等级
  - issue: 全部是"熟练/熟悉/具备/了解"这类无刻度词
    action: 不可自行发明 1-5 级；如需分级，必须让客户定义
