jd: 品质经理
interview_target:
  n: 30
  decided_by: admin
  decided_at: '2026-11-21'
  why: 初筛保留人数太多,第 3 步要给出可执行的面试批次
interview_priorities:
  decided_by: admin
  decided_at: '2026-11-22'
  criteria:
  - id: P-QUALITY-EVIDENCE
    name: 品质岗经历有硬证据
    rule:
      kind: quality_verdict
      in_:
      - 有
    why: 岗位第一要求是做过品质管理,这条最硬
    caveat: 全库只有个位数,选中后名单会很短
  - id: P-IND-HARNESS
    name: 线束/连接器行业
    rule:
      kind: component_any
      components:
      - skill_线束行业知识
    why: 客户原文「熟识线束行业相关产品」(C-06)
    caveat: 简历词表较窄,可能漏人(DEF-01)
