# 品质经理 · 按公司标准 JD 模板（40 字段）逐格定稿草稿
#
# 每一格的规矩：
#   state: 客户原文     → 必须有 cites（引用 id），脚本会核对引用真实存在、原文一并带出
#   state: HR 侧        → 必须有 cites，且该引用 origin=hr（我方 HR 提，客户稿里没有）
#   state: 原文·空值    → 客户写了栏目但值是空的（脚本核对确实为空）
#   state: 我方建议·待确认 → 必须有 why（为什么这么建议）+ needs（谁确认）
#   state: 待客户给     → 必须写缺什么（不可判时，判定里就是「不可判」，不是「不满足」）
#   state: 不适用       → 只能是条件字段，且岗位类别不触发
#
# 一句话：**不许编客户没给的值**。要补就写成「我方建议·待确认」，并且说清谁来确认。

jd: 品质经理
template: templates/standard_jd_template.yaml
role_type: staff
role_basis: 原文第 17 行「直接下属　无」→ 员工岗；岗位名带「经理」不作数
source: work/talent/jd_links/_source/品质经理.txt（客户 .doc 抽平，109 行）

overrides:
  # ── S1 岗位标识 ────────────────────────────────────────────────
  F.JOB_TITLE:
    state: 客户原文
    value: 品质经理
    quote: 文件名称品质经理职务说明书
    line: 14
    why: 抬头「职务名称　品质经理」+「文件名称　品质经理职务说明书」
  F.MGMT_CATEGORY:
    state: 客户原文
    value: 员工岗
    quote: 直接下属无
    line: 17
    why: 原文第 17 行「直接下属　无」—— 这是唯一判据（本仓库 DEF：不按岗位名判）
    confirmed: false
  F.DEPARTMENT:
    state: 客户原文
    value: 品保课
    quote: 隶属部门品保课
    line: 17
    why: 抬头「隶属部门　品保课」
  F.REPORTS_TO:
    state: 待客户给
    why: 原文第 17 行有「直接上司」这一栏，但值是空的 —— 客户划了框没填，不猜
    needs: 客户（组织架构：向厂长还是品保部主管汇报）
  F.SUPERVISES:
    state: 客户原文
    value: 无
    quote: 直接下属无
    line: 17
    why: 抬头「直接下属　无」
  F.JD_JOB_GRADE:
    state: 待客户给
    why: 客户稿没有职级；职级决定定薪与审批链，不能按「经理」二字推断
    needs: 客户（职级序列，如 M1/课级）

  # ── S2 岗位目的 ────────────────────────────────────────────────
  F.JD_JOB_PURPOSE:
    state: 我方建议·待确认
    value: 以 IATF16949 体系为准，管住进料—制程—出货品质与客户验厂，对部门品质目标（KPI）负责
    why: 由客户 8 条职责与「为上级、客户下达的品质任务负责」归纳；客户稿没有"岗位目的"这一栏
    needs: 业务（用人部门主管）
  F.JD_SUCCESS_CRITERIA:
    state: 我方建议·待确认
    value: ①客户验厂一次通过 ②客诉/退货件数下降 ③周报月报按时且制程异常闭环
    why: 客户只写「保质保量完成…品质任务」，没有可量化指标；这三条按本厂品质岗的实际考核口径提
    needs: 客户（KPI 口径与目标值）

  # ── S3 任职资格 ────────────────────────────────────────────────
  F.AGE:
    state: 客户原文
    value: 25~40 岁
    cites: [C-01]
  F.GENDER:
    state: 我方建议·待确认
    value: （留空，不设限）
    why: 客户未写性别；本岗无法律依据或客观必要（非涉密、非更衣岗），留空=不筛
    needs: 我方（默认留空，无需确认）
  F.EDU_LEVEL:
    state: 客户原文
    value: 大专及以上
    cites: [C-02]
  F.EDU_MAJOR:
    state: 客户原文
    value: 机电一体化 / 电子技术 / 自动化 / 工业工程 / 机械工程 等工程类
    cites: [C-03]
    why: 原文含「等」→ 开区间，判定时不做闭集匹配（DEF-04）
  F.EDU_FULLTIME:
    state: 不适用
    why: 条件字段（客户写了全日制才启用）；客户稿未提全日制
  F.EXP_YEARS:
    state: 客户原文
    value: 3 年以上
    cites: [C-05]
  F.EXP_DOMAIN:
    state: 客户原文
    value: 品质管理（线束/连接器行业优先，见能力要求）
    cites: [C-05, C-06]
  F.SKILL:
    state: 客户原文
    value: >-
      ① 线束行业相关产品认知；② 品质问题分析与改善；③ QC七大手法 / 5WHY / SPC / CPK / 6S；
      ④ 客户验厂接待经验
    cites: [C-06, C-07, C-08, C-09]
    why: 四组能力分别对应 component_catalog 的组件：线束行业知识、品质问题分析、品质工具、客户验厂
  F.CERTIFICATION:
    state: 我方建议·待确认
    value: （建议）IATF16949 内审员证 —— 作为加分项，不作硬门槛
    why: 客户未写证书要求；但本岗第一职责是「依 IATF16949 制定品质制度」，有证更好
    needs: 客户（是否列为硬门槛）
  F.LANGUAGE_LEVEL:
    state: 客户原文
    value: 口语：熟练；书面：能独立书写英文 8D 报告
    cites: [C-04]
    why: 原文一句里两件事，按模板要求拆成两档（口语/书面）
  F.COMPETENCY:
    state: 客户原文
    value: 良好的沟通、协调能力
    cites: [C-10]
    why: 列名但不判（素质类没有数据项，对所有人「不可判」）

  # ── S4 岗位职责 ────────────────────────────────────────────────
  F.JD_DUTY_ITEMS:
    state: 客户原文
    value: >-
      1. 负责部门品质目标管理工作，保质保量完成上级、客户下达的各项品质管理任务；
      2. 依 IATF16949 制定和完善品质管理制度；
      3. 完善各类质量标准、培训资料，并对相关人员进行考核；
      4. 监督检查相关人员遵守标准，执行各项质量标准（含 SIP），达成目标；
      5. 检测仪器效验、参与设备、模治具验收；
      6. 每日收集品质、产能、异常数据，不断优化、提升、PDCA，完成周报、月报；
      7. 接待客户、承接客户品质要求，完成相关报告；
      8. 供应商品质管理。
    quote: 负责部门品质目标管理工作，保质保量完成上级、客户下达的各项品质管理任务
    line: 29
    why: 客户原文「岗位职责」8 条逐字（第 29–37 行），编号 1/2 原文缺失，按顺序补
  F.DECISION_AUTHORITY:
    state: 不适用
    why: 经理岗条件字段；本岗按原文判员工岗（直接下属无）
  F.BUDGET_OWNERSHIP:
    state: 不适用
    why: 经理岗条件字段；本岗按原文判员工岗
  F.CROSS_DEPT:
    state: 不适用
    why: 经理岗条件字段；本岗按原文判员工岗

  # ── S5 作业明细 ────────────────────────────────────────────────
  F.JD_ACTIVITY_TEXT:
    state: 原文·空值
    table: 事务表述
    why: 原文有「事务表述」表头（第 39–47 行），表体全空 —— 客户划了表没填
    needs: 客户（这张表就是岗位的日常动作清单，缺了只能靠职责反推）
  F.JD_ACTIVITY_FREQ:
    state: 原文·空值
    table: 事务表述
    why: 同上表（每日/每周/每月/偶发四列），一行都没填
    needs: 客户

  # ── S6 工作条件（员工岗，条件字段全部激活）──────────────────────
  F.SHIFT:
    state: 我方建议·待确认
    value: 常白班为主；产线两班倒时需跟班（客户验厂、异常处理）
    why: 客户稿没有班制；本厂产线是两班倒，品质岗不可能完全不跟班
    needs: 客户（跟班频次与是否付班次津贴）
  F.JD_ENVIRONMENT:
    state: 我方建议·待确认
    value: 办公室 + 车间（噪音、粉尘、胶水/助焊剂气味，需现场确认强度）
    why: 线束加工车间有压接/浸锡/注塑工序；客户稿未写
    needs: 客户（现场实测：噪音分贝、是否需通风柜）
  F.JD_PHYSICAL_DEMAND:
    state: 我方建议·待确认
    value: 车间巡检需站立走动；无重物搬运要求
    why: 品质岗以巡检/抽检为主，不同于一线操作岗
    needs: 客户
  F.JD_PPE:
    state: 我方建议·待确认
    value: 进车间佩戴护目镜与静电手环；浸锡区必要时耳塞
    why: 线束厂常规劳保配置
    needs: 客户（劳保由厂方提供还是自带）
  F.JD_WORK_LOCATION:
    state: 待客户给
    why: 客户 10 份 JD 全没写厂区/镇区；这也是 HR-05「通勤」闸门无法取值的直接原因
    needs: 客户（具体厂区地址；是否提供宿舍/班车）

  # ── S7 元数据 ─────────────────────────────────────────────────
  F.JD_HEADCOUNT:
    state: 待客户确认
    why: 客户未写编制；建议 1 人
    needs: 客户
  F.AVAILABILITY:
    state: HR 侧
    value: 到岗周期 ≤ 4 周
    cites: [HR-01]
    why: 交接期超过一个月，岗位空太久
  F.SALARY:
    state: 待客户给
    why: HR-04 明确「缺取值」：客户 JD 没写薪资预算 → 判定里记「不可判」，不许拿候选人期望当门槛
    needs: 客户（薪资区间与预算上限）
  F.AVG_TENURE:
    state: HR 侧
    value: 平均在职 ≥ 2 年
    cites: [HR-03]
    why: 平均每段不到 2 年，说明每份工作都待不住
  F.RECENT_SEGMENTS:
    state: HR 侧
    value: 近 5 年任职 ≤ 3 家
    cites: [HR-02]
    why: 近 5 年换过 3 家以上，业务方一般直接视为不稳定
  F.COMMUTE:
    state: 待客户给
    why: HR-05「缺取值」：工作地点还没定 → 通勤门槛无法定，判定记「不可判」
    needs: 客户（工作地点，见 F.JD_WORK_LOCATION）
  F.JD_HIRING_REASON:
    state: 待客户确认
    why: 客户未说明是新增还是替补；这决定能不能放宽年限
    needs: 客户

  # ── S8 合规声明 ────────────────────────────────────────────────
  F.CLEARANCE:
    state: 我方建议·待确认
    value: 入职前背调（无犯罪记录 + 学历核验）；取得前一律记「未知」，不算「不满足」
    why: 客户未提背调；按公司惯例品质岗需背调
    needs: 客户（是否做背调、谁承担）
  F.JD_CONFIDENTIALITY:
    state: 我方建议·待确认
    value: 需签保密协议（接触客户图纸、BOM、体系文件与验厂资料）
    why: 客户未写；本岗直接对外承接客户品质要求并接触客户图纸
    needs: 客户
  F.JD_CONTRACT_TYPE:
    state: 我方建议·待确认
    value: 全职（劳动合同制）
    why: 客户未写用工类型；本岗为全职岗
    needs: 客户
