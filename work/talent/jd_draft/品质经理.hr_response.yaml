_doc: HR 对「AI 模拟」格子的逐格回复（**模拟**，bar 上没签字）。 accept=按模拟的来 / change=改成 HR 的口径 / reject=不写进 JD。 重跑 draft_jd 后这些格子状态变成「HR
  模拟确认（未签字）」。
jd: 品质经理
stage: hr-response-mock
reviewed_by: HR（模拟）
signed: false
responses:
  F.REPORTS_TO:
    decision: change
    value: 厂长
    note: 品保课直接向厂长汇报（品保部目前空缺）
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_JOB_GRADE:
    decision: change
    value: E3（资深员工）
    note: 品质经理原文直接下属为「无」，按员工岗资深档 E3，不套 M 序列
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_JOB_PURPOSE:
    decision: accept
    value: 以 IATF16949 体系为准，管住进料—制程—出货品质与客户验厂，对部门品质目标（KPI）负责
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_SUCCESS_CRITERIA:
    decision: accept
    value: ①客户验厂一次通过 ②客诉/退货件数下降 ③周报月报按时且制程异常闭环
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.GENDER:
    decision: reject
    value: （不写）
    note: 公司口径：除涉密/更衣岗外不设性别门槛，这一格不写进 JD
    by: HR（模拟）
    basis: hr_response_mock
  F.CERTIFICATION:
    decision: accept
    value: （建议）IATF16949 内审员证 —— 作为加分项，不作硬门槛
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.SHIFT:
    decision: accept
    value: 常白班为主；产线两班倒时需跟班（客户验厂、异常处理）
    note: 品质岗随产线跟班，常白班为主
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_ENVIRONMENT:
    decision: accept
    value: 办公室 + 车间（噪音、粉尘、胶水/助焊剂气味，需现场确认强度）
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_PHYSICAL_DEMAND:
    decision: accept
    value: 车间巡检需站立走动；无重物搬运要求
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_PPE:
    decision: accept
    value: 进车间佩戴护目镜与静电手环；浸锡区必要时耳塞
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_WORK_LOCATION:
    decision: accept
    value: 东莞厂区（具体镇区待客户给；有宿舍与厂车）
    note: 同意按此执行
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_HEADCOUNT:
    decision: accept
    value: 1 人
    note: 确实补 1 人
    by: HR（模拟）
    basis: hr_response_mock
  F.SALARY:
    decision: change
    value: 10~15K，预算上限 15K
    note: 按今年品质岗预算上调 1K；上限 15K 是硬顶，超了走特批
    by: HR（模拟）
    basis: hr_response_mock
  F.COMMUTE:
    decision: change
    value: 单程 ≤ 90 分钟（有厂车）
    note: 厂车覆盖东莞全域，90 分钟内都算可接受；跨市不考虑
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_HIRING_REASON:
    decision: accept
    value: 替补（原任离职）
    note: 原任已于上月离职，属替补
    by: HR（模拟）
    basis: hr_response_mock
  F.CLEARANCE:
    decision: accept
    value: 入职前背调（无犯罪记录 + 学历核验）；取得前一律记「未知」，不算「不满足」
    note: 敏感岗统一做背调（无犯罪 + 学历）
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_CONFIDENTIALITY:
    decision: accept
    value: 需签保密协议（接触客户图纸、BOM、体系文件与验厂资料）
    note: 接触客户图纸，必须签保密协议
    by: HR（模拟）
    basis: hr_response_mock
  F.JD_CONTRACT_TYPE:
    decision: accept
    value: 全职（劳动合同制）
    note: 全职劳动合同
    by: HR（模拟）
    basis: hr_response_mock
