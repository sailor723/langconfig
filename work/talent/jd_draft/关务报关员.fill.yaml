_doc: '# 关务报关员 · 自动生成填充稿（引用 + 文本兜底 + 公司画像 mock）

  #

  # 生成器：scripts/talent/mock_fill_jd.py（--force 才覆盖手改）。

  # 来源优先级：jd_links 逐字引用 → Phase 1 文本规则/兜底 → company_profile.yaml 的默认口径。

  # 标 basis: mock 的格子**客户确认前不进判定**。

  '
jd: 关务报关员
role_type: staff
counts:
  cite: 9
  text: 8
  mock: 20
overrides:
  F.JOB_TITLE:
    state: 客户原文
    value: 关务报关员
    why: 取文件名/抬头
    basis: text-rule
  F.MGMT_CATEGORY:
    state: 客户原文
    value: 员工岗
    why: 原文「直接下属」栏 → 员工岗
    basis: text-rule
  F.DEPARTMENT:
    state: 原文·空值
    value: null
    why: 原文「隶属部门」栏为空
    basis: text-rule
    needs: 客户补（栏目在、值是空的）
  F.REPORTS_TO:
    state: 客户原文
    value: 副总经理
    why: '原文「直接上司：

      副总经理

      」'
    basis: text-rule
  F.SUPERVISES:
    state: 原文·空值
    value: null
    why: 原文有「直接下属」栏但值是空的
    basis: text-rule
    needs: 客户补（栏目在、值是空的）
  F.JD_JOB_GRADE:
    state: 我方建议·待确认
    basis: mock
    value: E2（员工）
    why: 客户稿没有职级；按 员工岗 台阶套档
    needs: 客户/HR 确认
  F.JD_JOB_PURPOSE:
    state: 我方建议·待确认
    basis: mock
    value: 关务报关员：在该部门内承担该岗位的核心职责，按公司标准与客户要求交付结果。
    why: 客户稿没有岗位目的；按公司画像模板 + 部门名生成
    needs: 客户/HR 确认
  F.JD_SUCCESS_CRITERIA:
    state: 原文·空值
    value: null
    why: 原文只有「KPI」这个小标题，没有内容行
    basis: text-rule
    needs: 客户补（栏目在、值是空的）
  F.AGE:
    state: 客户原文
    value: 25~45
    cites:
    - 关务-01
  F.GENDER:
    state: 我方建议·待确认
    basis: mock
    value: （不设限）
    why: 客户未写性别；按公司口径不筛
    needs: 客户/HR 确认
  F.EDU_LEVEL:
    state: 客户原文
    value: '3'
    cites:
    - 关务-02
  F.EDU_MAJOR:
    state: 客户原文
    value: 国际贸易、物流
    cites:
    - 关务-03
  F.EDU_FULLTIME:
    state: 我方建议·待确认
    basis: mock
    value: 不限
    why: 客户未写全日制
    needs: 客户/HR 确认
  F.EXP_YEARS:
    state: 客户原文
    value: 5（关务操作）
    cites:
    - 关务-05
  F.EXP_DOMAIN:
    state: 客户原文
    value: 5（关务操作）
    cites:
    - 关务-05
  F.SKILL:
    state: 客户原文
    value: 熟悉进出口报关流程；日报/周报/月报整理能力；熟练掌握Office办公软件基本操作
    cites:
    - 关务-04
    - 关务-11
    - 关务-17
  F.CERTIFICATION:
    state: 客户原文
    value: 通过基础贸易安全合规培训考核
    cites:
    - 关务-06
  F.LANGUAGE_LEVEL:
    state: 我方建议·待确认
    basis: mock
    value: （未要求）
    why: 客户未写外语要求
    needs: 客户/HR 确认
  F.COMPETENCY:
    state: 客户原文
    value: 对数据细心敏感；具备良好的执行力；沟通能力；工作日事日毕
    cites:
    - 关务-08
    - 关务-09
    - 关务-10
    - 关务-12
  F.JD_DUTY_ITEMS:
    state: 我方建议·待确认
    basis: mock
    value: （待客户补）
    why: 客户稿没有这一项，也没有画像默认值
    needs: 客户/HR 确认
  F.DECISION_AUTHORITY:
    state: 不适用
    why: 条件字段（岗位类别=经理岗），本 JD 是员工岗
  F.BUDGET_OWNERSHIP:
    state: 不适用
    why: 条件字段（岗位类别=经理岗），本 JD 是员工岗
  F.CROSS_DEPT:
    state: 不适用
    why: 条件字段（岗位类别=经理岗），本 JD 是员工岗
  F.JD_ACTIVITY_TEXT:
    state: 客户原文
    value: 是否可以AI操作
    why: 原文「事务表述」表体 7 行
    basis: text-rule
  F.JD_ACTIVITY_FREQ:
    state: 客户原文
    value: 是否可以AI操作
    why: 原文「事务表述」表体 7 行
    basis: text-rule
  F.SHIFT:
    state: 我方建议·待确认
    basis: mock
    value: 生产两班倒；办公室常白班；品质/工程岗随产线跟班
    why: 客户稿没有班制；按公司画像（一线岗才触发）
    needs: 客户/HR 确认
  F.JD_ENVIRONMENT:
    state: 我方建议·待确认
    basis: mock
    value: 有噪音（压接/注塑）、少量粉尘与助焊剂气味；通风区域作业
    why: 客户稿没有作业环境；按公司画像
    needs: 客户/HR 确认
  F.JD_PHYSICAL_DEMAND:
    state: 我方建议·待确认
    basis: mock
    value: 巡检需站立走动；无重物搬运（≤10kg）
    why: 客户稿没有体力要求；按公司画像
    needs: 客户/HR 确认
  F.JD_PPE:
    state: 我方建议·待确认
    basis: mock
    value: 进车间护目镜 + 静电手环；浸锡/注塑区耳塞
    why: 客户稿没有劳保配置；按公司画像
    needs: 客户/HR 确认
  F.JD_WORK_LOCATION:
    state: 我方建议·待确认
    basis: mock
    value: ''
    why: 客户 10 份 JD 全没写厂区；按公司画像
    needs: 客户/HR 确认
  F.JD_HEADCOUNT:
    state: 我方建议·待确认
    basis: mock
    value: 1 人
    why: 按公司画像编制口径（一个课/岗原则配 1 人，产线岗按编制）
    needs: 客户/HR 确认
  F.AVAILABILITY:
    state: 我方建议·待确认
    basis: mock
    value: ≤ 4 周
    why: 客户没给到岗周期；按 4 周上限
    needs: 客户/HR 确认
  F.SALARY:
    state: 我方建议·待确认
    basis: mock
    value: 8~12K，预算上限 12K
    why: 客户没给预算；按公司画像挂牌区间（判定前须换成客户真实预算）
    needs: 客户/HR 确认
  F.AVG_TENURE:
    state: 我方建议·待确认
    basis: mock
    value: ≥ 2 年
    why: HR 闸门；按「平均在职不低于 2 年」
    needs: 客户/HR 确认
  F.RECENT_SEGMENTS:
    state: 我方建议·待确认
    basis: mock
    value: 近 5 年 ≤ 3 家
    why: HR 闸门；按「近 5 年不超过 3 家」
    needs: 客户/HR 确认
  F.COMMUTE:
    state: 我方建议·待确认
    basis: mock
    value: 单程 ≤ 60 分钟（有厂车）
    why: HR 闸门缺取值；按「有厂车、单程一小时」
    needs: 客户/HR 确认
  F.JD_HIRING_REASON:
    state: 我方建议·待确认
    basis: mock
    value: 替补（原任离职）
    why: 客户未说明；按公司画像的替补优先口径
    needs: 客户/HR 确认
  F.CLEARANCE:
    state: 客户原文
    value: 无海关行政处罚、犯罪记录
    cites:
    - 关务-07
  F.JD_CONFIDENTIALITY:
    state: 我方建议·待确认
    basis: mock
    value: 接触客户图纸/BOM/体系文件的岗位签保密协议；竞业仅在涉密核心岗谈
    why: 客户未提保密；按公司画像
    needs: 客户/HR 确认
  F.JD_CONTRACT_TYPE:
    state: 我方建议·待确认
    basis: mock
    value: 全职（劳动合同制）
    why: 客户未写用工类型；按公司画像
    needs: 客户/HR 确认
