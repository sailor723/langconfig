    why: 条件字段（岗位类别=经理岗），本 JD 是员工岗
  F.BUDGET_OWNERSHIP:
    state: 不适用
    why: 条件字段（岗位类别=经理岗），本 JD 是员工岗
  F.CROSS_DEPT:
