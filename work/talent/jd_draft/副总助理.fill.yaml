  F.JD_ACTIVITY_FREQ:
    state: 客户原文
    value: 内          容
    why: 原文「事务表述」表体 3 行
    basis: text-rule
  F.SHIFT:
    state: 我方建议·待确认
    basis: mock
    value: 生产两班倒；办公室常白班；品质/工程岗随产线跟班
    why: 客户稿没有班制；按公司画像（一线岗才触发）
    needs: 客户/HR 确认
  F.JD_ENVIRONMENT:
    state: 我方建议·待确认
    basis: mock
    value: 有噪音（压接/注塑）、少量粉尘与助焊剂气味；通风区域作业
    why: 客户稿没有作业环境；按公司画像
    needs: 客户/HR 确认
  F.JD_PHYSICAL_DEMAND:
    state: 我方建议·待确认
    basis: mock
    value: 巡检需站立走动；无重物搬运（≤10kg）
    why: 客户稿没有体力要求；按公司画像
    needs: 客户/HR 确认
  F.JD_PPE:
    state: 我方建议·待确认
    basis: mock
    value: 进车间护目镜 + 静电手环；浸锡/注塑区耳塞
    why: 客户稿没有劳保配置；按公司画像
    needs: 客户/HR 确认
  F.JD_WORK_LOCATION:
    state: 我方建议·待确认
    basis: mock
    value: ''
    why: 客户 10 份 JD 全没写厂区；按公司画像
    needs: 客户/HR 确认
  F.JD_HEADCOUNT:
    state: 我方建议·待确认
    basis: mock
    value: 1 人
    why: 按公司画像编制口径（一个课/岗原则配 1 人，产线岗按编制）
    needs: 客户/HR 确认
  F.AVAILABILITY:
    state: 我方建议·待确认
    basis: mock
    value: ≤ 4 周
    why: 客户没给到岗周期；按 4 周上限
    needs: 客户/HR 确认
  F.SALARY:
    state: 我方建议·待确认
    basis: mock
    value: 8~12K，预算上限 12K
    why: 客户没给预算；按公司画像挂牌区间（判定前须换成客户真实预算）
    needs: 客户/HR 确认
  F.AVG_TENURE:
    state: 我方建议·待确认
    basis: mock
    value: ≥ 2 年
    why: HR 闸门；按「平均在职不低于 2 年」
    needs: 客户/HR 确认
  F.RECENT_SEGMENTS:
    state: 我方建议·待确认
    basis: mock
    value: 近 5 年 ≤ 3 家
    why: HR 闸门；按「近 5 年不超过 3 家」
    needs: 客户/HR 确认
  F.COMMUTE:
    state: 我方建议·待确认
    basis: mock
    value: 单程 ≤ 60 分钟（有厂车）
    why: HR 闸门缺取值；按「有厂车、单程一小时」
    needs: 客户/HR 确认
  F.JD_HIRING_REASON:
    state: 我方建议·待确认
    basis: mock
    value: 替补（原任离职）
    why: 客户未说明；按公司画像的替补优先口径
    needs: 客户/HR 确认
  F.CLEARANCE:
    state: 我方建议·待确认
    basis: mock
    value: 品质/关务/财务等敏感岗做入职背调（无犯罪 + 学历核验）
    why: 客户未提背调；按公司画像（敏感岗背调）
    needs: 客户/HR 确认
  F.JD_CONFIDENTIALITY:
    state: 我方建议·待确认
    basis: mock
    value: 接触客户图纸/BOM/体系文件的岗位签保密协议；竞业仅在涉密核心岗谈
    why: 客户未提保密；按公司画像
    needs: 客户/HR 确认
  F.JD_CONTRACT_TYPE:
    state: 我方建议·待确认
    basis: mock
    value: 全职（劳动合同制）
    why: 客户未写用工类型；按公司画像
    needs: 客户/HR 确认
