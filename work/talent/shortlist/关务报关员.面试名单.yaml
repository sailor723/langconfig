rank_rule:
- ① 硬证据项数(可验证载体:系统/报告/客户审核/图表),多者优先
- ② 软证据项数(只能靠陈述的),多者优先
- ③ 用户选的业务优先条件命中数
- ④ 客户原文写的「优先」条款命中数(客户授权的排序依据)
- ⑤ 总年限(客户要求 2 年以上;读不出来排最后 —— 排序口径,不是不合格)
- ⑥ 稳定性:平均在职年限(从工作段算出,不是自述)
- ⑦ 待核项数(成本,不是优劣)
- ⑧ 品质岗经历(仅当本 JD 要求时)
- ⑨ sha256(候选人 id):确定性兜底,不按文件名/姓氏排
