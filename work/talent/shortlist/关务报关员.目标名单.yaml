jd: 关务报关员
step: 5 目标名单(基于一面数据)
pool:
  interview_list: 20
  with_interview: 20
target:
  min: 5
  max: 10
  asked_by: hr
interview_policy:
  mode: mock_allowed
  source: interview_policy.yaml · 关务报关员 · admin 2026-11-23
judgeable_requirements: 7
total_requirements: 17
rank_rule:
- ① 硬证据项数(可验证载体:系统/报告/客户审核/图表),多者优先
- ② 软证据项数(只能靠陈述的),多者优先
- ③ 用户选的业务优先条件命中数
- ④ 客户原文写的「优先」条款被判定满足的条数
- ⑤ 总年限(客户要求 X 年以上;读不出来排最后 —— 排序口径,不是不合格)
- ⑥ 稳定性:平均在职年限(从工作段算出,不是自述)
- ⑦ 待核项数(成本,不是优劣)
- ⑧ 品质岗经历(仅当本 JD 要求)
- ⑨ sha256(候选人 id):确定性兜底,不按文件名/姓氏排
evidence_note: 证据分层按「简历 ∪ 一面坐实」算;from_interview 里标了 from_interview_simulated 的那些是**模拟一面**给的,演练用
cut:
  target_min: 5
  target_max: 10
  position: 10
  tie_band: 1
  hash_decided: false
  note: 切线唯一 —— 名次可读
shortfall: 0
final:
  rule:
  - 硬门槛(A/B 类客户阈值 + HR 侧 5 条)0 条不满足
  - 至少 1 项硬证据(简历或一面坐实)
  - 未知 ≤3 条(再多就说明关键项还没读到)
  max: 5
  unknown_max: 3
  min_hard: 1
  ids:
