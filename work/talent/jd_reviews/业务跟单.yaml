- id: D-业务跟单-14
  kind: exclusion
  subject: X-12
  decision: excluded
  signoff: pending
  why: >-
    「事务表述」整张频次表（表头 39–45 行 + 表体 46–95 行 11 项）不作为任职资格：表体 11 项与职务简述
