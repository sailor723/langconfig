version: 2
scope: 东莞制造业 · 10 份职务说明书 × 270 份简历
measured: '2026-11-20'
principle: 字段集只有一份;JD 与 CV 是两个模板,各自裁剪。
sections:
  jd:
    S1: 岗位标识
    S2: 岗位目的
    S3: 任职资格
    S4: 岗位职责
    S5: 作业明细
    S6: 工作条件
    S7: 元数据
    S8: 合规声明
  cv:
    C1: 基本信息
    C2: 求职意向
    C3: 教育背景
    C4: 工作经历
    C5: 技能与证书
    C6: 其他
templates:
  jd:
    name: 职务说明书
    rule: 渲染 jd 非 null 的字段;其余标「JD 未写」
  cv:
    name: 候选人档案
    rule: 渲染 cv 非 null 的字段;其余标〔待补〕
totals:
  fields: 73
  both: 8
  not_comparable: 9
  jd_only: 41
  cv_only: 15
fields:
- id: F.AGE
  label: 年龄
  dimension: A
  scale: interval
  unit: 岁
  jd:
    section: S3
    presence: 4
    required: false
  cv:
    section: C1
    presence: 129
    prop: age
  compare: both
  note: JD 写区间;简历 47% 直述年龄、19% 写出生年月(可推算)。
- id: F.CERTIFICATION
  label: 资格证书
  dimension: F
  scale: nominal
  cardinality: set
  jd:
    section: S3
    presence: 1
    required: false
  cv:
    section: C5
    presence: 109
    prop: hasCertification
  compare: both
  note: 两侧都有:JD 提「合规培训考核」,简历 109/270 写内审员/CET 等。
- id: F.EDU_LEVEL
  label: 学历
  dimension: B
  scale: ordinal
  values:
    2: 中专/高中
    3: 大专
    4: 本科
    5: 硕士
    6: 博士
  jd:
    section: S3
    presence: 10
    required: true
  cv:
    section: C3
    presence: 179
    prop: education_rank
  compare: both
  note: JD 侧几乎必写门槛;简历侧 179/270 有标签,但需与院校逐段对应。
- id: F.EDU_MAJOR
  label: 专业
  dimension: B
  scale: nominal
  jd:
    section: S3
    presence: 6
    required: false
  cv:
    section: C3
    presence: 117
    prop: major
  compare: both
  note: JD 写「XX类专业」;简历 43% 写明。缺失时这条要求判不了 —— 不是不合格。
- id: F.EXP_ACTIVITY
  label: 活动经验
  dimension: C
  scale: nominal
  jd:
    section: S3
    presence: 2
    required: false
  cv:
    section: C4
    presence: 56
    prop: activity_experience
  compare: both
  note: 「做过客户验厂」这类经验只能从工作描述里读;描述标签只有 56/270。
- id: F.EXP_YEARS
  label: 总年限
  dimension: C
  scale: interval
  unit: 年
  jd:
    section: S3
    presence: 7
    required: true
  cv:
    section: C4
    presence: 267
    prop: years_stated
  compare: both
  note: 三个口径:平台文件名(被截断)/ 简历自述 / 逐段累计。要求必须声明用哪个。
- id: F.GENDER
  label: 性别
  dimension: A
  scale: nominal
  values:
  - 男
  - 女
  jd:
    section: S3
    presence: 3
    required: false
  cv:
    section: C1
    presence: 153
    prop: gender
  compare: both
  note: A 维无外部标准依据(LinkedIn 与 HR-XML 都无此字段),standard_ref 恒为 NULL。
- id: F.SKILL
  label: 技能
  dimension: D
  scale: nominal
  cardinality: set
  jd:
    section: S3
    presence: 10
    required: true
  cv:
    section: C5
    presence: 140
    prop: hasSkill
  compare: both
  note: 唯一 10/10 全员必写、且两侧都有实据的维度。词表见 component_catalog.yaml。
