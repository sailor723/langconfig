    这 8 行写的是「做什么」(负责部门品质目标管理 / 依IATF16949制定制度 / 完善质量标准 …),

    不是「要什么」。把职责段混进要求段,会让「公司要做的事」变成「候选人必须有的条件」,

    下游就会据此排除没做过这些事的人。

    典型例子是第 31 行的 IATF16949:它只出现在职责段里,本轮**没有**把它当作任职资格要求。
