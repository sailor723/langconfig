    覆盖 118 人」,目录 C.1 也写 prop=years_stated,但我查了 candidate 表的实际列
    (role / years_experience / education_rank / salary_min_k / salary_max_k / age / source_file …),
    **没有 years_stated 这一列**,只有 years_experience。所以「按声明值判」这个口径目前在库里执行不了,
    要么改要求库的 year_basis,要么补这一列 —— 两件都不在本轮授权内。
