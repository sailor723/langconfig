    model: deepseek-chat
    temperature: 0
    measured_from_resume: true
    subject: 专业
  origin: client
  granularity_decision:
    status: confirmed_keep
    basis: >-
      顿号连着的是同一个「优先」条件下的两类专业,命中任一即算满足,拆成两条会让同一份偏好被计两次权,
      而客户的「优先」是一件事,不是两件事。keep。
  note: >-
    这条大概率判不出「满足」:REQ-B-MAJOR 的判定规则明写「只按专业名点名,其余一律不满足,
    不使用专业门类」,而 value.in 里的「中文」「文秘」是门类/宽口径叫法,点不到具体专业名。
    因为 tier 是 desirable,判不满足不会排除人,代价是这半句偏好在打分里失效 ——
    要让它生效,得由客户列出具体专业名,不能我们补。

- id: VP-06
  requirement: REQ-C-YEARS-DOMAIN
  verbatim: 2年以上文职类、助理类、管理类工厂工作经验
  source_text: 经验要求：2年以上文职类、助理类、管理类工厂工作经验；
