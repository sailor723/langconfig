    num: 2
    domain: 文职/助理/管理
  llm:
    model: deepseek-chat
    temperature: 0
    measured_from_resume: true
    subject: 年限
  origin: client
  granularity_decision:
    status: confirmed_keep
    basis: >-
      三类经验是「或」的关系:客户要的是 2 年以上这类岗位经验,任一类成立即可。
      拆成三条独立的 essential 引用,会让下游读成「三类都要有」,把一条要求变成三条门槛。
      这条也是我在本次复审里最拿不准的一处判断 —— 若客户本意是「三类都得干过」,
      那必须由客户自己明写,不由我们拆。
  note: >-
    只能判年限,判不了「域」:REQ-C-YEARS-DOMAIN 的 partial 写明「领域限定需要 C.2 domain,
    该属性未建」,所以 2 年人资和 2 年文职在这条上得分相同。
    另一处含糊:客户加了「工厂」这个限定,库里没有对应属性,下游也判不了。

