- id: VP-03
  requirement: REQ-B-EDU-LEVEL
  verbatim: 全日制大专及以上学历
  source_text: 教育背景：全日制大专及以上学历，中文、文秘类专业优先；
  txt_line: 15
  tier: essential
  value:
    num: 3
  llm:
    model: deepseek-chat
    temperature: 0
    measured_from_resume: true
    subject: 学历
  origin: client
  granularity_decision:
    status: confirmed_keep
    basis: >-
      这里的「及」是「及以上」的组成部分(≥ 的写法),不是把两个要求连起来。实测门禁的机械筛子
      (_split_candidate)确实命中它:它的剥离正则 (及|或以)(上|下) 要求「及」后直接跟 上/下,
      而这里是「及」+「以」+「上」,剥不掉 —— 于是这条被判成拆分候选。筛子只当筛子用,理由还得人给。
      本条与 VP-04「全日制」已分成两条,不需要再拆。
  note: >-
    数值对得上:要求库 B.1 是 ordinal(2 中专/高中、3 大专),这条 value.num=3 对应「大专」,正确。
    含糊处在另一半:「全日制」单独成了 VP-04,而它挂的 B.3 属性未建 ——
    也就是说这条学历要求里「全日制」三个字目前判不了,能判的只有「大专及以上」。

