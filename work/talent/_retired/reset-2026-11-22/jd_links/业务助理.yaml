- id: 业务-04
  requirement: REQ-B-MAJOR
  verbatim: 市场营销、外语外贸、销售等专业者优先考虑
  source_text: 市场营销、外语外贸、销售等专业者优先考虑；
  txt_line: 15
  tier: desirable
  value:
    in:
    - 市场营销
    - 外语外贸
    - 销售
  llm:
    model: deepseek-chat
    temperature: 0
    subject: 专业
    measurable_from_resume: true
    requirement_reused: true
  origin: client
  granularity_decision:
    status: confirmed_keep
    why: >-
      verbatim 里的「、」是三个专业名的并列枚举,不是三条独立要求。拆成三条会让同一条要求
      (REQ-B-MAJOR)被引用三次、评分算三遍;而且这种「或」性枚举一拆,语义就从「任一满足」
      变成「都要满足」。客户原话的「等」原样保留,没有扩写成清单。
  note: >-
    keep,不拆(理由见 granularity_decision)。下游有三处拿不准:
    ①要求库 REQ-B-MAJOR 的判定口径是「只按专业名点名、其余一律不满足」,而那条口径是在品质经理的
    5 个词上定的;这份 JD 点的是另外三个词(市场营销 / 外语外贸 / 销售),在这份 JD 上跑会不会把
    相近专业(国际贸易、商务英语…)全判不满足,我没有实证;
    ②目录 B.2 major 的 cv_coverage 写 0,而 note_after_llm 说 LLM 抽出 201/270 人的专业 ——
    两个数打架,以哪个为准不归我定;
    ③「等」没收窄,客户到底只认这三个专业还是要更宽,只有客户能答。
    旁证(不是人数):在 work/talent/cv_facts.json 里能 grep 到「市场营销」8 次、「外语外贸」4 次、
    「销售」1 次,说明这三个词在候选人数据里确实出现过。
    tier 是 desirable,所以即使判不了也只影响加分,不影响排除。

