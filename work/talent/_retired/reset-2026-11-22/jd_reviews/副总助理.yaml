# 决策账本 —— 「谁、何时、为什么」这么定的独立记录。
#
# 本账本所有条目都是 signoff: pending —— 这轮复审由 agent 386 做,它没有 admin 的签字权。
# 所以这里不写 decided_by / decided_at:没发生过的签署不许补。
# 每条 why 记「按什么口径判的」,cost 记「这个口径的代价是什么」,等人点头。
#
# 范围:只登记粒度决定。这份 JD 的 `excluded` 是空的 —— 原文 45 行里没有「抬头/表格黏连」
# 那类不可判的行,所以没有排除决定要签。原文里也没有「没制定 / 暂无 / 待定」这类句子
# (已按 _UNDEFINED_RE 全量扫过 45 行,0 命中),所以 undefined_statements 为空。

jd: 副总助理
ref: jd_links/副总助理.yaml
decisions:

- id: D-副总助理-01
  kind: granularity
  subject: VP-03
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 15 行「全日制大专及以上学历」里的「及」不是并列连接词,是「及以上」的一部分(≥ 的写法)。
    所以它其实不是拆分候选;之所以出现在候选里,是门禁的剥离正则 (及|或以)(上|下) 要求「及」
    后面直接跟 上/下,而这里是「及」+「以」+「上」,剥不掉 —— 机械筛子的误报,实测确认。
    保留整条,因为它是一条连续的学历约束(全日制 + 大专 floor),拆成「全日制」「大专及以上」两条
    反而把一句话的语义关系弄丢了。这也正是「全日制」已经被单独立成 VP-04 的原因:
    真正该分开的不是「及」两边,而是「全日制」(属性未建、判不了)与「学历等级」(可判)这两件事。
  cost: >-
    代价是这条 verbatim 会一直被筛子当成候选(只要正则不改),下一轮复审还得再解释一遍。
    更实质的代价在内容上:VP-03 的 value.num=3 只锁住了「大专」这一半,
    「全日制」那一半挂在 VP-04、而 B.3 属性未建 —— 下游按 VP-03 判,会把一个自考大专判成满足。
    要收紧只有两条路:补 B.3 属性,或把「全日制」的取舍问客户。两条都不在本步权限内。

- id: D-副总助理-02
  kind: granularity
  subject: VP-05
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 15 行「中文、文秘类专业优先」里的顿号连的是同一个「优先」条件下的两类专业,命中任一个即算满足。
    拆成两条会让同一份偏好被计两次权 —— 而客户的「优先」是一件事,不是两件事。
    所以 keep,一条引用、value.in 两个词。
  cost: >-
    不拆没有拆分代价。真正的代价在口径上:要求库 REQ-B-MAJOR 的判定规则是「只按专业名点名,
    其余一律不满足,不使用专业门类」,而「中文」「文秘」是门类/宽口径叫法,点不到具体专业名 ——
    这条大概率对所有人都判「不满足」。因为 tier 是 desirable,它不会排除人,
    代价只是这半句偏好在打分里恒为 0。要让它生效得由客户列具体专业名,不由我们补。

- id: D-副总助理-03
  kind: granularity
  subject: VP-06
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 16 行「2年以上文职类、助理类、管理类工厂工作经验」—— 三类经验是「或」的关系:
    客户要的是「2 年以上这类岗位的经验」,任一类成立即可。年限阈值全句只有一处(2 年)。
    拆成三条独立的 essential 引用,下游会读成「三类都要有」,把一条门槛变成三道门槛,
    一个做了 5 年行政助理的人会在「管理类」那条上被判不满足。所以 keep。
  cost: >-
    这是本次复审我最拿不准的一条:**「或」是我对顿号+「类」的解读,不是客户写的字**。
    客户原话只有顿号和「类」。若客户本意是「三类都得干过」,那 keep 就判宽了 ——
    但把它拆成三条同样不对(会变成必须三类都有,而客户也没这么写)。
    正确做法是问客户,不是我们选一边。另外「工厂」这个限定库里没有对应属性,
    下游判不了:2 年非工厂的文职和 2 年工厂文职同分。

- id: D-副总助理-04
  kind: granularity
  subject: VP-16
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 19 行「熟练掌握Office办公软件（Word/ Excel/ PPT/ AI）」—— 括号里是这一个要求的构成要件,
    不是并列的四条要求,客户写的是一个复合能力。而且拆了也不产生可判信息:
    要求库 REQ-D-OFFICE 的 components 只有 skill_Word / skill_Excel / skill_PowerPoint,
    AI 在 unlinked_parts 里显式留空(gap P5)—— 把 AI 拆成独立一条,它依然没有组件可判。
    所以 keep,一条引用、op=holds。
  cost: >-
    代价是「AI」这个要件在判定里彻底消失:这条实际只能判「会不会 Office 三件」,
    会 AI 的人与不会的人在 VP-16 上同分。库里注明这个坑的来历(老正则把 "AI" 认成
    skill_Illustrator,导致 8 人凭空匹配)—— 现在留空是对的,但留空意味着能力不可见。
    另一处代价是「熟练」:客户没给标准,下游只能判「会/不会」。
    我没有拆,也没有替「熟练」编阈值 —— 这两件都要客户答。
