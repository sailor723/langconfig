# 决策账本 —— 「谁、何时、为什么」这么定的独立记录。
#
# 本账本所有条目都是 signoff: pending —— 这轮复审由 agent 386 做,它没有 admin 的签字权。
# 所以这里不写 decided_by / decided_at:没发生过的签署不许补。
# 每条 why 记「按什么口径判的」,cost 记「这个口径的代价是什么」,等人点头。

jd: 业务助理
ref: jd_links/业务助理.yaml
decisions:

- id: D-业务助理-01
  kind: granularity
  subject: 业务-04
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 15 行「市场营销、外语外贸、销售等专业者优先考虑」里的「、」是三个专业名的并列枚举,
    不是三条独立要求。判据是拆开之后语义会变:客户的意思是「这三个专业里任一个,优先」,
    拆成三条就变成三条各自独立的要求,一个市场营销专业的人会在另外两条上被判不满足,连 desirable 都保不住。
    另外同一条要求(REQ-B-MAJOR)被三条引用覆盖,评分会算三遍。所以 keep。
  cost: >-
    不拆的代价在这里:「等」字原样保留,于是这份 JD 的专业口径宽到什么程度没人知道 ——
    按要求库现在「只按专业名点名」的口径,名字不在这三个词里的专业(国际贸易、商务英语…)一律判不满足,
    而客户写了「等」。这不是拆不拆能解决的,要客户答。还有一处要 admin 看:目录 B.2 的 cv_coverage 写 0,
    但 note_after_llm 说 LLM 抽出 201/270 人的专业,两个数对不上,下游覆盖率按哪个算没法从这份文件判。

- id: D-业务助理-02
  kind: granularity
  subject: 业务-05
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 16 行「2年以上业务助理或相关工作经验」里的「或」是同一约束内部的等价说法:
    做过业务助理,或做过与之相关的工作,都算。年限阈值全句只有一处(2 年以上),
    拆开不会产生任何新的可判信息,只会把一句话切成两个互斥半句 —— 一个真有 3 年业务助理经验的人,
    在「2年以上相关工作经验」那半句上反而会被判不满足。所以 keep。
  cost: >-
    无拆分代价。真正的代价在「相关」两个字上:客户没定义什么算相关,要求库的 C.2 职能域也没建
    (prop_exists: false),所以这条下游只能判年限、判不了领域 —— 「10 年人资」与「10 年业务助理」同分。
    要收紧只能问客户「相关」指哪些岗位,这不是账本能定的。

- id: D-业务助理-03
  kind: granularity
  subject: 业务-11
  decision: confirmed_keep
  signoff: pending
  why: >-
    第 19 行「具备良好的沟通协调能力」不在拆分候选里:两个动作没有用「及 / 、 / 或 / 和」连接,
    而是合成词「沟通协调」,按本轮的信号口径筛不出来。所以按规则判 keep,不拆。
    之所以还是登记一条,是因为它在语义上可能该拆两条 —— 登记的是「我没有拆,以及为什么」,
    而不是「我判定它不该拆」。
  cost: >-
    若确实该拆而没拆:一个协调强、沟通弱的人不会被单独扣分,这也是 E 维本来就判不了的结果 ——
    REQ-E-COMMUNICATION 是 assessable: false、no_component: true,E 维在本目录没有任何组件。
    所以这条拆不拆,对下游分数的影响都是 0;影响的是面试评分表怎么设计。要不要拆,等人点头。

- id: D-业务助理-04
  kind: granularity
  subject: 业务-12
  decision: confirmed_split
  signoff: pending
  why: >-
    第 19 行原话是「具备良好的沟通协调能力和团队合作精神」——「和」把两件事连在一起,
    一个是能力(沟通协调)、一个是态度(团队合作),评分口径完全不同,必须拆。
    本草稿已经拆成 业务-11 + 业务-12 两条,拆的动作已经落地,本条目只登记这个判断。
  cost: >-
    拆的代价是:两条都落在同一行(第 19 行),行级统计里这一行会被算两次 —— 这是拆分的正常结果,
    不是重复计分,但下游若按行去重会少算一条。另:两条都判不了(E 维无组件),拆开只是让
    面试评分表能分开打分,不影响简历筛分。
