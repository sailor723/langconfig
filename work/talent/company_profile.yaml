# 公司画像 —— **所有 AI 模拟值的唯一来源**。
#
# 为什么要集中在一处：客户 10 份 JD 里有 10~18 格是空的（班制、环境、劳保、工作地点、
# 薪资预算、职级、编制、招聘原因…）。如果每份 JD 各自"编"一遍，同一条班制在 5 份 JD 里会
# 出现 5 个说法，最后没人知道哪个是真的。这里写**这家公司（东莞线束/连接器厂）的默认口径**，
# 模拟时统一从这里取，并在定稿里逐格标 `AI 模拟`、写明待谁确认。
#
# 任何一条被客户确认后，改这里 + 重跑 mock_fill_jd，五份 JD 一起更新。
# basis 一律 mock：**未经客户确认前不进判定**。

_doc: 公司画像（AI 模拟值的唯一来源，未经客户确认）
updated: '2026-11-24'

company:
  name: （客户名待补）
  industry: 线束 / 连接器 / 汽车零部件（出口为主）
  location:
    plant: 东莞厂区（具体镇区待客户给）
    dormitory: true
    shuttle: true              # 有厂车
  shift_policy: 生产两班倒；办公室常白班；品质/工程岗随产线跟班
  ppe_policy: 进车间护目镜 + 静电手环；浸锡/注塑区耳塞
  environment: 有噪音（压接/注塑）、少量粉尘与助焊剂气味；通风区域作业
  physical: 巡检需站立走动；无重物搬运（≤10kg）
  hiring_policy: 替补优先；替补可适度放宽年限，新增编制需预算审批
  headcount_policy: 一个课/岗原则配 1 人，产线岗按编制
  contract: 全职（劳动合同制）
  probation: 3 个月
  social_insurance: 按东莞市规定缴纳
  background_check: 品质/关务/财务等敏感岗做入职背调（无犯罪 + 学历核验）
  confidentiality: 接触客户图纸/BOM/体系文件的岗位签保密协议；竞业仅在涉密核心岗谈
  commute: 单程 ≤ 60 分钟（有厂车）

grade_scale:                  # 职级台阶（用于套档，未经客户确认）
  员工岗: E2（员工）
  经理岗: M1（课级主管）
  note: 岗位名带"经理"不等于经理岗 —— 以原文「直接下属」栏为准（品质经理实测为员工岗）

salary_bands:                 # 挂牌区间（K），按岗位类别给默认；客户给预算后以客户为准
  员工岗: 8~12K，预算上限 12K
  经理岗: 10~14K，预算上限 14K

purpose_template: '{jd}：在{department}内承担该岗位的核心职责，按公司标准与客户要求交付结果。'
kpi_template:
  - 岗位目标按时完成率
  - 客诉/返工件数下降
  - 报表与异常闭环及时
