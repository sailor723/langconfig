# 电话初筛记录 · 廖明辉 · 2026-11-20
#
# 这份文件回答的是"简历没写的那些字段"。它**不是简历内容**,
# 所以在定稿里标 interview,与 resume(原文)/ derived(推算)分开。
#
# 为什么要分开:简历是候选人写给招聘平台的,访谈是候选人对我们说的。
# 两者都可能不准,但**责任方不同** —— 简历错了是简历的事,访谈错了是我们记录的事。
# 混成一个来源,出了问题查不出是哪一环。
#
# 使用的字段 id 来自 work/talent/field_schema.yaml 的规范 id(F.*),
# 与简历定稿同一套 —— 这样访谈补的值可以直接并进同一张表。

candidate: cand_廖___品质经理_NPI经理_研发经理
channel: 电话初筛
date: 2026-11-20
interviewer: (我方)
duration_min: 25

answers:

  # ── 基本信息 ──
  - field: F.CV_FULL_NAME
    question: 简历上的姓名 OCR 不清楚,能确认一下全名吗?
    answer: 廖明辉
    note: 原件为「廖__」,平台档案里也只有前两字

  - field: F.CV_NATIVE_PLACE
    question: 籍贯是哪里?
    answer: 广东梅州

  - field: F.CV_MARITAL_STATUS
    question: 婚姻状况?
    answer: 已婚

  - field: F.WORK_LOCATION
    question: 现在住东莞哪个镇?到石排通勤方便吗?
    answer: 住石排镇,离厂区骑车 15 分钟
    note: "这一条很关键 —— 岗位工作地点还没定,但候选人在同镇,通勤不构成障碍"

  - field: F.WORK_LOCATION
    props: {commute_ok: true}          # 住石排 + 能接受在石排上班 → 通勤意愿成立
    question: 如果在石排上班,你能接受吗?
    answer: 可以,我现在就住石排,骑车十五分钟

  - field: F.CV_PHONE
    question: 联系电话?
    answer: 186****1653(与简历一致,后四位核过)

  - field: F.CV_EMAIL
    question: 电子邮箱?
    answer: 与平台档案一致,已核对

  # ── 求职意向 ──
  - field: F.AVAILABILITY
    question: 最快什么时候能到岗?
    answer: 一个月,现在这家要交接

  - field: F.SALARY
    props: {salary_max_k: 25}          # 25K 可谈 → 期望上限 25K/月
    question: 期望薪资 20-30K,能接受到多少?
    answer: 25K 左右可谈,主要看岗位职责范围

  - field: F.CV_CURRENT_SALARY
    question: 目前年薪大概?
    answer: 约 28 万(含年终)

  # ── 教育(CV 三段都没写专业与层次)──
  # 一条回答覆盖三个字段,拆成三条记录,不对一条回答编多个值。
  - field: F.EDU_LEVEL
    question: 三段学历分别是什么层次?
    answer: 广东司法学校中专;东莞职业技术学院大专(2019-2022,在职读);暨南大学自考本科(2019-2024)
    note: |
      简历三段只写了校名,**没写层次**。访谈确认最高层次为本科(自考)。
      平台原先按校名带「大学」推断为本科 —— 那是 inferred;这次是候选人自述,来源升为 interview。

  - field: F.EDU_MAJOR
    question: 三段学历分别是什么专业?
    answer: 中专法律事务;大专机电一体化技术;本科工商管理
    note: |
      简历三段**只有校名,没有专业** —— 所以简历阶段这个字段是空的,不是候选人缺什么,是原文没写。
      访谈补齐后:大专=机电一体化技术,本科=工商管理,中专=法律事务。
      三段专业不同,所以这个字段在定稿里保留全部三段,不折叠成最高学历那一档。

  - field: F.CV_INSTITUTION
    question: 三段学历的学校分别是?
    answer: 广东司法学校(中专)/ 东莞职业技术学院(大专)/ 暨南大学(自考本科)
    note: 与简历原文一致,仅补全层次与专业

  - field: F.EDU_FULLTIME
    question: 这三段都是全日制吗?
    answer: 中专是全日制;大专和本科都是工作后读的,非全日制
    note: "岗位未要求全日制(那是副总助理的要求),所以这一条对本岗无影响"

  # ── 客户验厂 ──
  - field: F.EXP_ACTIVITY
    question: 简历写「熟练应对二方与三方审核」—— 具体是客户来你们厂审核,还是你们去审供应商?
    answer: |
      客户来我们厂是主要的:日系客户每年一次,欧美客户两年一次,
      从首次会议、现场巡查、文件抽查到末次会议全程由我接待主答,
      不符合项由我出整改计划并跟进关闭。供应商那边我也带队审,但那是第二位的。
    note: |
      **这是本次访谈信息量最大的一条。**
      简历原文只写「熟练应对二方与三方审核」——这句话读不出"客户来审"还是"我们去审",
      也读不出频次与角色。抽取器按这句话提出过「客户验厂」这个能力项,
      但那只是措辞到词表的映射,**不能据此认定她接待过客户验厂**。
      访谈确认:她是**被审核方的主接待人**,日系一年一次、欧美两年一次,
      从首次会议到不符合项关闭全程负责。这才叫有实据。

  - field: F.SKILL
    question: 举个例子,最近一次客户验厂什么情况?
    answer: |
      2025 年 8 月一家日系客户来审,开了 3 个不符合项:巡检记录缺签字、供应商来料报告格式不对、培训记录缺考核结果。
      三个都两周内关闭,复评通过。
    note: 细节具体、可追问(不符合项类别、关闭周期),不是套话

  # ── 语言 ──
  - field: F.LANGUAGE_LEVEL
    establishes: [skill_英语, skill_8D报告]     # 这条回答坐实的是这两件具体能力
    question: 岗位要「英语口语熟练 + 独立书写英文 8D 报告」,你的英语到什么程度?
    answer: 英文 8D 报告可以独立写,这几年客户报告都是我出的;口语一般,能开会交流但不算流利,日系客户主要靠翻译
    note: |
      「英语好」在这种岗位上其实是两件事:能不能写(书面产出)、能不能开口(现场沟通)。
      访谈只坐实了前者。口语自评"一般",**没有任何客观刻度**,
      所以这一条在定稿里就按原话记,不给它安一个等级。

  # ── 按采集清单补问的三条(CV 里拿不到,而 join 要用)──
  - field: F.SKILL
    establishes: [skill_品质问题分析]
    question: 品质问题分析这块你具体怎么做?举一次:上次是什么时候、你负责哪一段。
    answer: |
      每月的品质周报我都自己做:把不良按类别拆开、算 Top3、找原因再定对策。
      2025 年 3 月高速线那道,成品直通率从 92% 掉到 86%,我从巡检记录里查出是
      一台裁线机的刀模磨损,换刀模之后一周内回到 93%。
    note: 具体到时间、数字、动作 —— 不是"我懂品质分析"这种话

  - field: F.SKILL
    establishes: [skill_6S]
    question: 6S 你们厂做到什么程度?你管过吗?
    answer: |
      6S 是车间在做,我这边负责稽核:每周走一次现场,把照片贴到看板上要求限期整改。
      不是我亲手推开的大项目,但现场问题我天天在看。
    note: "**只声称稽核,不声称主导** —— 这一条按「接触过」记,不按「推行过」记"

  - field: F.COMPETENCY
    question: 「有良好的沟通协调能力」—— 举一个你和别的部门有冲突、最后协调下来的例子。
    answer: |
      去年供应商一批端子镀层不合格,采购说换供应商影响交期,我坚持退货。
      最后是把这批挑出来 100% 全检、让步接收一部分,同时让采购同步开发第二家。
      交期没耽误,第二批也换了供应商。
    note: |
      **E 维没有组件,这条入不了 join** —— 只能进人看的部分。
      记录它是因为面试里问了,不是因为能算分。

  # ── 其他 ──
  - field: F.CV_PROJECTS
    question: 简历里没写项目经验,有没有代表性的?
    answer: |
      2023 到 2025 在讲盛达主导过一条新能源汽车 PACK 储能柜的线束品质导入:
      从 PPAP 提交、CPK 达标验证到量产放行,客户是欧美的,审核一次通过。

  - field: F.CV_TRAININGS
    question: 参加过什么培训?
    answer: |
      ISO9001 与 IATF16949 内审员培训(有证书),五大工具(APQP/PPAP/FMEA/SPC/MSA)培训,另上过一门精益生产。

