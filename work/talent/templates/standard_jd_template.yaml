# ── 没进模板的字段，逐条写明去哪了（防止下次有人以为是漏了）
dropped:
  - code: F.JD_PAGE_COUNT
    why: 文档控制：属于表单规范，不是岗位信息
  - code: F.JD_APPROVERS
    why: 文档控制：核准/审核/制订是签核流，招聘里由审批链代替
  - code: F.JD_DOC_NUMBER / F.JD_VERSION / F.JD_FIRST_ISSUED / F.JD_REVISION_HISTORY
    why: 文档控制全套：版本历史不随招聘走
  - code: F.JD_OCCUPATION_CODE
    why: 《职业分类大典》编码：对外发布用，判定与招聘流程都不用
  - code: F.JD_DUTY_WEIGHT
    why: 折进 F.JD_DUTY_ITEMS（权重是职责行的一个属性）
  - code: F.JD_DUTY_COMPETENCY
    why: 折进 F.JD_DUTY_ITEMS（映射是职责行的可选列）
  - code: F.MGMT_SPAN
    why: '折进 F.SUPERVISES（管理幅度就是"直接下属几人、什么层级"）'
  - code: F.SHIFT_HANDOVER
    why: 折进 F.SHIFT（排期与交接属于班制）
  - code: F.JD_WORK_HOURS
    why: 折进 F.SHIFT（工时是班制的一部分）
  - code: F.TEAM_GOAL
    why: 折进 F.JD_SUCCESS_CRITERIA（部门目标要落成可量化指标才有用）
  - code: F.EXP_ACTIVITY
    why: 活动经验：校园/社团活动，这 5 个岗位都不据此判定
  - code: F.EXP_INDUSTRY
    why: '行业并入 F.EXP_DOMAIN：客户写"线束行业 5 年"是一条要求不是两条'
  - code: F.JD_CLEAN_RECORD
    why: 与 F.CLEARANCE 重复，保留后者（CV 侧同名同义，两侧可比）
  - code: F.JD_NON_COMPETE
    why: 折进 F.JD_CONFIDENTIALITY（竞业与保密同一份协议谈）
  - code: F.JD_PROBATION / F.JD_SOCIAL_INSURANCE
    why: 劳动合同条款，不是岗位说明书内容
  - code: F.JD_DATE_POSTED / F.JD_VALID_UNTIL
    why: 发布渠道里填（招聘平台有时间字段），不进说明书
  - code: F.JD_POSTING_CHANNEL
    why: 发布动作，不是岗位信息
  - code: F.JD_TRAVEL
    why: 招聘启事的话术，不是判定数据 → 需要时按岗位补
  - code: F.JD_ACTIVITY_SEQ / _DURATION / _FORM / _SOP / _AI_FIT
    why: 作业明细的列：按需在明细表里带，不单列成模板字段
