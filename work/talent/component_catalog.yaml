# ══════════════════════════════════════════════════════════════════════════
# 已知缺口 —— 写下来,免得被当成"已经全了"
# ══════════════════════════════════════════════════════════════════════════
gaps:

  - id: P1
    what: E 维度 24 条素质要求没有任何组件
    why: 素质不是技能,不能塞进 components。需要一张独立的素质词表(沟通/责任心/执行…),而它**永远连不到供给侧**。
    consequence: 需求侧的 25% 会是一个孤立子图。

  - id: P2
    what: F/G 维度没有任何组件
    why: 10 份 JD 只出现 1 条资质 + 3 条合规,而且都没有对应属性。
    consequence: 可以先空着;真要用时再建。

  - id: P3
    what: 语言熟练度没有刻度来源
    why: JD 只写「口语熟练」,简历只写「英语」或「CET-6」。CEFR 是标准刻度,但语料里没有映射。
    consequence: H.2 的 6 档暂时无法从简历判定。

  - id: P4
    what: 53 个技能是"抽取认出的",不是"行业全量"
    why: 语料只有 277 份简历、10 份 JD。
    consequence: |
      R4 已经允许组件没有出处,所以词表可以扩。但每扩一个都要问:证据在哪?
      现在这 53 个的证据是 cv_count > 0 —— 至少有一个人的简历里有它。

  - id: P5
    what: 5WHY 在 JD 里出现,但没有组件
    why: 品质经理第 8 条写「QC七大手法、5WHY、SPC、CPK、6S」,其中 5WHY 从未被抽取成技能。
    consequence: 这条复合要求目前只能落到 4 个组件,少 1 个。

# ══════════════════════════════════════════════════════════════════════════
# 门禁
# ══════════════════════════════════════════════════════════════════════════
validation:

  - id: C-G1
    rule: 每个中间层元件有 cardinality,且 single 必须给 scale
    why: R3。没有 scale 就无法比较 ≥,那是之前 55 vs 1 的根源。

  - id: C-G2
    rule: single 的 values 若可枚举,顺序必须单调(ordinal/interval)
    why: 顺序错会让 ≥ 判反。

  - id: C-G3
    rule: JD 引用组件时必须带 verbatim,且 verbatim 必须是该 JD 原文的逐字子串
    why: R4。约束引用而不是词表;这条是 `AI→Illustrator` 这类错的解药。

  - id: C-G4
    rule: components[*].category 必须存在于 categories[]
    why: 防止类别被随手扩增。

  - id: C-G5
    rule: categories[*].component_count 必须等于该类别下实际组件数
    why: 防止目录与实际脱节 —— 数字写死过就再也对不上了。

  - id: C-G6
    rule: 每个组件的 cv_count 必须与供给侧实测一致
    why: 词表如果和语料对不上,说明有人在手改。

  - id: C-G7
    rule: prop_exists=false 的中间层元件不得被任何"已判定"的要求引用
    why: 属性没建就标可判,是这套系统最初的错。
