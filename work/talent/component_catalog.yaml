  cardinality: single
  scale: interval
  unit: 年
  values: null
  prop: avg_tenure_years
  prop_exists: true
  cv_coverage: 243
  standard_ref: null
  note: '**算法**:从「工作经历」切出的每段起止,按月相减,取均值。

    「至今」按 REF=2026-11 算(这是决定,换 REF 会改变所有人的值)。

    243/270(90%)可算;切不出起止的 27 份留空,**不填 0** —— 填 0 等于判人零在职。


    原来是"最长一段",改成均值:HR 关心"是不是一直在换",最长一段回答不了这个问题

    (有人一段很长、其余都很短)。算法见 scripts/talent/derive_hr_facts.py。

    '
- id: C.7
  dimension: C
  label: 近 5 年任职段数
  cardinality: single
  scale: interval
  unit: 段
  values: null
  prop: recent5y_segments
  prop_exists: true
  cv_coverage: 243
  standard_ref: null
  note: '**算法**:同一批工作段,只留「结束月 ≥ REF-60」的,数段数。

    两段之间的空窗期不算段,也不单独成项 —— 简历很少写空窗期,

    按段数是能算的极限,**不能声称它等于"换过几家公司"**(OCR 缺公司名时更算不准)。

    实测:1 段 25 人 / 2 段 48 人 / 3 段 49 人;平均在职中位 2.5 年。

    '
