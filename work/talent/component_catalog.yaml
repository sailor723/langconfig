    \ 是上限不是真值\n  ② 简历头部「15年」        候选人自述 —— 118 人,精确但无人核对\n  ③ 工作经历逐段累加        唯一**可重算**的\
    \ —— 54 人,需要逐段抽取 + 重叠/空档规则\n本属性 = ②(声明值)。③ 另立 C.6。① 保留在 ABox 现有 years_experience\
    \ 里不动。\n为什么不合成一个:10 和 23 不是同一个量。合成会让\"一致率 31%\"看起来像 69% 的错误率,\n然后有人会去\"修\"它,把对的改成错的。\n"
  standard_ref: O*NET Job Zone
  note: '148/277,129 份没读到。实测分布:1年16 · 2年10 · 3年10 · 4年15 · 5年13 · 6年7

    · 7年8 · 8年7 · 9年7 · 10年52 · 15年3。

