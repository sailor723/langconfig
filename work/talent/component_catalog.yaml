    无处安放(它既是活动,又不像技能那样只看会不会)。制造业 JD 里这类很多:

    验厂、客户接待、参展、稽核、异常处理。

    现状:其中一部分已被当作技能收进 components(如 skill_客户验厂),先兜住;

    真正需要区分"有没有做过"时,用本属性。

    '
- id: C.6
  dimension: C
  label: 总年限(逐段累计)
  cardinality: single
  scale: interval
  unit: 年
  values: null
  prop: years_computed
  prop_exists: false
  cv_coverage: 0
  added: 2026-11-20
  note: '唯一**可重算**的年限口径:把所有工作经历的起止区间累加,重叠只算一次,空档不补。

    为什么现在是 prop_exists=false:要它成立,必须先做一件现在没做的事 ——

    **逐段抽出所有区间**(而不是像现在这样只引用了某一段),再由门禁验"各段之和 = 总年限"。

    在此之前,任何"累计年限"都是不可验证的数字(实测:LLM 给的 54 条,引文只支持其中一段)。

    要求若要按这个口径判,必须在要求上声明 year_basis: computed。

    '
