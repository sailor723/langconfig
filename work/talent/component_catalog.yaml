# component_catalog.yaml —— 组件目录(唯一的能力全集)
#
# 这份文件不是任何一份 JD 的要求清单,也不是任何一个人的简历摘要。
# 它是一份**受控词表**:这个行业里"可以被要求、也可以被具备"的东西,全集在这里;
# JD 和简历各自只是它的一个**子集投影**。
#
#        组件目录（本文件）
#         ▲              ▲
#    JD 链接它的子集   简历链接它的子集
#    (一份 JD 连 2~11 个)   (一个人通常连 10~30 个,而且远不全)
#
# 为什么要有它(而不是继续用 JD 里的自由文本):
#   之前同一件事被写了三遍 —— reasoning.ttl 的公理、requirement 表、abox.ttl 的 role 个体
#   —— 于是公理判 204 人、闸门判 299 人、交集 38 人(一致率 13%)。
#   根因不是算法,是**同一个组件没有唯一 ID**。这份目录提供那个 ID。
#
# 四条已定的规矩(R1–R4 见 rules:)决定了本文件的形状。
#
# 校验:backend/scripts/talent/check_component_catalog.py
# 口径来源:`jd_schema.yaml` 的维度骨架 + `skill` 表的实测词表 + 各 JD 的逐字原文。
# 所有 coverage 数字都是 2026-11-19 在 277 份简历上实测的,不是估计。

version: 1
scope: 东莞 · 线束/连接器制造业 · 10 份职务说明书 × 277 份简历
measured: 2026-11-19

# ══════════════════════════════════════════════════════════════════════════
# 规矩(四条,已确认)
# ══════════════════════════════════════════════════════════════════════════
rules:

  R1_独立:
    内容: 组件目录独立于任何一份 JD,不隶属供需任一方。
    为什么: 它的名字里不该有"template" —— 它不属于哪份文件,它是全集。
    落地: 本文件的 components 段里**没有** `jd` 字段。JD 引用组件时才写出处。

  R2_三层:
    内容: 维度 → 中间层 → 组件。中间层在 D 维度叫"类别",其余维度叫"属性"。
    为什么: 技能有几千个,必须有领域分组才找得到;学历只有 5 档,不需要再分组。
    落地: D 用 `categories`(22 个);A/B/C/E/F/G/H/I 用 `attributes`(22 个)。

  R3_基数:
    内容: "每个中间层元件必须标 `cardinality: single | set`。"
    为什么: |
      一个人**恰好有一个**学历 → JD 说阈值(≥大专),比较需要顺序。
      一个人**可能有多个**技能 → JD 说子集(要 Excel 和 Word),比较是找边。
      两者混成一套,`≥` 就永远表达不出来(实测教训:把年限/学历当成员判定时,
      三者齐备的人只有 1/277,合格人数从 55 塌到 1)。
    落地: single 必须给 `scale` 或 `values`;set 必须给 `prop`。

  R4_出处:
    内容: |
      组件本身**不需要**出处 —— 全集是"这个行业有什么",不依赖某份 JD。
      但**每一次 JD 对组件的引用,必须给逐字原文**。
    为什么: |
      老规矩("没有 JD 出处的行不许进表")把它用在了错误的层级上:它该约束的是
      **引用**,不是**词表**。约束词表会让词表永远只有 53 个词,因为只有被抽出来的才准进。
    落地: "`components[*].evidence` 可选;JD 侧引用一律带 `verbatim`(见 validation: C-G3)。"

# ══════════════════════════════════════════════════════════════════════════
# 维度(9 个,封闭)
# ══════════════════════════════════════════════════════════════════════════
# count = 10 份 JD 里该维度的原子要求条数(合计 95)。它描述"需求侧现在用了多少",
# 不是"这个维度该有多少组件" —— 后者才是本文件要给的。
dimensions:

  - {id: A, label: 人口属性,     cardinality_mix: single,       count: 8,  jds: 5,  standard_ref: null,
     note: "★ 本地扩展:LinkedIn 与 HR-XML 都没有 gender/age 字段。依据是客户 JD,不是标准。"}
  - {id: B, label: 教育,         cardinality_mix: single,       count: 17, jds: 10, standard_ref: "HR Open Standards EducationRequirement"}
  - {id: C, label: 经历,         cardinality_mix: single,       count: 13, jds: 9,  standard_ref: "O*NET Job Zone / Work Experience"}
  - {id: D, label: 技能,         cardinality_mix: set,          count: 28, jds: 10, standard_ref: "ESCO essential/optional · O*NET Tools & Technology",
     note: "唯一 10/10 全员必有、且供给侧已有数据的维度。中间层用 categories。"}
  - {id: E, label: 素质能力,     cardinality_mix: set,          count: 24, jds: 9,  standard_ref: "HR Open Standards Competency · O*NET Abilities",
     note: "占全部要求 25%,且结构性不可从简历判定。它会在图里形成一个连不到供给侧的孤立子图 —— 那是事实,不是缺陷。"}
  - {id: F, label: 资质证书,     cardinality_mix: set,          count: 1,  jds: 1,  standard_ref: "人社部《国家职业技能标准》/ O*NET Credentials"}
  - {id: G, label: 合规约束,     cardinality_mix: set,          count: 3,  jds: 3,  standard_ref: "ISO/TC 260 / 公司章程"}
  - {id: H, label: 语言,         cardinality_mix: set,          count: 1,  jds: 1,  standard_ref: "HR Open Standards Language / CEFR",
     note: "从 D 拆出来:「会英语」与「能独立写英文8D报告」是两个判定。"}
  - {id: I, label: 身体条件,     cardinality_mix: single,       count: 0,  jds: 0,  standard_ref: "HR Open Standards PhysicalRequirement",
     note: "当前 0 条,但制造业厂区(噪音/粉尘/站立)迟早出现。先留位,避免以后新开维度。"}

